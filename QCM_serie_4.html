<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Série 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM — 25 questions</h1>
<p class="lede">Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"La garantie minimale de rémunération de l'amplitude mensuelle se calcule :","o":["amplitude cumulée du mois × 75 %, ou amplitude cumulée du mois − 63 h, et comparaison avec le temps de service","amplitude cumulée de la semaine × 25 % ou − 3 h, et comparaison avec le temps de service","suivant un barème de la convention collective des transports routiers et des activités auxiliaires du transport","n'existe plus depuis le 1er février 2000"],"c":0},{"q":"L'accord sur le travail de nuit prévoit une période nocturne de :","o":["22 h à 5 h","21 h à 6 h","24 h à 5 h","21 h à 3 h"],"c":1},{"q":"Un transport en compte propre, effectué à l'aide d'un véhicule de 40 t de poids maximum autorisé, pris en location sans conducteur, doit être notamment couvert par :","o":["une copie conforme de la licence communautaire du loueur","une copie conforme de la licence communautaire du transporteur et la feuille de location","une feuille de location ou copie du contrat de location","une lettre de voiture du transporteur et la feuille de location"],"c":2,"r":["En compte propre, l'entreprise transporte ses propres marchandises : elle n'a pas besoin de licence de transport public.","Le véhicule pris en location doit simplement avoir à bord un justificatif de la location."]},{"q":"Le montant de la capacité financière exigible des entreprises est fonction du :","o":["type d'activité de l'entreprise : transport ou location","nombre et du poids maximum autorisé (PMA) des véhicules à moteur exploités","statut juridique de l'entreprise","nombre de salariés par rapport au capital social"],"c":1,"r":["La capacité financière suit un barème réglementaire par véhicule (un montant pour le premier, puis un montant par véhicule supplémentaire), différent pour le léger (−3,5 t) et le lourd (+3,5 t)."]},{"q":"En transport national, monsieur Lambert a reçu ses marchandises le jeudi à 11 h 00 ; en cas de litige, il doit confirmer par écrit ses réserves au transporteur au plus tard le :","o":["dimanche 24 h 00","lundi suivant 11 h 00","lundi suivant 24 h 00","mardi suivant 11 h 00"],"c":2,"r":["Le destinataire dispose de 3 jours (hors dimanches et jours fériés) pour notifier ses réserves par lettre recommandée (art. L133-3 du Code de commerce).","Réception jeudi : vendredi = jour 1, samedi = jour 2, dimanche ne compte pas, lundi = jour 3.","Le délai expire donc le lundi suivant à 24 h 00."]},{"q":"Selon le contrat type dit « général » applicable aux transports publics de marchandises, l'identification du véhicule a lieu :","o":["à partir du moment où le véhicule arrive sur le site de chargement","à partir du moment où le véhicule arrive sur le site de chargement ou dans l'aire d'attente, et où le transporteur avise le donneur d'ordre qu'il est prêt à charger","à partir du moment où le donneur d'ordre accepte de charger le véhicule","à partir du moment où le transporteur accepte que le donneur d'ordre procède au chargement de son véhicule"],"c":1,"r":["L'identification, qui déclenche les temps d'attente et de chargement, se produit dès l'arrivée au site ou en aire d'attente, couplée à l'avis de mise à disposition donné au donneur d'ordre."]},{"q":"Lorsque les parties n'ont pas établi de contrat écrit, le contrat type dit « général » applicable aux transports publics routiers de marchandises s'applique :","o":["exclusivement aux envois de 3 tonnes et plus pour lesquels il n'existe pas de contrat type spécifique","exclusivement aux envois inférieurs à 3 tonnes pour lesquels il n'existe pas de contrat type spécifique","concomitamment avec tel ou tel contrat type spécifique","aux envois pour lesquels il n'existe pas de contrat type spécifique"],"c":3,"r":["Le contrat type « général » joue par défaut (à titre subsidiaire) dès qu'aucun contrat écrit ni contrat type spécifique (citernes, animaux vivants, véhicules, envois < 3 t…) n'a été conclu."]},{"q":"Il y a contrat de transport juridiquement formé lorsqu'au minimum :","o":["les parties sont d'accord sur la nature et le prix de la prestation à fournir, même au cours d'un simple entretien téléphonique","les parties se sont obligatoirement entendues par acte écrit sur la nature et le prix de la prestation","le transport a effectivement commencé et le document de transport a été dûment complété","le document de transport a été émargé par les parties concernées : client et transporteur"],"c":0,"r":["Le contrat de transport est consensuel : l'accord des volontés suffit à le former, sans qu'un écrit soit obligatoire à sa formation."]},{"q":"Dans le cadre du contrat type dit « général », pour le transport d'envois égaux ou supérieurs à 3 tonnes, il appartient au transporteur :","o":["de déterminer les points de chargement et de déchargement","de fournir les palettes","d'assurer le chargement, l'arrimage et le déchargement","de vérifier avant le départ la sécurité du calage et de l'arrimage du chargement"],"c":3,"r":["Pour les envois ≥ 3 t, le chargement, le calage et l'arrimage incombent au donneur d'ordre.","Le transporteur, lui, doit les vérifier sous l'angle de la sécurité de la circulation."]},{"q":"La location d'un véhicule avec conducteur doit faire l'objet, avant la mise à disposition du véhicule :","o":["d'une lettre de location","d'une lettre de voiture","d'une feuille de location ou copie du contrat de location","d'une feuille de route"],"c":2},{"q":"La lettre de voiture doit être conservée par l'entreprise de transport, pour être présentée à toute réquisition des agents de l'État, pendant :","o":["1 an","2 ans","3 ans","10 ans"],"c":1},{"q":"L'entreprise de transport Dupont réalise un transport pour un client avec un véhicule pris en location avec conducteur auprès de l'entreprise Duval. En cas de perte ou d'avaries constatées à la livraison, le client se retournera vers :","o":["Dupont pour 50 % et Duval pour 50 %","le transporteur Dupont","le loueur du véhicule avec conducteur Duval","le conducteur"],"c":1,"r":["Vis-à-vis du client, la responsabilité repose sur le transporteur contractuel (Dupont).","Dupont conserve ensuite un recours contre son loueur si la faute vient du matériel ou du chauffeur mis à disposition."]},{"q":"L'attestation de conducteur est exigée lorsque le véhicule est muni :","o":["d'une copie conforme de licence communautaire, qu'il effectue un transport international et que le conducteur est ressortissant d'un pays tiers à l'Union européenne","d'une copie conforme de licence communautaire, qu'il effectue un transport international et que le conducteur est ressortissant d'un État membre de l'Union européenne","d'une CEMT, qu'il effectue un transport international et que le conducteur est ressortissant d'un État tiers à l'Union européenne","d'une copie conforme de licence de transport intérieur, qu'il effectue un transport intérieur et que le conducteur est ressortissant d'un État membre de l'Union européenne"],"c":0,"r":["L'attestation dépend du titre de transport de l'entreprise : elle est juridiquement liée au régime de la licence communautaire.","L'autorisation CEMT, gérée par le Forum International des Transports (FIT) pour des pays membres et non-membres de l'UE, n'est pas le support légal de cette attestation."]},{"q":"Le document de suivi :","o":["récapitule toutes les opérations prévues et non prévues effectuées par le conducteur pendant l'exécution du contrat","est destiné à suivre en temps réel le trajet de la marchandise en cas de sous-traitance multiple","est destiné à suivre le temps de conduite et les autres travaux du conducteur","est destiné à suivre un envoi en cas de fractionnement d'un lot"],"c":0,"r":["Le document de suivi (intégré ou adossé à la lettre de voiture) retrace le déroulement réel des opérations et les éventuels incidents ou temps d'attente supplémentaires."]},{"q":"Le document qui matérialise un contrat de transport, en national, est :","o":["le document administratif unique","la licence intérieure","la licence communautaire","la lettre de voiture"],"c":3},{"q":"La carte grise d'une remorque est obligatoire lorsque son poids total autorisé en charge (PTAC) est supérieur à :","o":["350 kg","500 kg","750 kg","3 500 kg"],"c":1},{"q":"Le ralentisseur sur échappement (dit « frein à l'air » ou sur volet d'échappement) fonctionne en :","o":["injectant de l'air sous haute pression dans la boîte de vitesses","obturant le collecteur d'échappement pour créer une contre-pression d'air dans les cylindres","créant une pression d'air comprimé directement sur les disques de frein","inversant le sens du flux d'air de l'admission d'air du moteur"],"c":1,"r":["Un volet, souvent commandé par un clapet pneumatique à l'air comprimé, ferme le tuyau d'échappement.","Les gaz ne s'échappent plus librement : la contre-pression retient les pistons du moteur et ralentit le véhicule."]},{"q":"En période d'interdiction de circulation, il est toutefois possible de faire circuler :","o":["un ensemble articulé de 40 t de poids total roulant autorisé (PTRA) transportant 300 kg d'oranges et deux machines-outils de 5 tonnes chacune","un véhicule isolé de 26 t de poids total autorisé en charge (PTAC), transportant exclusivement la presse","un tracteur routier d'un PTAC de 16 t, en solo","un véhicule isolé français de 12 t de PTAC roulant à vide à destination de la Grande-Bretagne"],"c":1,"r":["L'interdiction de circulation du week-end (du samedi 22 h au dimanche 22 h) et des jours fériés vise les véhicules de marchandises de plus de 7,5 t de PTAC.","Des dérogations permanentes existent : denrées périssables et animaux vivants, urgences et services publics ou de secours, presse et médias.","Un chargement mixte (fruits + machines-outils) ne bénéficie pas de la dérogation : ici, seule la presse transportée exclusivement est admise."]},{"q":"Un véhicule articulé transportant un bateau de plaisance et présentant, avec son chargement, une longueur de 18,50 m, une largeur de 3 m et un poids total roulant de 45 tonnes, est un convoi exceptionnel de :","o":["1re catégorie","2e catégorie","3e catégorie","4e catégorie"],"c":0,"r":["Catégories de convois exceptionnels :","1re : longueur ≤ 20 m · largeur ≤ 3 m · poids ≤ 48 t","2e : 20 à 25 m · 3 à 4 m · 48 à 72 t","3e : > 25 m · > 4 m · > 72 t","Ici 18,50 m, 3 m et 45 t : tout est sous les seuils → 1re catégorie."]},{"q":"En l'absence de lettre de voiture internationale, le contrat de transport est régi par :","o":["la législation nationale du transporteur","la convention internationale relative au transport de marchandises par route (CMR)","la législation nationale de l'expéditeur","la législation nationale du destinataire"],"c":1,"r":["L'absence, l'irrégularité ou la perte de la lettre de voiture internationale n'affecte ni l'existence ni la validité du contrat, qui reste régi par la Convention CMR."]},{"q":"Une entreprise de transport routier pour compte d'autrui a l'obligation légale de s'assurer pour :","o":["les marchandises transportées pour tout type de dommages","les marchandises transportées pour les dommages consécutifs aux cas de force majeure","sa responsabilité civile dans le cadre de la circulation automobile","ses véhicules pour les cas de vol"],"c":2,"r":["Seule l'assurance responsabilité civile automobile est légalement obligatoire (art. L211-1 du Code des assurances).","L'assurance des marchandises transportées ou du vol du véhicule reste facultative."]},{"q":"Pierre commande par téléphone un transport de Lyon à Paris. L'entreprise de transport confirme par téléphone. Le contrat est :","o":["unilatéral","solennel","à titre gratuit","bilatéral et consensuel"],"c":3,"r":["Le contrat de transport est consensuel : il se forme par le simple accord des volontés, même par téléphone.","Il est aussi bilatéral, car il crée des obligations réciproques entre le chargeur et le transporteur."]},{"q":"La lettre de change (traite) est :","o":["un moyen de paiement et un procédé de crédit à court terme","un ordre de paiement immédiat sans frais","un effet de commerce obligatoire entre commerçants","un moyen de paiement uniquement international"],"c":0,"r":["Elle permet de payer une dette à une échéance future : à la fois instrument de paiement et outil de crédit (notamment via l'escompte)."]},{"q":"Lors de la création d'une société de capitaux, l'argent constituant le capital social libéré :","o":["reste bloqué pendant toute la durée de vie de la société sur un compte en banque spécial","reste bloqué uniquement pendant l'accomplissement des formalités de création et est ensuite disponible pour rembourser les associés","reste bloqué uniquement pendant l'accomplissement des formalités de création et est ensuite disponible pour les besoins de la société","est fictif et n'est jamais disponible pour la société"],"c":2,"r":["Les fonds sont bloqués jusqu'à l'immatriculation (extrait Kbis), puis débloqués et mis à disposition de la société pour financer son activité."]},{"q":"La procédure d'injonction de payer permet :","o":["de demander par voie de justice le recouvrement de créances","de retarder juridiquement le paiement des créanciers","d'obtenir la liquidation judiciaire immédiate d'une entreprise","de prendre rang parmi les créanciers privilégiés"],"c":0,"r":["C'est une procédure judiciaire simplifiée et rapide qui permet à un créancier de contraindre son débiteur à régler une somme due."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Essai avec la main gauche";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
