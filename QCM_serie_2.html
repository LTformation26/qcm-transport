<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Série 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:6px}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM — 25 questions · série 2</h1>
<p class="lede">Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Un chef d'entreprise désire avoir le statut de salarié, il doit :","o":["S'inscrire au RCS en nom personnel","Être le gérant associé d'une EURL","Être le gérant unique d'une SARL dont il aura la majorité du capital","Être le gérant unique d'une SARL dont il aura la minorité du capital"],"c":3,"r":["Le gérant minoritaire ou égalitaire d'une SARL a le statut d'assimilé-salarié.","À l'inverse, l'associé unique d'une EURL détient 100 % des parts : il est considéré comme gérant majoritaire et relève du statut de travailleur non salarié (TNS, Sécurité sociale des indépendants)."]},{"q":"Un examen médical de reprise doit être organisé pour un salarié victime d'un AT ayant occasionné un arrêt d'au moins :","o":["8 jours","10 jours","21 jours","30 jours"],"c":3,"r":"La visite de reprise est obligatoire après un arrêt pour accident du travail d'au moins 30 jours."},{"q":"Le contrat type applicable aux transports publics routiers exécutés par des sous-traitants s'applique pour les relations entre :","o":["Un transporteur routier et un loueur de véhicules avec conducteur","Une entreprise de transport compte propre et un transporteur public routier","Un commissionnaire de transport et un transporteur public routier de marchandises","Un commissionnaire de transport et un loueur de véhicules avec conducteur"],"c":2,"r":["Le contrat type de sous-traitance s'applique de plein droit en l'absence de contrat écrit spécifique conclu entre le commissionnaire et le transporteur sous-traitant."]},{"q":"Les salariés sont informés de la convention collective applicable par une mention :","o":["Déposée en mairie","Affichée au conseil de prud'hommes","Figurant sur le bulletin de paie","Affichée au tribunal de commerce"],"c":2,"r":["Pour informer le salarié de la convention collective applicable, la loi impose deux moyens :","— sur la fiche de paie : l'intitulé de la convention doit y figurer chaque mois ;","— dans l'entreprise : un avis affiché (ou mis à disposition sur l'intranet) indique où le texte peut être consulté."]},{"q":"Selon la CCNTR, le conducteur qui souhaite démissionner doit à son employeur un préavis de :","o":["1 semaine","2 semaines","1 mois","2 mois"],"c":1,"r":["Dans les entreprises de transport routier de marchandises et activités auxiliaires, le préavis de démission des ouvriers est de 2 semaines,","quelle que soit l'ancienneté."]},{"q":"En CMR, en cas de dommage, l'indemnité est calculée d'après la valeur de la marchandise :","o":["À la date de livraison","À la date de la prise en charge","À la date d'établissement de la réclamation","À la date de réception de la réclamation"],"c":1,"r":["Quand une indemnité pour perte totale ou partielle de la marchandise est mise à la charge du transporteur,","elle est calculée d'après la valeur de la marchandise au lieu et à l'époque de la prise en charge."]},{"q":"La FIMO (formation initiale minimale obligatoire) est une formation :","o":["Non renouvelable et acquise une fois pour toutes","Renouvelable tous les 3 ans","Renouvelable tous les 5 ans","Non renouvelable en cas de suspension du permis"],"c":0,"r":["C'est la FCO (formation continue obligatoire) qu'il faut renouveler tous les 5 ans.","La FIMO est la formation initiale (accélérée) ; une formation longue serait, par exemple, un CAP."]},{"q":"Sauf danger immédiat, une inaptitude définitive au poste de travail est reconnue :","o":["Par le médecin traitant après un examen médical","Par le médecin du travail après au moins un examen médical et une étude du poste","Par le médecin du travail après deux examens médicaux","Par l'employeur après avis du médecin du travail et des délégués"],"c":1,"r":["L'avis d'inaptitude oblige d'abord l'employeur à rechercher un reclassement pour le salarié.","L'employeur peut néanmoins le licencier s'il justifie soit de l'impossibilité de proposer un emploi compatible avec son état de santé, soit du refus par le salarié de l'emploi proposé."]},{"q":"La cessation de paiement d'une société commerciale est :","o":["L'impossibilité de faire face au passif exigible avec son actif disponible","La perte de la moitié de son capital social","Une infraction imputable aux dirigeants","La tenue d'une comptabilité irrégulière"],"c":0,"r":["L'entreprise est en état de cessation des paiements lorsqu'elle n'a plus assez de liquidités (actif disponible) pour régler ses dettes exigibles."]},{"q":"Dans une entreprise individuelle (EI), l'entrepreneur est responsable de ses dettes professionnelles :","o":["Sur la totalité de ses biens personnels et professionnels","Uniquement sur son patrimoine professionnel, ses biens personnels étant protégés","À concurrence de ses apports au capital social","À concurrence de son chiffre d'affaires"],"c":1,"r":["Depuis 2022, le patrimoine professionnel de l'entrepreneur individuel est séparé de son patrimoine personnel.","Le patrimoine professionnel comprend : le fonds de commerce, artisanal ou agricole ; les biens meubles (marchandises, matériel) ; les biens incorporels (licences, brevets) ; les immeubles liés à l'activité ; les fonds du compte bancaire professionnel.","Tous les autres biens relèvent du patrimoine personnel, qui est protégé."]},{"q":"Dans une SARL, le gérant est élu à la majorité des associés :","o":["À l'unanimité","Représentant un quart des parts sociales","Représentant plus des trois quarts des parts sociales","Représentant plus de la moitié des parts sociales"],"c":3,"r":["Pour élire un gérant, les associés votant « pour » doivent représenter ensemble plus de 50 % du capital de la SARL.","Si l'assemblée reste bloquée et qu'aucun gérant ne peut être désigné, deux solutions existent : la désignation par la justice, ou la dissolution de la société."]},{"q":"Dans une SARL, les associés doivent répondre des dettes de la société :","o":["Dans leur totalité","Proportionnellement à leurs apports","Sauf en cas de liquidation judiciaire","Dans la limite de leurs apports"],"c":3,"r":"La responsabilité des associés d'une SARL est limitée à leurs apports. Leur patrimoine personnel est protégé."},{"q":"En matières dangereuses, la pose des étiquettes sur les colis est de la responsabilité :","o":["De l'expéditeur","Du transporteur","Du chargeur","Du destinataire"],"c":0,"r":["L'étiquetage des colis incombe à l'expéditeur.","En revanche, la signalisation du véhicule (plaques orange et placards de danger sur la citerne ou le camion) relève de la responsabilité du transporteur / conducteur."]},{"q":"En transport national, l'action en recouvrement du prix de transport est prescrite dans le délai de :","o":["1 an","3 ans","5 ans","10 ans"],"c":0,"r":"L'action en recouvrement du prix de transport se prescrit par 1 an à compter de la livraison (art. L133-6 Code de commerce)."},{"q":"La demande d'ouverture de la procédure de redressement judiciaire est de la compétence :","o":["Exclusive du chef d'entreprise","Exclusive du chef d'entreprise et des créanciers","Exclusive du président du tribunal de commerce et des créanciers","Indifféremment du chef d'entreprise, des créanciers, des salariés, du président du tribunal, du procureur"],"c":3,"r":["La procédure de redressement judiciaire est une procédure collective qui permet la poursuite de l'activité d'une société en état de cessation des paiements.","Elle peut être demandée par le chef d'entreprise, les créanciers ou le ministère public (procureur)."]},{"q":"En CMR, en cas de dommages à la marchandise, le destinataire doit faire des réserves :","o":["À la livraison en cas de dommages apparents","Dans un délai de 7 jours en cas de dommages apparents","À la livraison en cas de dommages non apparents","Dans un délai de 3 jours en cas de dommages non apparents"],"c":0,"r":"En CMR (art. 30) : réserves pour dommages apparents à la livraison. Pour les dommages non apparents, dans les 7 jours calendaires suivant la livraison."},{"q":"Selon la CCNTR, la durée maximale de la période d'essai non renouvelable d'un conducteur routier en CDI est de :","o":["Une semaine","Quinze jours","Un mois","Deux mois"],"c":2,"r":["Selon la CCNTR, la période d'essai d'un conducteur en CDI est de 1 mois.","Le maximum légal est de 2 mois pour la période d'essai, 1 mois renouvelable une fois si un accord de branche étendu le prévoit."]},{"q":"Un employeur qui fait une avance sur salaire ne peut se rembourser qu'au moyen de retenues ne dépassant pas :","o":["Un vingtième du montant du salaire exigible","Un dixième du montant du salaire exigible","Un cinquième du montant du salaire exigible","La moitié du montant du salaire exigible"],"c":1,"r":["L'avance sur salaire est un prêt accordé par l'employeur pour un travail non encore effectué.","Dans ce cas, la loi limite la retenue sur salaire à 1/10e (10 %) du salaire."]},{"q":"La longueur maximale d'un train routier ne doit pas excéder :","o":["16,50 m","18 m","18,75 m","20 m"],"c":2,"r":["La longueur maximale d'un train routier est de 18,75 m.","Elle est portée à 20,35 m pour le transport de véhicules (porte-voitures)."]},{"q":"Pour un envoi supérieur à 10 t ou 30 m³, le contrat type « général » prévoit, en cas de rendez-vous respecté, un délai de chargement de :","o":["1 h","1 h 30","2 h","3 h"],"c":0,"r":["En cas de rendez-vous respecté, le délai de chargement est de 1 heure.","En cas de plage horaire convenue (par exemple « arrivée prévue entre 8 h et 10 h »), le délai passe à 2 heures."]},{"q":"Les documents de transport (arrêté du 9 novembre 1999) doivent être conservés pendant :","o":["1 an","2 ans","5 ans","10 ans"],"c":1,"r":"Les documents de transport et de location doivent être conservés 2 ans par l'entreprise."},{"q":"Pour recourir à une expertise (art. L133-4 C. commerce) suite à un dommage à la marchandise :","o":["Vous faites établir un constat par un huissier","Vous présentez une requête au tribunal de commerce","Vous demandez à l'expert de votre assureur","Vous faites appel à un expert indépendant"],"c":1,"r":["Pour faire constater l'état des marchandises ou la cause des dommages par un expert désigné par la justice,","il faut adresser une requête au président du tribunal de commerce (ou judiciaire) du lieu où se trouvent les marchandises.","Le juge rend alors une ordonnance sur requête désignant un expert judiciaire indépendant."]},{"q":"L'immobilisation du véhicule peut être prononcée lors d'un contrôle si le conducteur :","o":["Ne peut présenter de titre de transport","N'a pas manipulé le sélecteur d'enregistrement du tachygraphe","Ne peut présenter son permis et le certificat d'immatriculation","A dépassé la vitesse autorisée de plus de 20%"],"c":1,"r":["Est puni de six mois d'emprisonnement et de 3 750 € d'amende le fait de se livrer à un transport routier avec une carte de conducteur non conforme, n'appartenant pas au conducteur, ou sans carte insérée dans le chronotachygraphe du véhicule."]},{"q":"Les restrictions de circulation en fin de semaine ou jours fériés concernent les véhicules dont le PTAC excède :","o":["3,5 T","6 T","7,5 T","10 T"],"c":2,"r":"Les restrictions de circulation week-end et jours fériés s'appliquent aux véhicules dont le PTAC est supérieur à 7,5 tonnes."},{"q":"Le contrat de transport routier est formé lorsque :","o":["Les parties sont d'accord sur la nature et le prix, même par téléphone","Les parties ont obligatoirement établi un écrit","Le transport a effectivement commencé","Le document de transport a été émargé par l'expéditeur et le transporteur"],"c":0,"r":"Le contrat de transport est consensuel : il est formé dès l'accord des parties sur la nature et le prix, même verbalement. L'écrit n'est pas requis pour sa validité."}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent — tu es prêt.";else if(pct>=60)m="Bien — quelques points à consolider.";else if(pct>=40)m="À retravailler avant l'examen.";else m="Reprends les explications, question par question.";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(q.r){const rule=document.createElement('div');rule.className='rule';const tag=document.createElement('span');tag.className='tag';tag.textContent='Explication';rule.appendChild(tag);(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
