<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">QCM Commissionnaire de transport</p>
<h1>Commissionnaire · Série 1</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Lors d'un transport routier Paris-Rome, la marchandise est considérée comme perdue si elle n'a pas été livrée dans les :","o":["30 jours qui suivent sa prise en charge par le transporteur, s'il n'a pas été convenu de délai","30 jours qui suivent l'expiration du délai convenu","15 jours qui suivent l'expiration du délai convenu","45 jours qui suivent sa prise en charge par le transporteur, s'il n'a pas été convenu de délai"],"c":1,"r":["Selon l'article 20 de la CMR, la marchandise est perdue 30 jours après l'expiration du délai convenu (ou 60 jours après la prise en charge s'il n'y a pas de délai)."]},{"q":"Le souscripteur d'un billet à ordre est :","o":["l'acheteur","le vendeur","le banquier du client","le banquier du vendeur"],"c":0,"r":["Le souscripteur d'un billet à ordre est le débiteur, c'est-à-dire l'acheteur qui s'engage à payer."]},{"q":"Quand une personne a pris en gérance libre une entreprise, cela signifie qu'elle est au moins locataire :","o":["du fonds de commerce","du local commercial","du matériel","de l'ensemble fonds + local"],"c":0,"r":["La gérance libre concerne la location du fonds de commerce ; le local relève, lui, du bail commercial."]},{"q":"Dans quel type de société les apports en industrie sont-ils admis ?","o":["les SNC (société en nom collectif) et les SARL (société à responsabilité limitée)","les SCA (société en commandite par actions) pour les associés commanditaires","les SCS (société en commandite simple) pour les associés commanditaires","les SA (société anonyme)"],"c":0,"r":["Les apports en industrie sont autorisés dans les SNC et les SARL, mais interdits dans les SA et pour les associés commanditaires."]},{"q":"Parmi les quatre mentions ci-dessous, une doit figurer obligatoirement dans les statuts d'une société :","o":["l'objet social de la société","le régime fiscal adopté par la société","le code NAF (nomenclature des activités françaises)","le nom du ou des gérants de la société"],"c":0,"r":["L'objet social est une mention obligatoire dans les statuts de toute société."]},{"q":"En l'absence de convention, le contrat type applicable aux transports publics routiers de marchandises exécutés par des sous-traitants est applicable pour les relations entre :","o":["un transporteur routier de marchandises et un loueur de véhicules industriels avec conducteur","une entreprise de transport pour compte propre et une entreprise de transport public routier de marchandises","un commissionnaire de transport et un transporteur public routier de marchandises","un commissionnaire de transport et un loueur de véhicules industriels avec conducteur"],"c":2,"r":["Ce contrat type sous-traitance régit les relations entre un donneur d'ordre (commissionnaire) et le transporteur exécutant."]},{"q":"Un client paie son fournisseur par chèque. La dette est éteinte :","o":["dès l'établissement du chèque","lors de l'encaissement du chèque","dès la remise au bénéficiaire du chèque","dès la transmission du chèque à la banque"],"c":1,"r":["Le chèque est un instrument de paiement « pro solvendo » : la dette n'est éteinte qu'au moment de son encaissement effectif."]},{"q":"Un billet à ordre est un moyen :","o":["par lequel un « tireur » ordonne à un « tiré » de verser une somme à un bénéficiaire, sans date d'échéance","par lequel un « souscripteur » s'engage à payer à un « bénéficiaire » une somme à une date déterminée","par lequel un « tireur » donne l'ordre à un « tiré » de payer une somme d'argent à une échéance donnée à un bénéficiaire","qui permet de gager une marchandise"],"c":1,"r":["Le billet à ordre est un titre par lequel le souscripteur (débiteur) s'engage à payer une somme à une date fixée."]},{"q":"Les réserves permettent :","o":["d'utiliser les recettes de l'année","de conserver en ressources une partie du bénéfice","de conserver une partie du bénéfice sur un compte bloqué en banque","de constituer une provision pour l'URSSAF"],"c":1,"r":["Les réserves permettent de conserver une partie des bénéfices nets au sein des capitaux propres de l'entreprise."]},{"q":"La trésorerie à échéance est égale à :","o":["(créances + stock + disponibilités) diminués des dettes aux tiers","disponibilités diminuées des dettes aux tiers","(bénéfice + stock final) diminués du total des dettes","créances et disponibilités des emprunts à court terme"],"c":0,"r":["La trésorerie à échéance englobe l'actif circulant à court terme (créances, stock, disponibilités) diminué des dettes à court terme."]},{"q":"Dans une entreprise dépourvue de représentant du personnel, le salarié peut, au cours de l'entretien préalable, se faire assister par :","o":["un avocat du salarié","un inspecteur du travail","un conseiller du salarié figurant sur une liste préfectorale","un conseiller prud'homal"],"c":2,"r":["En l'absence de représentants du personnel, le salarié peut choisir un conseiller inscrit sur la liste préfectorale."]},{"q":"L'application d'une convention collective étendue est obligatoire :","o":["uniquement pour les employeurs ayant signé la convention","uniquement pour les employeurs qui ont demandé l'extension","pour tous les employeurs exerçant les activités entrant dans son champ d'application","pour les employeurs de la branche professionnelle concernée qui ont plus de 10 salariés"],"c":2,"r":["L'arrêté d'extension rend la convention collective obligatoire pour tous les employeurs du secteur visé."]},{"q":"Les salariés sont informés de la convention collective de branche applicable dans l'entreprise par une mention :","o":["déposée en mairie","fichée au conseil de prud'hommes","figurant sur le bulletin de paie","affichée au tribunal de commerce"],"c":2,"r":["La mention de la convention collective applicable doit obligatoirement figurer sur le bulletin de paie."]},{"q":"L'assiette de l'indemnité de congés payés exclut les éléments de rémunération suivants :","o":["les remboursements de frais","les majorations pour heures supplémentaires","les primes d'ancienneté","la prime d'entretien"],"c":0,"r":["Les remboursements de frais professionnels n'ont pas la nature de salaire et sont exclus de la base des congés payés."]},{"q":"L'inspection du travail a droit d'entrée dans les établissements exclusivement soumis à son contrôle :","o":["uniquement de jour et durant les heures de travail","de jour comme de nuit","tous les jours de la semaine sauf le dimanche","tous les jours de l'année sauf le 1er mai"],"c":1,"r":["L'inspecteur du travail dispose d'un droit d'entrée de jour comme de nuit dans les établissements assujettis."]},{"q":"L'ouverture du droit à congés payés est effective dès que le salarié a travaillé chez le même employeur :","o":["6 mois de travail effectif","1 mois de travail effectif","2 semaines de travail effectif","10 jours de travail effectif"],"c":1,"r":["Le droit aux congés payés est ouvert dès 1 mois de travail effectif chez le même employeur."]},{"q":"Un transporteur non inscrit au registre des commissionnaires peut recourir à la sous-traitance en cas de surcharge temporaire d'activité, sans dépasser une limite du chiffre d'affaires annuel de l'activité transport routier. Cette limite est de :","o":["10 %","15 %","20 %","25 %"],"c":1,"r":["La limite légale de sous-traitance pour un transporteur non inscrit comme commissionnaire est de 15 % du CA transport."]},{"q":"Pour être exonéré de sa responsabilité, le transporteur :","o":["doit justifier du vice propre de la marchandise dans tous les cas","doit faire procéder obligatoirement à une expertise judiciaire","peut refuser que le destinataire prenne des réserves sur le document de transport","a intérêt à prendre des réserves écrites et contradictoires à la prise en charge de la marchandise"],"c":3,"r":["Des réserves écrites et motivées à la prise en charge permettent au transporteur de s'exonérer des présomptions de faute."]},{"q":"En matière de délai de paiement, le fait de convenir d'un délai supérieur à 30 jours entraîne :","o":["un délit","une contravention","aucune pénalité","une amende de 1 500 €"],"c":0,"r":["En transport routier de marchandises, dépasser le délai de paiement spécifique (30 jours) constitue un délit pénalement sanctionné."]},{"q":"Le prix d'un transport public routier de marchandises :","o":["est fixe et ne peut pas être modifié pendant l'exécution du contrat","peut être modifié par l'une ou l'autre des parties en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges salariales"],"c":2,"r":["La clause d'indexation du prix du transport selon la variation du coût du carburant s'applique de plein droit."]},{"q":"Le document de suivi prévu par la loi du 1er février 1995 doit être signé :","o":["par l'expéditeur au moment de la conclusion du contrat","par le destinataire uniquement au lieu de déchargement","par le remettant sur le lieu de chargement et par le destinataire sur le lieu de déchargement","par le remettant uniquement au lieu de chargement"],"c":2,"r":["Le document de suivi doit être émargé au chargement par le remettant et au déchargement par le destinataire."]},{"q":"Selon le code de commerce, sont garants du paiement au transporteur du prix du transport :","o":["le donneur d'ordre et le sous-traitant","l'expéditeur et le destinataire","le transporteur principal et le sous-traitant","le voiturier et le destinataire"],"c":1,"r":["Selon l'article L132-8 du Code de commerce, l'expéditeur et le destinataire sont garants du paiement du prix du transport."]},{"q":"En transport national, le contrat type applicable à un envoi de 1 500 litres d'eau minérale en bouteille est :","o":["le transport en citerne","une convention de marchandises par route (CMR)","dit « général »","il n'y a pas de contrat type qui s'applique"],"c":2,"r":["En l'absence de contrat écrit ou de contrat type spécifique, c'est le contrat type général qui s'applique par défaut."]},{"q":"Le contrat de transport est juridiquement formé quand :","o":["les parties sont d'accord sur la nature et le prix de la prestation à fournir, même au cours d'un simple entretien téléphonique","les parties se sont obligatoirement entendues par acte écrit sur la nature et le prix de la prestation à fournir","le transport a effectivement commencé et le document de transport a été dûment complété","le document de transport a été émargé par les parties concernées : expéditeur et transporteur"],"c":0,"r":["Le contrat de transport est consensuel : il est formé dès l'accord des parties sur la chose et le prix."]},{"q":"Les autorisations bilatérales peuvent être utilisées pour assurer des trafics routiers de marchandises entre la France et :","o":["les Pays-Bas","la Lituanie","la Biélorussie","l'Islande"],"c":2,"r":["Les autorisations bilatérales s'appliquent aux échanges avec les pays tiers hors Espace économique européen, comme la Biélorussie."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
