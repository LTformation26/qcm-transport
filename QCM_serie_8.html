<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM Série 8</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Lors d'un transport routier Paris-Rome, la marchandise est considérée comme perdue si elle n'a pas été livrée dans les :","o":["60 jours suivant la prise en charge","30 jours suivant l'expiration du délai convenu","60 jours suivant l'expiration du délai convenu","90 jours suivant la prise en charge"],"c":1,"r":["En transport international (CMR), la marchandise est considérée comme perdue à défaut de livraison dans les 30 jours suivant l'expiration du délai convenu (ou 60 jours après la prise en charge en l'absence de délai)."]},{"q":"Endosser un effet de commerce, c'est :","o":["annuler la valeur de l'effet","demander le paiement immédiat à la banque","encaisser le montant en espèces","transmettre le bénéfice de l'effet à une tierce personne"],"c":3,"r":["Endosser, c'est apposer sa signature au dos du titre pour en transmettre la propriété et le bénéfice à un tiers (l'endossataire)."]},{"q":"La faillite personnelle est :","o":["une condamnation d'une personne physique","une procédure d'apurement du passif d'une société","une mesure de redressement de l'entreprise","une sanction administrative délivrée par la préfecture"],"c":0,"r":["C'est une sanction personnelle et professionnelle prononcée par le juge contre un dirigeant personne physique ayant commis des fautes de gestion graves."]},{"q":"Le nantissement d'un fonds de commerce est une sûreté :","o":["immobilière avec dépossession","mobilière sans dépossession","immobilière sans dépossession","mobilière avec dépossession"],"c":1,"r":["Le fonds de commerce est un bien meuble incorporel : le commerçant continue de l'exploiter sans en abandonner la possession."]},{"q":"Quand une personne a pris en gérance libre une entreprise, cela signifie qu'elle est au moins locataire :","o":["du fonds de commerce","des locaux industriels uniquement","du matériel roulant","des parts sociales des associés"],"c":0,"r":["La gérance libre (location-gérance) est un contrat par lequel le propriétaire d'un fonds de commerce en concède la location à un gérant qui l'exploite à ses risques et périls."]},{"q":"Les commissaires aux comptes ont pour mission :","o":["d'établir le bilan et le compte de résultat de l'entreprise","de gérer la trésorerie et la fiscalité de la société","d'optimiser la gestion du personnel","de certifier la régularité et la sincérité des comptes"],"c":3,"r":["La mission légale du commissaire aux comptes est de certifier que les comptes annuels sont réguliers, sincères et donnent une image fidèle."]},{"q":"Lors de la création d'une société de capitaux, l'argent constituant le capital social libéré :","o":["reste bloqué définitivement sur le compte de la banque","peut être retiré librement à tout moment par les associés","reste bloqué uniquement pendant l'accomplissement des formalités de création et est ensuite disponible pour les besoins de la société","doit être versé directement à l'administration fiscale"],"c":2,"r":["Les fonds déposés à la constitution sont bloqués et ne sont débloqués par la banque qu'après présentation de l'extrait Kbis attestant de l'immatriculation."]},{"q":"La procédure d'injonction de payer permet :","o":["de demander par voie de justice le recouvrement de créances","de bloquer immédiatement les comptes d'un débiteur sans juge","d'obliger un fournisseur à livrer une marchandise","d'annuler une facture contestée"],"c":0,"r":["Procédure judiciaire simplifiée et rapide permettant d'obtenir un titre exécutoire pour recouvrer une créance certaine, liquide et exigible."]},{"q":"La demande d'ouverture de la procédure de redressement judiciaire est de la compétence :","o":["du chef d'entreprise uniquement","des créanciers et des salariés uniquement","du président du tribunal de commerce uniquement","indifféremment du chef d'entreprise, des créanciers de l'entreprise, du ministère public"],"c":3,"r":["La saisine peut venir du chef d'entreprise, d'un créancier ou du ministère public (le tribunal ne pouvant plus se saisir d'office)."]},{"q":"Un de vos clients, commerçant, domicilié à Brest, vous fait des difficultés pour le règlement d'une facture de transport. Entreprise lilloise, vous optez pour la procédure d'injonction de payer en adressant votre requête :","o":["au tribunal de commerce de Lille","au tribunal judiciaire de Lille","au tribunal de commerce de Brest","au tribunal judiciaire de Brest"],"c":2,"r":["Le tribunal compétent est celui du domicile du défendeur (le débiteur), soit ici le tribunal de commerce de Brest."]},{"q":"En l'absence de convention, le contrat type applicable aux transports publics routiers de marchandises exécutés par des sous-traitants est applicable pour les relations entre :","o":["un expéditeur et un destinataire","un transporteur et son conducteur salarié","un commissionnaire de transport et un transporteur public routier de marchandises","deux commissionnaires de transport uniquement"],"c":2,"r":["Le contrat type sous-traitance s'applique de plein droit, en l'absence de convention écrite, entre le donneur d'ordre (souvent commissionnaire ou premier transporteur) et le transporteur exécutant."]},{"q":"En principe, le délai de prescription en matière commerciale est de :","o":["10 ans","5 ans","2 ans","30 ans"],"c":1,"r":["Selon l'article L110-4 du Code de commerce, les obligations entre commerçants (ou entre commerçants et non-commerçants) se prescrivent par 5 ans."]},{"q":"Dans une société à responsabilité limitée (SARL), l'approbation des comptes annuels est effectuée par :","o":["l'assemblée générale ordinaire","l'assemblée générale extraordinaire","le gérant seul","le tribunal de commerce"],"c":0,"r":["L'approbation des comptes et l'affectation du résultat relèvent de la compétence exclusive des associés réunis en assemblée générale ordinaire (AGO)."]},{"q":"Le ratio capitaux propres sur capitaux permanents est égal à 0,3. Cela signifie que :","o":["l'entreprise dispose d'une excellente autonomie financière","vous risquez d'avoir des difficultés à réemprunter","la société doit obligatoirement déposer son bilan","le chiffre d'affaires est insuffisant"],"c":1,"r":["Ce ratio mesure l'autonomie financière. À 0,3, sous le seuil recommandé de 0,5, il traduit un fort endettement qui alerte les banques pour de futurs prêts."]},{"q":"La dépréciation d'un stock se constate par l'enregistrement :","o":["d'une provision","d'une plus-value","d'une charge constatée d'avance","d'un amortissement linéaire"],"c":0,"r":["Quand un stock perd de la valeur sans que la perte soit définitive, l'entreprise comptabilise une dépréciation (anciennement provision pour dépréciation)."]},{"q":"Le chiffre d'affaires HT hors sous-traitance est intéressant parce qu'il représente :","o":["le montant total des ventes taxes comprises","la marge nette de l'entreprise","la valeur ajoutée brute","le chiffre d'affaires réalisé par l'entreprise avec ses moyens propres"],"c":3,"r":["En retirant le chiffre d'affaires sous-traité, on obtient le CA propre, qui reflète l'activité produite par la flotte, le matériel et le personnel de l'entreprise."]},{"q":"Un contrat de travail à durée déterminée (CDD) peut être conclu pour :","o":["remplacer un salarié temporairement absent pendant la durée de son absence","pourvoir durablement un emploi lié à l'activité normale de l'entreprise","remplacer un salarié gréviste","tester les compétences d'un cadre sans période d'essai"],"c":0,"r":["Le CDD ne peut pourvoir durablement un emploi lié à l'activité normale ; le remplacement d'un salarié temporairement absent en est le cas de recours classique."]},{"q":"En cas de licenciement individuel d'un salarié pour motif économique, l'employeur doit informer l'administration :","o":["au moment du déroulement de l'entretien préalable","30 jours avant l'envoi de la lettre de licenciement","dans les 8 jours suivant l'envoi de la lettre de licenciement","le jour même de la notification du licenciement"],"c":2,"r":["L'employeur notifie la mesure à l'administration (DREETS) par voie dématérialisée dans les 8 jours suivant l'envoi de la lettre de licenciement."]},{"q":"Pour bénéficier d'un Projet de Transition Professionnelle (PTP / CPF de transition, ex-CIF), le salarié du secteur privé doit justifier d'une ancienneté minimale de :","o":["12 mois dans l'entreprise quel que soit le parcours antérieur","36 mois consécutifs dans la même entreprise","24 mois consécutifs ou non dont 12 mois dans l'entreprise","5 ans d'activité professionnelle continue"],"c":2,"r":["Il faut au moins 24 mois d'ancienneté (consécutifs ou non), dont 12 mois dans la même entreprise."]},{"q":"L'établissement d'un règlement intérieur est obligatoire dans les entreprises à partir d'un seuil de :","o":["10 salariés","20 salariés","50 salariés","100 salariés"],"c":2,"r":["L'obligation s'applique dans les entreprises d'au moins 50 salariés (seuil atteint pendant 12 mois consécutifs)."]},{"q":"Le règlement intérieur d'une entreprise doit être déposé obligatoirement auprès :","o":["de l'inspection du travail","du greffe du conseil de prud'hommes","de la mairie du siège social","du tribunal de commerce"],"c":0,"r":["Le règlement intérieur est transmis au CSE et déposé auprès de l'inspection du travail (le dépôt au greffe du conseil de prud'hommes a été supprimé)."]},{"q":"La mise en place du Comité Social et Économique (CSE) est obligatoire dès que l'effectif atteint au moins :","o":["50 salariés pendant 3 ans","20 salariés","11 salariés","5 salariés"],"c":2,"r":["Le CSE devient obligatoire quand l'effectif atteint au moins 11 salariés pendant 12 mois consécutifs."]},{"q":"Avant toute embauche, l'employeur doit réaliser une formalité obligatoire appelée :","o":["Déclaration Unique de Recrutement (DUR)","Déclaration Préalable à l'Embauche (DPAE)","Inscription sur le Registre National de la Main-d'œuvre","Affiliation obligatoire à l'inspection du travail"],"c":1,"r":["La DPAE doit être adressée à l'URSSAF dans les 8 jours qui précèdent l'embauche."]},{"q":"Dans le cadre de la réglementation du travail en transport routier, l'attribution de la première journée de repos compensateur trimestriel pour un conducteur grand routier débute à partir de :","o":["20 heures supplémentaires trimestrielles","41 heures supplémentaires trimestrielles","60 heures supplémentaires trimestrielles","90 heures supplémentaires trimestrielles"],"c":1,"r":["La première tranche de repos compensateur trimestriel s'ouvre dès que les heures supplémentaires atteignent la tranche de 41 h à 79 h par trimestre."]},{"q":"Le coût d'obtention ou de renouvellement de la carte de conducteur pour un salarié incombe :","o":["au conducteur salarié lui-même","toujours à l'employeur","pour moitié à l'employeur et pour moitié au salarié","à la caisse d'assurance maladie"],"c":1,"r":["La carte de conducteur est un équipement de travail obligatoire : son coût d'acquisition ou de renouvellement est intégralement à la charge de l'employeur."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
