<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annale 2021 – QCM</title>
<style>
  :root { --texte:#0F2A1D; --sapin:#095228; --rouge:#C62828; --vert-ok:#1e7d45; --fond-ok:#e7f4ec; --fond-ko:#fbeaea; --filet:#cfd8d2; --gris:#5d6f64; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--texte); font-family: Verdana, "DejaVu Sans", sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 30px; }
  header { display:flex; align-items:center; gap:14px; border-bottom: 3px solid var(--sapin); padding-bottom: 12px; margin-bottom: 18px; }
  header img { width: 52px; height: auto; }
  header .marque { font-size: 13px; color: var(--gris); letter-spacing: .5px; }
  header h1 { margin: 0; font-size: 22px; color: var(--sapin); line-height:1.2; }
  .progres { display:flex; justify-content:space-between; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: #e3e9e5; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .barre div { height: 100%; width: 0; background: var(--sapin); transition: width .3s; }
  .question { font-size: 19px; font-weight: bold; margin: 0 0 18px; white-space: pre-line; }
  .question::after { content:""; display:block; width:48px; border-top: 3px solid var(--rouge); margin-top: 10px; }
  .choix { display:flex; flex-direction:column; gap: 10px; }
  .choix button { text-align:left; font: inherit; color: var(--texte); background:#fff; border: 1.5px solid var(--filet); border-radius: 8px; padding: 13px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .choix button:hover:not(:disabled) { border-color: var(--sapin); }
  .choix button .l { font-weight:bold; color: var(--sapin); min-width: 20px; }
  .choix button:disabled { cursor: default; }
  .choix button.ok { background: var(--fond-ok); border-color: var(--vert-ok); }
  .choix button.ko { background: var(--fond-ko); border-color: var(--rouge); }
  .retour { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--sapin); display:none; }
  .retour.ko { border-left-color: var(--rouge); }
  .retour .exp { white-space: pre-line; }
  .retour .titre { font-weight: bold; color: var(--rouge); }
  .retour .titre:empty { display: none; }
  .retour.okk .titre { color: var(--vert-ok); }
  .retour.ko .titre { color: var(--rouge); }
  .actions { margin-top: 22px; text-align: right; }
  .btn { font: inherit; font-weight: bold; background: var(--sapin); color:#fff; border: none; border-radius: 8px; padding: 12px 24px; cursor:pointer; }
  .btn:hover { background: #0b6a32; }
  .btn[hidden] { display:none; }
  .resultat { text-align:center; padding-top: 10px; }
  .resultat .score { font-size: 56px; font-weight: bold; color: var(--sapin); line-height:1.1; }
  .resultat .sur { color: var(--gris); margin-bottom: 14px; }
  .resultat .msg { font-size: 18px; margin-bottom: 22px; }
  @media (max-width: 520px) { body { font-size: 16px; } .question { font-size: 17px; } header h1 { font-size: 19px; } }
</style>
</head>

<script>
const QUESTIONS = [
  {"q": "Question 1. Les associés d'une SAS (société par actions simplifiée) ont signé leurs statuts le 13 janvier. L'inscription au RCS (registre du commerce et des sociétés) a été effectuée le 25 janvier. La publicité de la constitution de la société est parue dans un journal d'annonces légales le 30 janvier. L'activité de la société a débuté le 4 mars. A quelle date la société a-t-elle acquis la personnalité morale ?", "r": ["le 13 janvier", "le 30 janvier", "le 25 janvier", "le 4 mars"], "b": 2, "e": "La société acquiert la personnalité morale à son immatriculation au RCS, ici le 25 janvier.", "u": false},
  {"q": "Question 2. Un commerçant parisien confie à un transporteur lyonnais une expédition au départ de Lille et à destination de Marseille. Le transporteur n'est pas payé et assigne son client en paiement. Le tribunal de commerce normalement compétent sera celui de :", "r": ["Paris", "Lyon", "Lille", "Marseille"], "b": 0, "e": "Le tribunal de commerce compétent est celui du lieu du défendeur : le client est parisien.", "u": false},
  {"q": "Question 3. Dans une SARL à associé unique, hors faute de gestion, le gérant associé unique est responsable :", "r": ["de la totalité des dettes sociales", "des dettes sociales sur ses biens personnels", "des dettes sociales à concurrence de ses apports", "des dettes sociales à concurrence de son chiffre d'affaires annuel"], "b": 2, "e": "Hors faute de gestion, la responsabilité du gérant est limitée à ses apports.", "u": false},
  {"q": "Question 4. L'escompte d'une traite consiste à :", "r": ["indiquer au dos de l'effet un nouveau bénéficiaire", "compter des frais d'agio en cas de non paiement", "obtenir la signature de sa banque pour confirmer la traite", "obtenir de sa banque une avance sur le montant de la traite"], "b": 3, "e": "L'escompte permet d'obtenir de sa banque une avance sur le montant de la traite.", "u": false},
  {"q": "Question 5. Un chèque certifié est un chèque :", "r": ["dont la provision est bloquée pendant le délai légal de présentation", "visé par le banquier", "pour lequel le porteur a obtenu de la banque un certificat de non-paiement", "dont le banquier atteste que la provision, non bloquée, existe au moment de la certification"], "b": 0, "e": "Pour un chèque certifié, la provision est bloquée pendant le délai légal de présentation.", "u": false},
  {"q": "Question 6. Sur les documents commerciaux d'une entreprise, quelle mention est facultative :", "r": ["le numéro SIRET délivré par l'INSEE (Institut national de la statistique et des études économiques)", "la mention RCS (Registre du commerce et des sociétés)", "le lieu du siège social", "le code NAF (Nomenclature des activités françaises)"], "b": 3, "e": "Le code NAF est une mention facultative.", "u": false},
  {"q": "Question 7. En transport national, un destinataire constate des avaries sur la marchandise le jour de la livraison. Dans les 3 jours, il émet des réserves au transporteur. Ce dernier ne donnant pas suite à cette réclamation, le destinataire dispose d'un délai de prescription de :", "r": ["6 mois", "1 an", "2 ans", "3 ans"], "b": 1, "e": "En transport national, la prescription est d'un an.", "u": false},
  {"q": "Question 8. Le retrait par le préfet de région de l'autorisation d'exercer la profession de transporteur peut être contesté par l'entreprise devant le tribunal :", "r": ["de commerce", "judiciaire", "administratif", "de police"], "b": 2, "e": "La décision du préfet de région se conteste devant le tribunal administratif.", "u": false},
  {"q": "Question 9. Le commerçant doit conserver ses documents comptables pendant :", "r": ["3 ans", "5 ans", "8 ans", "10 ans"], "b": 3, "e": "Les documents comptables se conservent 10 ans.", "u": false},
  {"q": "Question 10. Les associés d'une SARL (Société à responsabilité limitée) décident d'augmenter le capital social en faisant appel à de nouveaux apports. Ils doivent le faire :", "r": ["lors de l'assemblée générale ordinaire", "lors de l'assemblée générale constitutive", "lors de l'assemblée générale extraordinaire", "en dehors de toute assemblée"], "b": 2, "e": "Une augmentation de capital se décide en assemblée générale extraordinaire.", "u": false},
  {"q": "Question 11. Quand une personne a pris en gérance libre une entreprise, cela signifie qu'elle est au moins locataire :", "r": ["du fonds de commerce", "du local commercial", "du matériel", "de l'ensemble fonds + local"], "b": 0, "e": "La gérance libre est une location du fonds de commerce.", "u": false},
  {"q": "Question 12. En cas de désaccord avec une décision de justice rendue par le tribunal de commerce, concernant un montant de 7 500 €, vous pouvez porter l'affaire devant :", "r": ["la Cour de Cassation", "la Cour d'Appel", "le tribunal judiciaire", "la Cour d'Assises"], "b": 1, "e": "Pour un litige de 7 500 €, la décision du tribunal de commerce peut être contestée devant la cour d'appel.", "u": false},
  {"q": "Question 13. Trois associés \"X\", \"Y\" et \"Z\" décident de constituer une S.A.R.L.\"X\" apporte 4 500 € en espèces,\"Y\" apporte un terrain évalué à 10 000 €, \"Z\" apporte 3 000 € et un véhicule évalué à 9 000 € - L'Assemblée Générale des associés décide que \"Z\" sera le gérant unique de la S.A.R.L :", "r": ["il sera majoritaire", "il sera minoritaire", "il pourra être salarié", "il devra obligatoirement être salarié"], "b": 1, "e": "Z apporte 12 000 € sur 26 500 € au total, soit environ 45 % du capital : il est minoritaire.", "u": false},
  {"q": "Question 14. Le ratio capitaux propres sur capitaux permanents est égal à 0,3. Cela signifie que :", "r": ["vous êtes insolvable", "vous risquez d'avoir des difficultés à réemprunter", "vous devez faire appel à de nouveaux associés", "votre fonds de roulement permanent est insuffisant"], "b": 1, "e": "Un ratio de 0,3 signale un risque de difficultés pour réemprunter.", "u": false},
  {"q": "Question 15. La dépréciation envisagée sur un stock se constate par l'enregistrement :", "r": ["d'une provision", "d'un amortissement", "d'une perte exceptionnelle", "d'une moins-value"], "b": 0, "e": "Une dépréciation de stock s'enregistre par une provision.", "u": false},
  {"q": "Question 16. Le fonds de roulement permanent se calcule de la manière suivante :", "r": ["capitaux propres - actif immobilisé", "(capitaux propres + dettes à plus d'un an) - actif immobilisé", "dettes à long et moyen terme - actif immobilisé", "dettes à court terme - actif immobilisé"], "b": 1, "e": "Fonds de roulement = (capitaux propres + dettes à plus d'un an) − actif immobilisé.", "u": false},
  {"q": "Question 17. L'absence de contrat écrit à l'issue d'un contrat à durée déterminée, si le salarié est maintenu dans l'entreprise, entraîne :", "r": ["la rupture du contrat", "le renouvellement systématique pour une même durée", "la régularisation par un écrit", "un contrat réputé tacitement à durée indéterminée"], "b": 3, "e": "Sans contrat écrit, le contrat est réputé conclu pour une durée indéterminée.", "u": false},
  {"q": "Question 18. Sauf cas particulier, la durée maximale d'un contrat à durée déterminée conclu pour un accroissement temporaire d'activité est de :", "r": ["6 mois", "12 mois", "18 mois", "24 mois"], "b": 2, "e": "Pour un accroissement temporaire d'activité, la durée maximale est de 18 mois.", "u": false},
  {"q": "Question 19. Selon l'arrêté du 6 juillet 2005 relatif aux modalités de téléchargement des données de conduite, l'intervalle entre deux téléchargements des données de la carte d'un conducteur ne doit pas excéder :", "r": ["16 jours calendaires", "28 jours calendaires", "60 jours calendaires", "95 jours calendaires"], "b": 1, "e": "L'intervalle entre deux téléchargements de la carte conducteur ne doit pas dépasser 28 jours.", "u": false},
  {"q": "Question 20. Le certificat de travail mentionne obligatoirement :", "r": ["les dates d'entrée et de sortie", "le motif de la fin du contrat (rupture)", "une appréciation générale sur les qualités professionnelles", "l'existence d'une clause de non concurrence"], "b": 0, "e": "Le certificat de travail mentionne les dates d'entrée et de sortie.", "u": false},
  {"q": "Question 21. Un salarié qui se trouve dans une situation dont il a un motif raisonnable de penser qu'elle comporte un risque pour sa vie ou sa santé, peut :", "r": ["exercer uniquement son droit d'alerte", "exercer ses droits d'alerte et de retrait", "être sanctionné si le danger réel n'est pas prouvé", "exercer une action en référé devant le Conseil de prud'hommes"], "b": 1, "e": "Le salarié peut exercer ses droits d'alerte et de retrait.", "u": false},
  {"q": "Question 22. Selon le règlement (CE) n° 561/2006, la durée maximale de conduite par période de deux semaines consécutives est de :", "r": ["86 heures", "90 heures", "92 heures", "96 heures"], "b": 1, "e": "La durée maximale de conduite sur deux semaines consécutives est de 90 heures.", "u": false},
  {"q": "Question 23. Suite à un accident du travail, un salarié est déclaré inapte à son emploi. L'employeur ne pouvant pas le reclasser doit :", "r": ["licencier le salarié pour motif économique", "solliciter la démission du salarié", "licencier le salarié et verser une indemnité spéciale de licenciement", "prononcer un licenciement pour faute grave"], "b": 2, "e": "L'employeur licencie le salarié et verse une indemnité spéciale de licenciement.", "u": false},
  {"q": "Question 24. L'application d'une convention collective étendue est obligatoire :", "r": ["uniquement pour les employeurs ayant signé la convention", "uniquement pour les employeurs qui ont demandé l'extension", "pour tous les employeurs exerçant les activités entrant dans son champ d'application", "pour les employeurs de la branche professionnelle concernée qui ont plus de 10 salariés"], "b": 2, "e": "Une convention collective étendue s'impose à tous les employeurs de son champ d'application.", "u": false},
  {"q": "Question 25. Une convention collective de branche est un accord conclu entre :", "r": ["les employeurs après consultation de l'inspection du travail", "le ministère du travail et les syndicats", "les représentants du personnel et les délégués syndicaux", "les organisations professionnelles d'employeurs et les organisations syndicales de salariés, représentatives au niveau de cette branche"], "b": 3, "e": "La convention collective est conclue entre les organisations d'employeurs et les syndicats représentatifs de la branche.", "u": false},
  {"q": "Question 26. Sauf faute grave, le licenciement d'un conducteur d'une entreprise de transport routier ayant une ancienneté comprise entre six mois et deux ans donne droit au minimum à un délai congé de :", "r": ["1 semaine", "1 mois", "2 mois", "3 mois"], "b": 1, "e": "Pour une ancienneté de 6 mois à 2 ans, le délai de congé est d'au moins 1 mois.", "u": false},
  {"q": "Question 27. L'établissement d'un réglement intérieur est obligatoire à partir du seuil de :", "r": ["10 salariés", "20 salariés", "50 salariés", "100 salariés"], "b": 2, "e": "Le règlement intérieur est obligatoire à partir de 50 salariés.", "u": false},
  {"q": "Question 28. Selon l'article R. 3312-50 du Code des transports, la durée de temps de service maximale hebdomadaire sur 3 ou 4 mois après accord, d'un conducteur grand routier ou longue distance conduisant exclusivement des véhicules de plus de 3,5 tonnes, ne peut dépasser :", "r": ["52 heures", "56 heures", "53 heures", "48 heures"], "b": 2, "e": "Réponse du corrigé officiel de la session du 6 octobre 2021.", "u": false},
  {"q": "Question 29. Un conducteur prenant 7 repos journaliers par mois hors domicile effectue une journée de travail se décomposant ainsi : temps de conduite (7 h), autres travaux (1 h), temps d'attente (2 h), temps de pause et de repas (1 h 30). Son temps de service est de :", "r": ["9h", "10 h", "10 h 30", "11 h 30"], "b": 1, "e": "Réponse du corrigé officiel de la session du 6 octobre 2021.", "u": false},
  {"q": "Question 30. Selon le contrat type dit \"général\" applicable aux transports publics de marchandises, pour les envois de 3 tonnes et plus, le donneur d'ordre doit :", "r": ["préparer uniquement les envois pour le chargement, le calage et l'arrimage", "s'assurer que le chargement, le calage et l'arrimage effectués par le transporteur sont corrects", "refuser le départ du véhicule si le calage et l'arrimage effectués par le transporteur ne sont pas conformes", "effectuer le chargement, le calage et l'arrimage"], "b": 3, "e": "Pour les envois de 3 tonnes et plus, le donneur d'ordre effectue le chargement, le calage et l'arrimage.", "u": false},

];
const POINTS = 2, LETTRES = ["A","B","C","D"];
let ordre = [], i = 0, score = 0, rates = [];
const zone = document.getElementById("zone");

function melange(t) { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; }

function demarrer() {
  ordre = QUESTIONS.map(q => ({ q: q.q, e: q.e, u: q.u, r: q.r.slice(), b: q.b }));
  i = 0; score = 0; rates = []; afficher();
}

function afficher() {
  const Q = ordre[i], n = ordre.length;
  zone.innerHTML = `
    <div class="progres"><span>Question ${i + 1} / ${n}</span><span>${score} / ${n * POINTS} points</span></div>
    <div class="barre"><div style="width:${(i / n) * 100}%"></div></div>
    <p class="question"></p>
    <div class="choix"></div>
    <div class="retour"><div class="titre"></div><div class="exp"></div></div>
    <div class="actions"><button class="btn" id="suivant" hidden>${i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button></div>`;
  zone.querySelector(".question").textContent = Q.q;
  const choix = zone.querySelector(".choix");
  Q.r.forEach((txt, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="l">${LETTRES[k]}.</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => repondre(k);
    choix.appendChild(b);
  });
}

function repondre(k) {
  const Q = ordre[i], btns = zone.querySelectorAll(".choix button"), ret = zone.querySelector(".retour");
  btns.forEach(b => b.disabled = true);
  btns[Q.b].classList.add("ok");
  if (k === Q.b) {
    score += POINTS;
    ret.className = "retour okk";
  } else {
    btns[k].classList.add("ko");
    rates.push(i + 1);
    ret.className = "retour ko";
  }
  const faux = (k !== Q.b);
  ret.querySelector(".titre").textContent = faux ? "Mauvaise réponse" : "";
  ret.querySelector(".exp").textContent = Q.e;
  if (faux || Q.u) ret.style.display = "block";
  zone.querySelector(".progres span:last-child").textContent = `${score} / ${ordre.length * POINTS} points`;
  const s = document.getElementById("suivant");
  s.hidden = false;
  s.onclick = () => { i++; i < ordre.length ? afficher() : resultat(); };
}

function resultat() {
  const total = ordre.length * POINTS, pct = score / total;
  const msg = pct >= 0.8 ? "Très bon résultat, vous êtes prêt pour l'examen."
            : pct >= 0.5 ? "Résultat correct. Relisez le cours sur les points où vous vous êtes trompé."
            : "Résultat insuffisant. Reprenez les cours avant de recommencer.";
  zone.innerHTML = `
    <div class="barre"><div style="width:100%"></div></div>
    <div class="resultat">
      <div class="score">${score}</div><div class="sur">sur ${total} points</div>
      <div class="msg">${msg}</div>
      <p>${rates.length ? "Questions à revoir : " + rates.join(", ") + "." : "Aucune erreur."}</p>
      <button class="btn" id="recommencer">Recommencer l'annale</button>
    </div>`;
  document.getElementById("recommencer").onclick = demarrer;
}

demarrer();

function envoyerHauteur() {
  try { const h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 10; parent.postMessage({ annaleH: h }, "*"); } catch (e) {}
}
new MutationObserver(envoyerHauteur).observe(document.getElementById("zone"), { childList: true, subtree: true, attributes: true });
window.addEventListener("resize", envoyerHauteur);
envoyerHauteur();
</script>
