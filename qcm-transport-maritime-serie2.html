<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM – Transport maritime | Série 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
  :root{--green-dark:#1a5c38;--green-mid:#2e7d52;--green-light:#e8f5ee;--green-accent:#2ecc71;--red:#c0392b;--red-light:#fdecea;--grey-bg:#f4f4f2;--grey-border:#ddd;--text:#1c1c1c;--white:#fff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Barlow',sans-serif;background:var(--grey-bg);color:var(--text);min-height:100vh;}
  header{background:var(--green-dark);color:var(--white);padding:22px 36px 18px;border-bottom:4px solid var(--green-accent);}
  header .label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--green-accent);margin-bottom:5px;}
  header h1{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;}
  header .meta{margin-top:6px;font-size:12px;color:rgba(255,255,255,0.6);}
  .progress-wrap{background:var(--green-dark);padding:12px 36px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .progress-track{flex:1;background:rgba(255,255,255,0.15);border-radius:4px;height:5px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green-accent);border-radius:4px;transition:width 0.4s ease;}
  .progress-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:rgba(255,255,255,0.8);white-space:nowrap;min-width:70px;text-align:right;}
  .container{max-width:740px;margin:36px auto;padding:0 20px 60px;}
  .card{background:var(--white);border-radius:12px;border:1px solid var(--grey-border);padding:32px 36px;box-shadow:0 2px 12px rgba(0,0,0,0.06);animation:fadeIn 0.25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .q-badge{background:var(--green-dark);color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:3px 11px;border-radius:5px;}
  .q-pts{font-size:12px;color:#999;}
  .q-text{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:22px;color:var(--text);}
  .choices{display:flex;flex-direction:column;gap:9px;}
  .choice-label{display:flex;align-items:flex-start;gap:12px;padding:11px 15px;border:1.5px solid var(--grey-border);border-radius:8px;cursor:pointer;font-size:14.5px;transition:border-color 0.15s,background 0.15s;line-height:1.4;}
  .choice-label:hover:not(.locked){border-color:var(--green-mid);background:var(--green-light);}
  .choice-label input{display:none;}
  .choice-letter{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--green-dark);background:var(--green-light);border-radius:4px;padding:2px 8px;flex-shrink:0;margin-top:1px;}
  .choice-label.selected{border-color:var(--green-dark);background:var(--green-light);}
  .choice-label.correct{border-color:var(--green-accent);background:#eafaf1;}
  .choice-label.wrong{border-color:var(--red);background:var(--red-light);}
  .choice-label.correct .choice-letter{background:#c3efda;color:#1a7a3f;}
  .choice-label.wrong .choice-letter{background:#fadbd8;color:var(--red);}
  .feedback-box{display:none;margin-top:18px;padding:14px 16px;border-radius:8px;font-size:13.5px;line-height:1.55;}
  .feedback-box.ok{background:#eafaf1;border-left:4px solid var(--green-accent);color:#1a5c38;}
  .feedback-box.ko{background:var(--red-light);border-left:4px solid var(--red);color:#8b1a1a;}
  .feedback-box .fb-verdict{font-weight:700;font-size:14px;margin-bottom:5px;}
  .feedback-box .fb-comment{color:#333;}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
  .btn{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:7px;padding:11px 22px;cursor:pointer;transition:background 0.2s,opacity 0.2s;}
  .btn-prev{background:#e8e8e4;color:#555;}.btn-prev:hover{background:#d5d5ce;}
  .btn-validate{background:var(--green-dark);color:var(--white);flex:1;}.btn-validate:hover{background:var(--green-mid);}.btn-validate:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-next{background:var(--green-dark);color:var(--white);}.btn-next:hover{background:var(--green-mid);}
  .score-card{display:none;background:var(--green-dark);color:var(--white);border-radius:12px;padding:40px 36px;text-align:center;box-shadow:0 4px 20px rgba(26,92,56,0.2);}
  .score-card .big{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:700;color:var(--green-accent);line-height:1;}
  .score-card .sub{font-size:14px;color:rgba(255,255,255,0.65);margin-top:6px;}
  .score-card .mention{font-size:18px;font-weight:600;margin-top:18px;}
  .score-card .detail{margin-top:10px;font-size:13px;color:rgba(255,255,255,0.6);}
  .btn-restart{margin-top:22px;background:transparent;border:2px solid rgba(255,255,255,0.35);color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:10px 26px;border-radius:7px;cursor:pointer;}
  .btn-restart:hover{border-color:var(--green-accent);color:var(--green-accent);}
  @media(max-width:600px){header{padding:18px 16px 14px;}header h1{font-size:19px;}.progress-wrap{padding:10px 16px;}.container{padding:0 12px 48px;}.card{padding:22px 18px;}.q-text{font-size:15px;}.choice-label{font-size:13.5px;}}
</style>
</head>
<body>
<header>
  <div class="label">Capacité de Transport de Marchandises +3,5t</div>
  <h1>Transport maritime — Série 2</h1>
  <div class="meta">20 questions · 2 points chacune · Score max : 40 points</div>
</header>
<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20</div>
</div>
<div class="container">
  <div class="card" id="mainCard">
    <div class="q-meta"><span class="q-badge" id="qBadge">Q1</span><span class="q-pts">2 points</span></div>
    <div class="q-text" id="qText"></div>
    <div class="choices" id="choicesContainer"></div>
    <div class="feedback-box" id="feedbackBox"><div class="fb-verdict" id="fbVerdict"></div><div class="fb-comment" id="fbComment"></div></div>
    <div class="nav">
      <button class="btn btn-prev" id="btnPrev" onclick="goTo(current-1)">← Précédent</button>
      <button class="btn btn-validate" id="btnValidate" onclick="validateAnswer()">Valider</button>
      <button class="btn btn-next" id="btnNext" onclick="goTo(current+1)" style="display:none">Suivant →</button>
    </div>
  </div>
  <div class="score-card" id="scoreCard">
    <div class="big" id="scoreBig"></div><div class="sub">points sur 40</div>
    <div class="mention" id="scoreMention"></div><div class="detail" id="scoreDetail"></div>
    <button class="btn-restart" onclick="restart()">Recommencer</button>
  </div>
</div>
<script>
const rawQuestions=[
  {q:"L'affrètement peut être :",choices:[{text:"Uniquement au voyage, pour un ou plusieurs voyages",correct:false},{text:"Au tonnage, au voyage ou à coque nue",correct:true},{text:"Uniquement à coque nue pour les navires de commerce",correct:false},{text:"Exclusivement réservé au transport de conteneurs",correct:false}],comment:"L'affrètement peut prendre trois formes : <strong>au tonnage</strong> (pour un tonnage déterminé), <strong>au voyage</strong> (pour un ou plusieurs voyages) et <strong>à coque nue</strong> (pour un temps défini avec un équipement incomplet ou inexistant). Il est matérialisé par une charte-partie."},
  {q:"La charte-partie est :",choices:[{text:"Un connaissement maritime négociable utilisé en crédit documentaire",correct:false},{text:"Un document de transit douanier pour le transport maritime",correct:false},{text:"Le contrat d'affrètement matérialisant la mise à disposition du navire entre fréteur et affréteur",correct:true},{text:"Un document bancaire lié au crédit documentaire maritime",correct:false}],comment:"La <strong>charte-partie</strong> matérialise le contrat d'affrètement entre le fréteur et l'affréteur. Elle énonce tous les éléments relatifs au navire (jauge). Elle concerne la remise de tout ou partie du navire, contrairement au connaissement qui porte sur le transport des marchandises."},
  {q:"La Convention de Hambourg a été adoptée en :",choices:[{text:"1978",correct:true},{text:"1966",correct:false},{text:"1924",correct:false},{text:"1968",correct:false}],comment:"La Convention de Hambourg a été adoptée en <strong>1978</strong>. Elle n'a été ratifiée que par 34 États (dont le Maroc, la Tunisie, le Liban) mais pas la France ni l'Allemagne. Ces règles étaient considérées comme technologiquement et juridiquement dépassées dès leur signature."},
  {q:"Les Règles de Rotterdam ont été signées le :",choices:[{text:"1er janvier 2009",correct:false},{text:"11 décembre 2008",correct:false},{text:"18 octobre 2008",correct:false},{text:"23 septembre 2009",correct:true}],comment:"Les Règles de Rotterdam ont été adoptées par la CNUDCI le 11 décembre 2008 et <strong>signées le 23 septembre 2009</strong>. Seuls 5 pays les ont ratifiées, ce qui retarde leur entrée en vigueur (20 ratifications nécessaires pour qu'elles entrent en vigueur)."},
  {q:"Selon la Convention de Bruxelles, la prise en charge de la marchandise par le transporteur se situe :",choices:[{text:"Dès que la marchandise est remise au premier transporteur terrestre",correct:false},{text:"À la signature du contrat de transport",correct:false},{text:"Depuis le chargement sur le navire (sous palan à sous palan)",correct:true},{text:"À la remise du connaissement au chargeur",correct:false}],comment:"Selon la Convention de Bruxelles, la prise en charge se situe <strong>depuis le chargement sur le navire</strong>. La responsabilité du transporteur court depuis la prise sous palan jusqu'à la livraison sous palan. La Convention de Hambourg étend cette responsabilité dès que la marchandise est sous la garde du transporteur."},
  {q:"La prise en charge de la marchandise par le transporteur est constatée par :",choices:[{text:"L'émission du connaissement définitif signé par le capitaine",correct:false},{text:"Un reçu « board receipt » ou « mate's receipt »",correct:true},{text:"La signature du chargeur sur le manifeste cargo",correct:false},{text:"L'émission de la charte-partie",correct:false}],comment:"La prise en charge est constatée par la remise d'un reçu appelé <strong>« board receipt »</strong> ou <strong>« mate's receipt »</strong>. Ce document atteste que le transporteur a pris possession de la marchandise, avant l'émission du connaissement définitif."},
  {q:"La faute nautique (négligence du capitaine) en transport maritime est :",choices:[{text:"Toujours supportée financièrement par le chargeur",correct:false},{text:"Une cause engageant systématiquement la responsabilité du transporteur",correct:false},{text:"Non exonératoire sous la Convention de Hambourg, contrairement à Bruxelles",correct:false},{text:"Une cause exonératoire de la responsabilité du transporteur sous la loi française et la Convention de Bruxelles",correct:true}],comment:"La <strong>faute nautique</strong> (négligence ou défaut du capitaine) est une cause exonératoire sous la loi française et la Convention de Bruxelles. En revanche, la <strong>faute commerciale</strong> (fautes dans les tâches intéressant la cargaison) n'est pas exonératoire, car elle risque de compromettre la sécurité du navire."},
  {q:"Le T B/L (Through Bill of Lading) régit :",choices:[{text:"Des transports maritimes avec plusieurs transporteurs, ou un transport maritime combiné avec d'autres modes",correct:true},{text:"Exclusivement des transports maritimes entre deux ports déterminés",correct:false},{text:"Uniquement des transports de bout en bout incluant le pré-acheminement terrestre",correct:false},{text:"Des transports sous régime douanier suspensif uniquement",correct:false}],comment:"Le <strong>T B/L (connaissement direct)</strong> régit soit des transports maritimes effectués par plusieurs transporteurs, soit un transport maritime combiné avec des transports aériens et/ou terrestres. Pour le pré ou post-acheminement, la compagnie maritime n'agit qu'en tant que mandataire."},
  {q:"Le connaissement FIATA-B/L est émis par :",choices:[{text:"Les transporteurs maritimes membres d'une conférence maritime",correct:false},{text:"Les commissionnaires de transport affiliés à la FIATA",correct:true},{text:"Les armateurs pour les transports door-to-door uniquement",correct:false},{text:"La Federal Maritime Commission pour les transports vers les États-Unis",correct:false}],comment:"Le connaissement <strong>FIATA-B/L</strong> est un titre négociable édité par la Fédération Internationale des Commissionnaires de Transport et Transitaires (FIATA). Il couvre le transport de bout en bout. Les banques l'acceptent dans le cadre du crédit documentaire (art. 19-20 des RUU 600)."},
  {q:"La limite d'indemnisation pour retard prévue par la Convention de Hambourg est :",choices:[{text:"Égale à 1 fois le fret payable",correct:false},{text:"Sans plafond, limitée à la valeur réelle du préjudice",correct:false},{text:"Égale à 2 DTS par kg de marchandise retardée",correct:false},{text:"Égale à 2,5 fois le fret payable, sans excéder le montant total du fret",correct:true}],comment:"La Convention de Hambourg limite l'indemnisation pour retard à <strong>2,5 fois le prix du fret payable</strong> pour les marchandises ayant subi un retard, sans excéder le montant total du transport. La loi française permet au transporteur de limiter ou d'exclure sa responsabilité pour retard."},
  {q:"Le connaissement « à ordre » est :",choices:[{text:"Un titre non négociable remis à une personne expressément dénommée",correct:false},{text:"Un titre délivré au porteur, sans désignation de bénéficiaire",correct:false},{text:"Un titre transmissible par simple endossement",correct:true},{text:"Un connaissement exclusivement réservé aux crédits documentaires",correct:false}],comment:"Le connaissement <strong>à ordre</strong> est transmissible par simple endossement au chargeur, au destinataire, au banquier... C'est la forme la plus utilisée dans le commerce international. On distingue aussi : au porteur (délivrance au possesseur du titre) et à personne dénommée (non négociable)."},
  {q:"L'action récursoire prévue par la Convention de Hambourg est de :",choices:[{text:"90 jours",correct:true},{text:"3 mois",correct:false},{text:"6 mois",correct:false},{text:"1 an",correct:false}],comment:"La Convention de Hambourg prévoit une action récursoire de <strong>90 jours</strong> (et une prescription de 2 ans). La Convention de Bruxelles et la loi française prévoient une action récursoire de 3 mois (et une prescription de 1 an). Attention : 90 jours ≠ 3 mois en droit."},
  {q:"Le M B/L (Master Bill of Lading) est émis par :",choices:[{text:"Le groupeur maritime pour chaque envoi individuel du lot",correct:false},{text:"Le destinataire à destination pour prendre livraison",correct:false},{text:"Le chargeur réel pour attester la remise de sa marchandise",correct:false},{text:"Le transporteur maritime pour l'ensemble du lot de groupage",correct:true}],comment:"Le <strong>transporteur maritime</strong> émet le M B/L (Master Bill of Lading) pour l'ensemble du lot de groupage, mentionnant le chargeur (groupeur maritime), les ports d'embarquement et de débarquement, le destinataire (dégroupeur) et les quantités de marchandise."},
  {q:"La surcharge CAF (Currency Adjustment Factor) est :",choices:[{text:"Une surtaxe permanente pour colis extra-lourd",correct:false},{text:"Un correctif conjoncturel lié aux fluctuations monétaires",correct:true},{text:"Un correctif permanent lié à la longueur des colis",correct:false},{text:"Une ristourne accordée aux chargeurs fidèles",correct:false}],comment:"Le <strong>CAF (Currency Adjustment Factor)</strong> est un correctif conjoncturel lié aux fluctuations des taux de change. Il fait partie des correctifs conjoncturels avec le BAF (surcharge fuel) et la surcharge d'encombrement portuaire. Les correctifs permanents comprennent les surtaxes pour colis lourds, extra-longueur, etc."},
  {q:"La cotation GI-GO (Gate In – Gate Out) signifie que :",choices:[{text:"Le fret exclut toutes les opérations portuaires",correct:false},{text:"Seules les opérations de chargement sont incluses dans le fret",correct:false},{text:"Toutes les opérations portuaires sont incluses dans le fret",correct:true},{text:"Le fret est calculé de porte à porte, pré-acheminement inclus",correct:false}],comment:"Dans le cas d'une cotation <strong>Gate In – Gate Out (GI-GO)</strong>, toutes les opérations portuaires sont incluses dans le fret. C'est la cotation la plus complète pour le transport par conteneurs. La cotation CY (Container Yard) est également intéressante pour ce type de transport."},
  {q:"La freinte de route en transport maritime est :",choices:[{text:"Une tolérance de perte due à la nature de la marchandise, constituant une cause exonératoire",correct:true},{text:"Une avarie due à un mauvais arrimage de la cargaison",correct:false},{text:"Un dommage résultant d'un acte délibéré du capitaine",correct:false},{text:"Une réduction du prix du fret accordée en cas d'avaries",correct:false}],comment:"La <strong>freinte de route</strong> est une cause exonératoire de responsabilité. Elle désigne la tolérance de perte due à la nature même de la marchandise (évaporation, dessèchement...). Elle fait partie des causes exonératoires avec le vice propre de la marchandise, la faute nautique, l'acte de Dieu, la fortune de mer, etc."},
  {q:"Les compagnies assurant des services maritimes au départ ou à destination des États-Unis doivent déposer leurs conditions tarifaires auprès de :",choices:[{text:"L'OMC (Organisation Mondiale du Commerce)",correct:false},{text:"L'OCDE (Organisation de Coopération et de Développement Économiques)",correct:false},{text:"L'IATA (International Air Transport Association)",correct:false},{text:"La FMC (Federal Maritime Commission)",correct:true}],comment:"Les frets maritimes ne font généralement pas l'objet d'une publication. Toutefois, les compagnies assurant des services au départ ou à destination des <strong>États-Unis</strong> doivent obligatoirement déposer leurs conditions tarifaires auprès de la <strong>FMC (Federal Maritime Commission)</strong>."},
  {q:"La ristourne de fidélité en transport maritime est :",choices:[{text:"Une majoration appliquée aux nouveaux chargeurs",correct:false},{text:"Un taux de fret réduit accordé aux chargeurs s'engageant à confier leur fret à un transporteur",correct:true},{text:"Un remboursement partiel accordé en cas d'avarie sur la marchandise",correct:false},{text:"Un correctif conjoncturel lié à l'encombrement portuaire",correct:false}],comment:"Les <strong>ristournes</strong> (immédiates ou différées) sont des réductions accordées aux chargeurs qui s'engagent à confier la totalité ou une partie de leur fret à un transporteur ou à un groupe de transporteurs. Elles sont calculées sur le taux de fret de base et servent à fidéliser les chargeurs face aux outsiders."},
  {q:"Le connaissement pour embarquement (« received for shipment ») atteste :",choices:[{text:"Que la marchandise a été effectivement chargée à bord du navire",correct:false},{text:"Que le connaissement est net de toutes réserves sur l'état de la marchandise",correct:false},{text:"Que le transporteur a pris possession de la marchandise mais qu'elle n'est pas encore embarquée",correct:true},{text:"Que le fret a été payé en port dû par le destinataire",correct:false}],comment:"Le connaissement <strong>« received for shipment »</strong> (pour embarquement) atteste la prise de possession de la marchandise par le transporteur, mais que la marchandise n'est pas encore embarquée. Le connaissement <strong>« shipped on board »</strong> (embarqué) atteste quant à lui l'embarquement effectif."},
  {q:"Pour le chargement de conteneurs en pontée sur des navires porte-conteneurs, selon la loi française :",choices:[{text:"Le consentement du chargeur est supposé donné d'office",correct:true},{text:"Un accord écrit du chargeur est toujours obligatoire",correct:false},{text:"Le chargement en pontée est systématiquement interdit",correct:false},{text:"La Convention de Hambourg s'applique exclusivement",correct:false}],comment:"Selon la loi française, pour le chargement de conteneurs sur des navires munis d'installations appropriées (porte-conteneurs), le <strong>consentement du chargeur est supposé donné d'office</strong>. Pour les autres marchandises, un consentement écrit est requis. La Convention de Hambourg impose quant à elle un accord du chargeur dans tous les cas, sauf texte obligatoire contraire."}
];
const letters=['A','B','C','D'];
let shuffled=[],current=0,answers=[],validated=[];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function init(){shuffled=rawQuestions.map(q=>{const mixed=shuffle(q.choices);const correctIdx=mixed.findIndex(c=>c.correct);return{q:q.q,choices:mixed,correctIdx,comment:q.comment};});answers=new Array(shuffled.length).fill(null);validated=new Array(shuffled.length).fill(false);current=0;render();}
function render(){const item=shuffled[current];document.getElementById('qBadge').textContent=`Q${current+1}`;document.getElementById('qText').textContent=item.q;const container=document.getElementById('choicesContainer');container.innerHTML='';item.choices.forEach((c,j)=>{const label=document.createElement('label');label.className='choice-label'+(validated[current]?' locked':'');if(validated[current]){if(j===item.correctIdx)label.classList.add('correct');else if(j===answers[current]&&answers[current]!==item.correctIdx)label.classList.add('wrong');}else if(answers[current]===j){label.classList.add('selected');}label.innerHTML=`<input type="radio" name="choice" value="${j}"><span class="choice-letter">${letters[j]}</span><span>${c.text}</span>`;if(!validated[current]){label.addEventListener('click',()=>selectChoice(j));}container.appendChild(label);});const fb=document.getElementById('feedbackBox');if(validated[current]){const correct=answers[current]===item.correctIdx;fb.style.display='block';fb.className='feedback-box '+(correct?'ok':'ko');document.getElementById('fbVerdict').innerHTML=correct?`✓ Bonne réponse — ${letters[item.correctIdx]}`:`✗ Mauvaise réponse — La bonne réponse était : <strong>${letters[item.correctIdx]}</strong>`;document.getElementById('fbComment').innerHTML=item.comment;}else{fb.style.display='none';}const btnValidate=document.getElementById('btnValidate');const btnNext=document.getElementById('btnNext');const btnPrev=document.getElementById('btnPrev');if(validated[current]){btnValidate.style.display='none';btnNext.style.display='block';btnNext.textContent=current<shuffled.length-1?'Suivant →':'Voir le score';}else{btnValidate.style.display='block';btnValidate.disabled=answers[current]===null;btnNext.style.display='none';}btnPrev.style.display=current>0?'block':'none';updateProgress();}
function selectChoice(j){if(validated[current])return;answers[current]=j;render();}
function validateAnswer(){if(answers[current]===null)return;validated[current]=true;render();}
function goTo(idx){if(idx<0)return;if(idx>=shuffled.length){showScore();return;}current=idx;render();}
function updateProgress(){const done=validated.filter(Boolean).length;document.getElementById('progressFill').style.width=(done/shuffled.length*100)+'%';document.getElementById('progressLabel').textContent=`${done} / ${shuffled.length}`;}
function showScore(){let score=0;shuffled.forEach((item,i)=>{if(validated[i]&&answers[i]===item.correctIdx)score+=2;});document.getElementById('mainCard').style.display='none';const sc=document.getElementById('scoreCard');sc.style.display='block';document.getElementById('scoreBig').textContent=score;document.getElementById('scoreDetail').textContent=`${Math.round(score/40*100)} % de bonnes réponses`;let m='';if(score>=36)m='🏆 Excellent — Maîtrise parfaite !';else if(score>=28)m='✅ Bon niveau — Continue ainsi !';else if(score>=20)m='📘 Passable — Quelques révisions s\'imposent.';else m='⚠️ Insuffisant — Relis le chapitre attentivement.';document.getElementById('scoreMention').textContent=m;sc.scrollIntoView({behavior:'smooth',block:'center'});}
function restart(){document.getElementById('scoreCard').style.display='none';document.getElementById('mainCard').style.display='block';init();window.scrollTo({top:0,behavior:'smooth'});}
init();
</script>
</body>
</html>
