<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
:root{--gd:#1a5c38;--gm:#2e7d52;--gl:#e8f5ee;--ga:#2ecc71;--red:#c0392b;--rl:#fdecea;--bg:#f4f4f2;--bd:#ddd;--tx:#1c1c1c;--wh:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
header{background:var(--gd);color:var(--wh);padding:20px 32px 16px;border-bottom:4px solid var(--ga);}
header .lb{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ga);margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;}
header .mt{margin-top:6px;font-size:12px;color:rgba(255,255,255,0.6);}
.elim{display:inline-block;margin-left:8px;background:rgba(192,57,43,0.35);border:1px solid rgba(192,57,43,0.6);color:#ffbbbb;font-size:11px;padding:2px 8px;border-radius:4px;}
.pw{background:var(--gd);padding:11px 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.1);}
.pt{flex:1;background:rgba(255,255,255,0.15);border-radius:4px;height:5px;overflow:hidden;}
.pf{height:100%;background:var(--ga);border-radius:4px;transition:width 0.4s ease;}
.pl{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:rgba(255,255,255,0.8);white-space:nowrap;min-width:65px;text-align:right;}
.wrap{max-width:740px;margin:32px auto;padding:0 18px 60px;}
.card{background:var(--wh);border-radius:12px;border:1px solid var(--bd);padding:30px 34px;box-shadow:0 2px 12px rgba(0,0,0,0.06);animation:fi 0.22s ease;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qm{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.qb{background:var(--gd);color:var(--wh);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:3px 11px;border-radius:5px;}
.qp{font-size:12px;color:#999;}
.qt{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:20px;color:var(--tx);}
.cs{display:flex;flex-direction:column;gap:8px;}
.cl{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13.5px;transition:border-color 0.15s,background 0.15s;line-height:1.4;}
.cl:hover:not(.lk){border-color:var(--gm);background:var(--gl);}
.cl input{display:none;}
.cl .lt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--gd);background:var(--gl);border-radius:4px;padding:2px 7px;flex-shrink:0;margin-top:1px;}
.cl.sl{border-color:var(--gd);background:var(--gl);}
.cl.ok{border-color:var(--ga);background:#eafaf1;}
.cl.ko{border-color:var(--red);background:var(--rl);}
.cl.ok .lt{background:#c3efda;color:#1a7a3f;}
.cl.ko .lt{background:#fadbd8;color:var(--red);}
.fb{display:none;margin-top:16px;padding:13px 15px;border-radius:8px;font-size:13px;line-height:1.55;}
.fb.good{background:#eafaf1;border-left:4px solid var(--ga);color:#1a5c38;}
.fb.bad{background:var(--rl);border-left:4px solid var(--red);color:#8b1a1a;}
.fb .vd{font-weight:700;font-size:13.5px;margin-bottom:4px;}
.fb .cm{color:#333;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;}
.btn{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:7px;padding:11px 20px;cursor:pointer;transition:background 0.2s,opacity 0.2s;}
.bp{background:#e8e8e4;color:#555;}.bp:hover{background:#d5d5ce;}
.bv{background:var(--gd);color:var(--wh);flex:1;}.bv:hover{background:var(--gm);}.bv:disabled{opacity:0.4;cursor:not-allowed;}
.bn{background:var(--gd);color:var(--wh);}.bn:hover{background:var(--gm);}
.sc{display:none;background:var(--gd);color:var(--wh);border-radius:12px;padding:38px 34px;text-align:center;box-shadow:0 4px 20px rgba(26,92,56,0.2);}
.sc .big{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:700;color:var(--ga);line-height:1;}
.sc .sub{font-size:14px;color:rgba(255,255,255,0.65);margin-top:5px;}
.sc .mn{font-size:17px;font-weight:600;margin-top:16px;}
.sc .dt{margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6);}
.sc .ew{margin-top:12px;padding:10px 14px;background:rgba(192,57,43,0.3);border-radius:8px;font-size:13px;color:#ffcccc;}
.br{margin-top:20px;background:transparent;border:2px solid rgba(255,255,255,0.35);color:var(--wh);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:9px 24px;border-radius:7px;cursor:pointer;}
.br:hover{border-color:var(--ga);color:var(--ga);}
@media(max-width:600px){header{padding:16px 14px 12px;}header h1{font-size:17px;}.pw{padding:9px 14px;}.wrap{padding:0 10px 48px;}.card{padding:20px 16px;}.qt{font-size:14px;}.cl{font-size:13px;}}

<body>
<header>
  <div class="lb">Examen d'attestation de capacité — Commissionnaire de transport</div>
  <h1>QCM Annale officielle — Session 6 octobre 2021</h1>
  <div class="mt">50 questions · 2 points chacune · Score max : 100 points <span class="elim">⚠ Note éliminatoire &lt; 50/100</span></div>
</header>
<div class="pw">
  <div class="pt"><div class="pf" id="pf"></div></div>
  <div class="pl" id="pl">0 / 50</div>
</div>
<div class="wrap">
  <div class="card" id="card">
    <div class="qm"><span class="qb" id="qb">Q1</span><span class="qp">2 points</span></div>
    <div class="qt" id="qt"></div>
    <div class="cs" id="cs"></div>

    <div class="nav">
      <button class="btn bp" id="btnP" onclick="go(cur-1)">← Précédent</button>
      <button class="btn bv" id="btnV" onclick="doVal()">Valider</button>
      <button class="btn bn" id="btnN" onclick="go(cur+1)" style="display:none">Suivant →</button>
    </div>
  </div>

    <div class="big" id="sb"></div><div class="sub">points sur 100</div>
    <div class="mn" id="sm"></div><div class="dt" id="sd"></div>
    <div class="ew" id="ew" style="display:none">⚠ Score inférieur à la note éliminatoire de 50/100</div>
    <button class="br" onclick="restart()">Recommencer</button>
  </div>
</div>
<script>
var Q=[
{q:"L'escompte d'une traite consiste à :",
c:["indiquer au dos de l'effet un nouveau bénéficiaire","compter des frais d'agio en cas de non paiement","obtenir la signature de sa banque pour confirmer la traite","obtenir de sa banque une avance sur le montant de la traite"],
r:3,
x:"L'<strong>escompte</strong> consiste à céder une traite à sa banque avant son échéance en échange d'une <strong>avance de trésorerie</strong> (déduction faite des agios). La banque devient le nouveau bénéficiaire et se chargera du recouvrement à l'échéance."},

{q:"En transport national, un destinataire constate des avaries le jour de la livraison et émet des réserves dans les 3 jours. Le transporteur ne donnant pas suite, le destinataire dispose d'un délai de prescription de :",
c:["6 mois","1 an","2 ans","3 ans"],
r:1,
x:"En transport national, le délai de prescription pour agir contre le transporteur est d'<strong>1 an</strong> à compter de la livraison (ou de la date prévue de livraison en cas de perte). Les réserves dans les 3 jours sont une condition de recevabilité de l'action."},

{q:"Un commerçant parisien confie à un transporteur lyonnais une expédition au départ de Lille à destination de Marseille. Le transporteur non payé assigne son client. Le tribunal de commerce normalement compétent sera celui de :",
c:["Paris","Lyon","Lille","Marseille"],
r:0,
x:"En matière commerciale, le demandeur peut saisir le tribunal du <strong>domicile du défendeur</strong>. Le client (débiteur) est domicilié à <strong>Paris</strong>. C'est donc le tribunal de commerce de Paris qui est compétent, sauf clause attributive de juridiction."},

{q:"En cas de désaccord avec une décision du tribunal de commerce concernant un montant de 7 500 €, vous pouvez porter l'affaire devant :",
c:["la Cour de Cassation","la Cour d'Appel","le tribunal judiciaire","la Cour d'Assises"],
r:1,
x:"Pour un litige de 7 500 € jugé par le tribunal de commerce, l'appel est possible devant la <strong>Cour d'Appel</strong>. En dessous de 5 000 €, la décision est rendue en dernier ressort (sans appel possible). La Cour de Cassation ne juge que les questions de droit."},

{q:"Les associés d'une SARL décident d'augmenter le capital social en faisant appel à de nouveaux apports. Ils doivent le faire :",
c:["lors de l'assemblée générale ordinaire","lors de l'assemblée générale constitutive","lors de l'assemblée générale extraordinaire","en dehors de toute assemblée"],
r:2,
x:"L'augmentation du capital social est une modification des statuts. Elle ne peut être décidée que lors d'une <strong>assemblée générale extraordinaire (AGE)</strong>, qui requiert un quorum et une majorité qualifiée. L'AGO ne peut pas modifier les statuts."},

{q:"Le fonds de roulement permanent se calcule de la manière suivante :",
c:["capitaux propres - actif immobilisé","(capitaux propres + dettes à plus d'un an) - actif immobilisé","dettes à long et moyen terme - actif immobilisé","dettes à court terme - actif immobilisé"],
r:1,
x:"Le <strong>fonds de roulement permanent (FRP)</strong> = (Capitaux propres + Dettes à plus d'un an) - Actif immobilisé. Il représente la part des ressources stables qui finance le cycle d'exploitation (BFR). Un FRP positif est un signe de bonne santé financière."},

{q:"Dans les capitaux propres au passif du bilan, les réserves permettent :",
c:["d'augmenter les dettes financières de l'entreprise","d'affecter en ressources tout ou partie des bénéfices réalisés","de conserver une partie du bénéfice sur un compte bloqué en banque","de constituer une provision pour l'URSSAF"],
r:1,
x:"Les réserves permettent d'<strong>affecter tout ou partie des bénéfices réalisés</strong> en ressources propres permanentes de l'entreprise. Elles renforcent les capitaux propres sans sortie de trésorerie. Il existe des réserves légales (obligatoires) et facultatives."},

{q:"La durée de temps de service maximale hebdomadaire sur 3 ou 4 mois (après accord) d'un conducteur grand routier ou longue distance ne peut dépasser :",
c:["52 heures","56 heures","53 heures","48 heures"],
r:2,
x:"Selon l'article R.3312-50 du Code des transports, la durée maximale hebdomadaire de temps de service des conducteurs grand routier/longue distance, sur une période de 3 ou 4 mois après accord, est de <strong>53 heures</strong>."},

{q:"Une convention collective de branche est un accord conclu entre :",
c:["les employeurs après consultation de l'inspection du travail","le ministère du travail et les syndicats","les représentants du personnel et les délégués syndicaux","les organisations professionnelles d'employeurs et les organisations syndicales de salariés, représentatives au niveau de cette branche"],
r:3,
x:"Une convention collective de branche est négociée et signée par les <strong>organisations professionnelles d'employeurs</strong> (ex. : FNTR, TLF) et les <strong>organisations syndicales représentatives</strong> au niveau de la branche (ex. : CGT, CFDT, FO...)."},

{q:"Le certificat de travail mentionne obligatoirement :",
c:["les dates d'entrée et de sortie","le motif de la fin du contrat (rupture)","une appréciation générale sur les qualités professionnelles","l'existence d'une clause de non concurrence"],
r:0,
x:"Le certificat de travail doit obligatoirement mentionner : <strong>les dates d'entrée et de sortie</strong>, la nature des emplois occupés et leurs dates. Il ne doit pas comporter d'appréciation sur les qualités professionnelles et ne mentionne pas le motif de rupture."},

{q:"L'absence de contrat écrit à l'issue d'un CDD, si le salarié est maintenu dans l'entreprise, entraîne :",
c:["la rupture du contrat","le renouvellement systématique pour une même durée","la régularisation par un écrit","un contrat réputé tacitement à durée indéterminée"],
r:3,
x:"Si le salarié continue à travailler après le terme d'un CDD sans qu'un nouveau contrat écrit soit établi, la relation de travail devient un <strong>contrat à durée indéterminée</strong> par tacite reconduction (Art. L.1243-11 C.trav.)."},

{q:"Conformément à l'article L.132-8 du Code de commerce, le transporteur peut avoir une action directe en paiement à l'encontre :",
c:["uniquement de l'expéditeur","uniquement du commissionnaire s'il est intervenu","uniquement du destinataire","de l'expéditeur, du commissionnaire (s'il est intervenu) ou du destinataire"],
r:3,
x:"L'article L.132-8 du Code de commerce prévoit une <strong>action directe</strong> du transporteur contre <strong>l'expéditeur, le commissionnaire</strong> (s'il est intervenu) <strong>ou le destinataire</strong>. Ces trois parties sont solidairement tenues au paiement du prix de transport."},

{q:"Une entreprise de transport ayant son siège en Allemagne peut être inscrite en France au registre électronique national des entreprises de transport par route, si elle dispose en France :",
c:["de deux filiales au minimum inscrites au RCS","d'un garage lui permettant d'assurer l'entretien de ses véhicules","d'un établissement secondaire inscrit au RCS","d'un entrepôt lui permettant d'assurer le dépôt de ses marchandises"],
r:2,
x:"Pour être inscrite au registre français, une entreprise étrangère doit disposer en France d'un <strong>établissement secondaire inscrit au RCS</strong>. Cet établissement doit avoir une activité réelle et stable, avec un gestionnaire de transport désigné."},

{q:"Le contrat type dit général prévoit que si le transporteur ne se présente pas à l'heure fixée pour le chargement, le client :",
c:["peut remettre immédiatement le chargement à un autre transporteur","peut rechercher un autre transporteur deux heures après l'heure fixée pour la mise à disposition du véhicule","peut rechercher un autre transporteur huit heures après l'heure fixée pour la mise à disposition du véhicule","doit attendre votre véhicule pendant 24 heures"],
r:1,
x:"Selon le contrat type général, si le transporteur ne se présente pas à l'heure convenue, le donneur d'ordre peut rechercher un autre transporteur <strong>deux heures après l'heure fixée</strong> pour la mise à disposition du véhicule."},

{q:"Sauf dérogation, les restrictions de circulation du samedi 22h au dimanche 22h concernent les véhicules dont le poids total autorisé en charge excède :",
c:["3,5 tonnes","6 tonnes","7,5 tonnes","12 tonnes"],
r:2,
x:"Les restrictions de circulation dominicale s'appliquent aux véhicules de transport routier de marchandises dont le PTAC excède <strong>7,5 tonnes</strong>. Des dérogations existent pour certaines catégories de transport (denrées périssables, produits pétroliers, animaux vivants...)."},

{q:"En transport routier intérieur, pour confirmer ses réserves au transporteur, le destinataire dispose d'un délai non compris les jours fériés à compter de :",
c:["3 jours de la livraison","7 jours de la livraison","30 jours de la livraison","30 jours de l'enlèvement"],
r:0,
x:"Le destinataire dispose de <strong>3 jours</strong> (non compris les dimanches et jours fériés) à compter de la livraison pour confirmer ses réserves au transporteur par lettre recommandée (Art. L.133-3 C.com.). À défaut, c'est la forclusion."},

{q:"Pèse sur le transporteur public routier de marchandises :",
c:["une responsabilité simple en cas de dommages aux marchandises","une présomption de responsabilité en cas de dommages aux marchandises ou de perte des objets à transporter","une responsabilité uniquement en cas de dommages aux marchandises","une présomption de responsabilité uniquement en cas de dommages aux marchandises"],
r:1,
x:"Le transporteur public routier est soumis à une <strong>présomption de responsabilité</strong> tant pour les <strong>pertes</strong> que pour les <strong>avaries</strong> aux marchandises. Il doit prouver une cause étrangère pour s'exonérer (force majeure, vice propre, faute du chargeur...)."},

{q:"Dans le cas d'un transport international sans rupture de charge comprenant un parcours maritime, la CMR s'applique :",
c:["sur le parcours routier","sur la totalité du parcours","sur le parcours maritime","uniquement dans le pays de destination"],
r:1,
x:"Selon l'article 2 de la CMR, pour un transport <strong>sans rupture de charge</strong> incluant un trajet maritime, la CMR s'applique à <strong>la totalité du parcours</strong>. Si les marchandises sont rechargées sur un autre moyen, c'est la convention du mode concerné qui s'applique."},

{q:"En transport international (CMR), en cas de dommages non apparents, les formalités à accomplir sont :",
c:["constat contradictoire ou réserves adressées au moment de la livraison","constat non contradictoire ou réserves adressées au moment de la livraison","réserves écrites dans les 7 jours à compter de la livraison, dimanches et jours fériés non compris","réserves écrites dans les 3 jours à compter de la livraison, dimanches et jours fériés non compris"],
r:2,
x:"Selon l'article 30 de la CMR, pour les <strong>dommages non apparents</strong>, les réserves doivent être adressées par écrit au transporteur dans les <strong>7 jours</strong> suivant la livraison (dimanches et jours fériés non compris)."},

{q:"Vous envisagez de faire du transport international sous le régime TIR. Vous demandez un certificat d'agrément auprès :",
c:["du service des mines","de la Direction régionale de l'environnement, de l'aménagement et du logement (DREAL)","du service des douanes","de l'Association française des transporteurs routiers internationaux (AFTRI)"],
r:2,
x:"Le certificat d'agrément TIR est délivré par le <strong>service des douanes</strong>. Le TIR est une convention douanière, et c'est donc l'administration des douanes qui habilite les véhicules à effectuer des transports sous ce régime."},

{q:"Un transporteur de l'Union européenne effectuant une opération de cabotage en France pour un commissionnaire français adresse une facture :",
c:["HT en exonération de la TVA","TTC mentionnant la TVA française (20%)","HT mentionnant le numéro d'identification intra-communautaire du commissionnaire","TTC mentionnant la TVA de son propre Etat"],
r:2,
x:"Pour une prestation de transport B2B intracommunautaire (cabotage en France facturé à un commissionnaire français), la TVA est due en France par autoliquidation. Le transporteur étranger facture donc <strong>HT en mentionnant le numéro de TVA intracommunautaire</strong> du commissionnaire français."},

{q:"Le moyen de paiement le plus sécurisé à l'international est :",
c:["virement bancaire","lettre de change","chèque","lettre de crédit stand-by"],
r:0,
x:"Le <strong>virement bancaire</strong> (SWIFT) est considéré comme le moyen de paiement le plus sécurisé car il est irrévocable une fois exécuté et permet un transfert direct de fonds entre banques. La lettre de crédit offre plus de garanties documentaires mais est plus complexe."},

{q:"L'entrepôt national d'importation est un régime :",
c:["suspensif fiscal qui permet de stocker des biens sur le territoire français","dont la durée est limitée à 12 mois","qui concerne les biens provenant d'un territoire fiscal de l'Union européenne","qui dispense du dépôt des DEB (déclaration d'échange de biens) lors de la sortie"],
r:0,
x:"L'entrepôt national d'importation est un <strong>régime suspensif fiscal</strong> permettant de stocker des marchandises en suspension de TVA (et non de droits de douane, car les marchandises sont déjà en libre pratique). Il s'applique aux biens UE soumis à TVA."},

{q:"Parmi les droits et taxes à acquitter lors d'une mise à la consommation d'une marchandise hors UE, ne figure pas :",
c:["la TIPP (taxe intérieure sur les produits pétroliers)","les droits de douane","la TVA","les droits d'accise"],
r:0,
x:"La <strong>TIPP</strong> (rebaptisée TICPE en 2011) est une taxe spécifique aux <strong>produits pétroliers</strong>. Elle ne s'applique pas à toutes les marchandises importées. Les droits de douane, la TVA et les droits d'accise sont des taxes générales potentiellement applicables lors d'une mise à la consommation."},

{q:"Vous importez de Chine du matériel spécialisé pour la durée d'un chantier. Le régime douanier le mieux adapté sera :",
c:["le perfectionnement passif","l'importation","le perfectionnement actif","l'admission temporaire"],
r:3,
x:"L'<strong>admission temporaire</strong> est le régime idéal pour importer temporairement du matériel destiné à être réexporté en l'état après utilisation. Elle permet une exonération totale ou partielle des droits de douane et taxes pour la durée du chantier."},

{q:"En transport aérien, en cas de retard, la protestation doit être faite au plus tard dans les :",
c:["3 jours","7 jours","21 jours","30 jours"],
r:2,
x:"Selon la Convention de Montréal (art. 31), en cas de retard en transport aérien, la protestation doit être adressée au transporteur dans les <strong>21 jours</strong> à compter de la mise à disposition de la marchandise au destinataire."},

{q:"Le contrat type de commission de transport prévoit que la déclaration de valeur souscrite par le donneur d'ordre :",
c:["sert au calcul du devis du commissionnaire de transport","ne fait pas l'objet d'une rémunération supplémentaire du commissionnaire de transport","fait l'objet d'une rémunération supplémentaire du commissionnaire de transport","fait l'objet d'une rémunération forfaitaire du commissionnaire de transport"],
r:2,
x:"Selon l'article 13.3 du contrat type de commission, la déclaration de valeur <strong>fait l'objet d'une rémunération supplémentaire</strong> du commissionnaire. En échange, le montant déclaré se substitue aux plafonds légaux d'indemnisation."},

{q:"L'intérêt spécial à la livraison a pour effet :",
c:["d'accélérer le transport","de substituer son montant aux plafonds d'indemnité pour retard","d'imposer un droit de timbre fiscal","d'exonérer le commissionnaire de transport de son obligation de livrer"],
r:1,
x:"L'intérêt spécial à la livraison (art. 13.4 du contrat type de commission) <strong>se substitue aux plafonds légaux d'indemnité pour retard</strong>. Le montant déclaré remplace le plafond standard (prix de la prestation). Il donne lieu à une rémunération supplémentaire."},

{q:"Selon le contrat type de commission de transport, en cas de retard de paiement, le taux prévu est de :",
c:["2 fois le taux d'intérêt légal","4 fois le taux d'intérêt légal","5 fois le taux d'intérêt légal","10 fois le taux d'intérêt légal"],
r:2,
x:"L'article 12.3 du contrat type de commission prévoit des intérêts de retard équivalant à <strong>5 fois le taux d'intérêt légal</strong>, exigibles dès le jour suivant la date de règlement figurant sur la facture, sans mise en demeure préalable."},

{q:"Le contrat type de commission de transport prévoit que la vérification des informations et pièces nécessaires à l'établissement du document de transport est effectuée par le :",
c:["commissionnaire de transport","commettant","transporteur","bénéficiaire du transport"],
r:0,

var L=["a","b","c","d"];
var cur=0,ans=new Array(Q.length).fill(-1),val_=new Array(Q.length).fill(false);
function render(){
  var item=Q[cur];
  document.getElementById("qb").textContent="Question "+(cur+1);
  document.getElementById("qt").textContent=item.q;
  var cs=document.getElementById("cs");cs.innerHTML="";
  for(var j=0;j<4;j++){
    var lb=document.createElement("label");
    lb.className="cl"+(val_[cur]?" lk":"");
    if(val_[cur]){if(j===item.r)lb.classList.add("ok");else if(j===ans[cur]&&ans[cur]!==item.r)lb.classList.add("ko");}
    else if(ans[cur]===j)lb.classList.add("sl");
    lb.innerHTML='<input type="radio" name="ch" value="'+j+'"><span class="lt">'+L[j]+'</span><span>'+item.c[j]+'</span>';
    if(!val_[cur]){(function(jj){lb.addEventListener("click",function(){pick(jj);});})(j);}
    cs.appendChild(lb);
  }
  var fb=document.getElementById("fb");
  if(val_[cur]){
    fb.style.display="block";fb.className="fb "+(ans[cur]===item.r?"good":"bad");
    document.getElementById("vd").innerHTML=(ans[cur]===item.r)?"✓ Bonne réponse — "+L[item.r]:"✗ Mauvaise réponse — La bonne réponse était : <strong>"+L[item.r]+"</strong>";
    document.getElementById("cm").innerHTML=item.x;
  }else{fb.style.display="none";}
  var bv=document.getElementById("btnV"),bn=document.getElementById("btnN"),bp=document.getElementById("btnP");
  if(val_[cur]){bv.style.display="none";bn.style.display="block";bn.textContent=cur<Q.length-1?"Suivant →":"Voir le score";}
  else{bv.style.display="block";bv.disabled=(ans[cur]===-1);bn.style.display="none";}
  bp.style.display=cur>0?"block":"none";prog();
}
function pick(j){if(val_[cur])return;ans[cur]=j;render();}
function doVal(){if(ans[cur]===-1)return;val_[cur]=true;render();}
function go(i){if(i<0)return;if(i>=Q.length){showScore();return;}cur=i;render();}
function prog(){var d=0;for(var i=0;i<val_.length;i++)if(val_[i])d++;document.getElementById("pf").style.width=(d/Q.length*100)+"%";document.getElementById("pl").textContent=d+" / "+Q.length;}
function showScore(){
  var s=0;for(var i=0;i<Q.length;i++)if(val_[i]&&ans[i]===Q[i].r)s+=2;
  document.getElementById("card").style.display="none";var sc=document.getElementById("sc");sc.style.display="block";
  document.getElementById("sb").textContent=s;document.getElementById("sd").textContent=Math.round(s/2)+" questions correctes sur 50";
  var m="";if(s>=90)m="🏆 Excellent !";else if(s>=70)m="✅ Bon niveau.";else if(s>=50)m="📘 Passable — Des révisions s'imposent.";else m="⚠️ Score insuffisant — Révisions intensives nécessaires.";
  document.getElementById("sm").textContent=m;document.getElementById("ew").style.display=s<50?"block":"none";sc.scrollIntoView({behavior:"smooth",block:"center"});
}
function restart(){ans=new Array(Q.length).fill(-1);val_=new Array(Q.length).fill(false);cur=0;document.getElementById("sc").style.display="none";document.getElementById("card").style.display="block";render();window.scrollTo({top:0,behavior:"smooth"});}
render();
</script>
