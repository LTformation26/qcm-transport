<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Capacité de transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;
    --line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;
    --ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;
    --shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;
    --line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;
    --ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28);
  }}
  :root[data-theme="dark"]{
    --bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;
    --line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;
    --ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
  header{padding:44px 0 20px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;letter-spacing:-.01em}
  .lede{color:var(--muted);margin:14px 0 0;max-width:58ch;font-size:15.5px}
  .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 26px;padding:12px 20px}
  .bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prog b{color:var(--ink);font-weight:600}
  .pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  .q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
  .q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
  .q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
  .opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}
  .opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.no{background:var(--no-bg);border-color:var(--no-line)}
  .opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
  .rule.show{display:block}
  .rule .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:5px}
  .rule p{margin:0 0 4px}
  .rule p:last-child{margin:0}
  .result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
  .result.show{display:block}
  .result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}
  .result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
  .reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
  .reset:hover{color:var(--ink);border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="bar"><div class="bar-inner">
  <div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
  <div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>

<div class="wrap">
  <header>
    <p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
    <h1>QCM — 50 questions</h1>
    <p class="lede">Chaque bonne réponse vaut 2 points.</p>
  </header>
  <div id="list"></div>
  <div class="result" id="result">
    <div class="big"><span id="fpts">0</span> / <span id="fmax">100</span></div>
    <div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">50</span> · <span id="fpct">0</span> %</div>
    <div class="msg" id="fmsg"></div>
    <button class="reset" id="reset">↺ Recommencer</button>
  </div>
</div>

<script>
const Q=[
{q:"Lors d'un transport routier Paris-Rome, la marchandise est considérée comme perdue si elle n'a pas été livrée dans les :",o:["30 jours qui suivent sa prise en charge, s'il n'a pas été convenu de délai","30 jours qui suivent l'expiration du délai convenu","15 jours qui suivent l'expiration du délai convenu","45 jours qui suivent sa prise en charge, s'il n'a pas été convenu de délai"],c:1,r:["Un trajet international comme Paris-Rome relève des règles de la CMR.","La marchandise est considérée comme perdue si elle arrive avec plus de 30 jours de retard sur le délai convenu, ou 60 jours après la prise en charge lorsqu'aucun délai n'a été fixé."]},
{q:"Dans une EURL (entreprise unipersonnelle à responsabilité limitée) :",o:["les bénéfices sont toujours prélevés en totalité par l'associé unique","l'associé unique est responsable des pertes dans la limite de ses apports","les bénéfices ne peuvent être distribués pendant les deux premières années","les pertes viennent obligatoirement abaisser le capital social"],c:1,r:["L'EURL est une SARL qui ne compte qu'un seul associé.","Sa responsabilité se limite à ses apports : il ne perd que l'argent mis dans la société, ses biens personnels restent protégés."]},
{q:"Le nantissement d'un fonds de commerce de transport doit être inscrit :",o:["au greffe du tribunal d'instance","au greffe du tribunal de commerce","au ministère des Transports","à la chambre de commerce et d'industrie"],c:1,r:["Mettre un fonds de commerce en garantie est un acte commercial.","Il se déclare au greffe du tribunal de commerce, là où l'entreprise est immatriculée."]},
{q:"Le souscripteur d'un billet à ordre est :",o:["l'acheteur","le vendeur","le banquier du client","le banquier du vendeur"],c:0,r:["Le billet à ordre est signé par celui qui doit de l'argent.","Dans une vente, ce débiteur est l'acheteur, qui s'engage ainsi à payer le vendeur."]},
{q:"Quand une personne a pris en gérance libre une entreprise, elle est au moins locataire :",o:["du fonds de commerce","du local commercial","du matériel","de l'ensemble fonds + local"],c:0,r:["La gérance libre consiste à louer un fonds de commerce pour l'exploiter à ses propres risques.","On loue la clientèle et le nom commercial, pas forcément les murs, qui relèvent d'un bail séparé."]},
{q:"Dans quel type de société les apports en industrie sont-ils admis ?",o:["les SNC et les SARL","les SCA pour les associés commanditaires","les SCS pour les associés commanditaires","les SA"],c:0,r:["L'apport en industrie consiste à apporter son travail ou son savoir-faire, au lieu d'argent ou de biens.","Il est admis dans les SNC et les SARL, mais interdit dans les SA."]},
{q:"Parmi ces mentions, laquelle doit figurer obligatoirement dans les statuts d'une société :",o:["l'objet social de la société","le régime fiscal adopté","le code Naf","le nom du ou des gérants"],c:0,r:["La nomination du dirigeant (gérant, président) peut se faire de deux manières.","Soit dans un acte séparé (procès-verbal de nomination).","Soit directement dans les statuts (gérant statutaire) : c'est une possibilité, mais pas une obligation légale."]},
{q:"Dans le cas d'un chèque certifié, la banque du tireur :",o:["s'engage à bloquer la provision pendant la durée légale du délai de présentation","ne fait que constater la provision au moment de l'établissement du chèque","paye tout de suite la somme au bénéficiaire","s'engage à bloquer la provision pendant 30 jours"],c:0,r:["Certifier un chèque consiste à faire bloquer la somme sur le compte du client pendant le délai de présentation.","Le bénéficiaire est ainsi certain d'être payé ; la provision désigne l'argent disponible sur le compte."]},
{q:"Le contrat type applicable aux transports sous-traités s'applique aux relations entre :",o:["un transporteur et un loueur de véhicules avec conducteur","une entreprise pour compte propre et une entreprise de transport public","un commissionnaire de transport et un transporteur public routier","un commissionnaire et un loueur de véhicules avec conducteur"],c:2,r:["Le contrat type de sous-traitance règle les rapports entre celui qui confie le transport et celui qui l'exécute.","Il s'applique entre un commissionnaire et le transporteur public routier qui réalise la prestation."]},
{q:"Un client paie son fournisseur par chèque. La dette est éteinte :",o:["dès l'établissement du chèque","lors de l'encaissement du chèque","dès la remise au bénéficiaire","dès la transmission du chèque à la banque"],c:1,r:["Remettre un chèque ne suffit pas à payer une dette.","Celle-ci n'est éteinte que lorsque la banque a effectivement encaissé la somme."]},
{q:"Un billet à ordre est un moyen :",o:["par lequel un tireur ordonne à un tiré de verser une somme à un bénéficiaire","par lequel un souscripteur s'engage à payer à un bénéficiaire une somme à une date déterminée","par lequel un tireur donne l'ordre à un tiré de payer à une échéance donnée","qui permet de gager une marchandise"],c:1,r:["Le billet à ordre est un engagement du souscripteur de payer lui-même une somme à une date fixée.","C'est la différence avec la lettre de change, où l'on donne l'ordre à un tiers de payer."]},
{q:"Les associés d'une SARL peuvent demander communication des comptes annuels du dernier exercice :",o:["à tout moment","seulement au gérant et si celui-ci accepte","seulement lors de l'assemblée générale ordinaire","seulement lors de l'assemblée générale d'approbation des comptes"],c:0,r:["L'associé d'une SARL dispose d'un droit d'information permanent.","Il peut obtenir la communication des comptes à tout moment, sans attendre une assemblée."]},
{q:"Pour constituer une société anonyme, il faut :",o:["obligatoirement faire un appel public à l'épargne","un minimum d'apports en capitaux","obligatoirement passer par une bourse de valeur","un minimum d'apports en nature"],c:1,r:["Une SA se crée d'abord en réunissant un capital minimum, fixé à 37 000 euros.","L'appel public à l'épargne et la cotation en bourse ne sont pas obligatoires."]},
{q:"La condition de capacité financière exigible pour une entreprise de transport correspond :",o:["à un impôt payé par le transporteur à la fin de chaque exercice","au montant des capitaux permanents","à un rapport entre les immobilisations et les capitaux permanents","à un montant minimum de capitaux propres déterminé en fonction du parc"],c:3,r:["La capacité financière impose de disposer d'un montant minimum de capitaux propres.","Ce montant dépend du nombre de véhicules exploités."]},
{q:"Les réserves permettent :",o:["d'utiliser les recettes de l'année","de conserver en ressources une partie du bénéfice","de conserver une partie du bénéfice sur un compte bloqué en banque","de constituer une provision pour l'Urssaf"],c:1,r:["Constituer des réserves consiste à garder dans l'entreprise une partie du bénéfice au lieu de la distribuer.","Ces sommes renforcent les ressources propres de l'entreprise."]},
{q:"Dans une entreprise dépourvue de représentant du personnel, le salarié peut, lors de l'entretien préalable au licenciement, se faire assister par :",o:["un avocat du salarié","un inspecteur du travail","un conseiller du salarié figurant sur une liste préfectorale","un conseiller prud'homal"],c:2,r:["Quand l'entreprise n'a pas de représentant du personnel, le salarié convoqué peut être accompagné.","Il fait appel à un conseiller du salarié inscrit sur une liste établie par le préfet."]},
{q:"L'application d'une convention collective étendue est obligatoire :",o:["uniquement pour les employeurs ayant signé la convention","uniquement pour les employeurs qui ont demandé l'extension","pour tous les employeurs exerçant les activités entrant dans son champ d'application","pour les employeurs de la branche ayant plus de 10 salariés"],c:2,r:["Une convention étendue par arrêté s'impose à toute la branche.","Tout employeur exerçant l'activité concernée doit l'appliquer, même s'il ne l'a pas signée."]},
{q:"Selon le règlement (CE) 561/2006, le repos journalier réduit doit comporter une période au moins égale à :",o:["3 heures consécutives","12 heures consécutives","9 heures consécutives","11 heures consécutives"],c:2,r:["Repos réduit : 9 h minimum, autorisé 3 fois par semaine.","Repos fractionné : 3 h puis 9 h."]},
{q:"Les salariés sont informés de la convention collective applicable par une mention :",o:["déposée en mairie","fichée au conseil de prud'hommes","figurant sur le bulletin de paie","affichée au tribunal de commerce"],c:2,r:["Le salarié doit connaître la convention collective qui lui est applicable.","Cette information figure sur son bulletin de paie."]},
{q:"L'assiette de l'indemnité de congés payés exclut :",o:["les remboursements de frais","les majorations pour heures supplémentaires","les primes d'ancienneté","la prime d'entretien"],c:0,r:["L'indemnité de congés payés se calcule sur les éléments de salaire.","Les remboursements de frais, qui couvrent une dépense et non un travail, en sont exclus."]},
{q:"L'inspection du travail a un droit d'entrée dans les établissements soumis à son contrôle :",o:["uniquement de jour et durant les heures de travail","de jour comme de nuit","tous les jours de la semaine sauf le dimanche","tous les jours de l'année sauf le 1er mai"],c:1,r:["L'inspecteur du travail peut entrer dans les entreprises contrôlées à tout moment.","Il vient de jour comme de nuit, notamment pour vérifier le travail de nuit."]},
{q:"La 44e heure de travail hebdomadaire d'un conducteur longue distance est majorée de :",o:["25 %","33 %","50 %","75 %"],c:2,r:["Les heures de la 36e à la 43e sont majorées de 25 % : ce sont les heures d'équivalence.","À partir de la 44e, ce sont des heures supplémentaires, majorées à 50 %."]},
{q:"Un conducteur salarié peut exiger la remise de ses disques ou données téléchargées correspondant au plus aux périodes de travail :",o:["de la semaine précédente","du mois précédent","de l'année précédente","des cinq années précédentes"],c:2,r:["Le conducteur peut réclamer une copie de ses données de conduite.","L'employeur doit pouvoir les fournir au moins pour l'année écoulée, durée pendant laquelle il les conserve."]},
{q:"Le repos hebdomadaire réduit (règlement 561/2006) est au minimum de :",o:["42 heures","36 heures","28 heures","24 heures"],c:3,r:["Le repos hebdomadaire normal est de 45 heures.","Il peut être réduit à 24 heures consécutives au minimum, à condition de compenser ensuite les heures manquantes."]},
{q:"Les heures supplémentaires :",o:["sont rémunérées à 50 % à partir de 42 h","sont rémunérées à 100 % à partir de 50 h","ne sont pas prises en compte dans le calcul des congés payés","non rémunérées, sont considérées par les tribunaux comme du travail dissimulé"],c:3,r:["Faire travailler sans payer les heures réellement effectuées revient à cacher du travail.","Les tribunaux qualifient cette pratique de travail dissimulé."]},
{q:"Aux termes de l'accord étendu du 14 novembre 2001, la période considérée en travail de nuit s'étend de :",o:["20 heures à 5 heures","20 heures à 6 heures","21 heures à 5 heures","21 heures à 6 heures"],c:3,r:["À distinguer de la période de conduite de nuit (0 h à 5 h), qui limite le temps de travail à 10 h."]},
{q:"L'ouverture du droit à congés payés est effective dès que le salarié a travaillé chez le même employeur :",o:["6 mois de travail effectif","1 mois de travail effectif","2 semaines de travail effectif","dès le 1er jour de travail"],c:3,r:["Le droit à congés s'ouvre dès le premier jour de travail."]},
{q:"Un transporteur non inscrit au registre des commissionnaires peut recourir à la sous-traitance en cas de surcharge temporaire sans dépasser une limite du CA transport de :",o:["10 %","15 %","20 %","25 %"],c:1,r:["Une entreprise non inscrite au registre des commissionnaires ne peut sous-traiter qu'occasionnellement.","La loi plafonne cette sous-traitance à 15 % de son chiffre d'affaires transport."]},
{q:"Pour être exonéré de sa responsabilité, le transporteur :",o:["doit justifier du vice propre de la marchandise dans tous les cas","doit faire procéder obligatoirement à une expertise judiciaire","peut refuser que le destinataire prenne des réserves","a intérêt à prendre des réserves écrites et contradictoires à la prise en charge de la marchandise"],c:3,r:["La marchandise est présumée remise en bon état si le transporteur ne signale rien.","Pour se protéger, il a intérêt à émettre des réserves écrites et contradictoires dès la prise en charge."]},
{q:"En matière de délai de paiement, le fait de convenir d'un délai supérieur à 30 jours entraîne :",o:["une sanction administrative","une contravention","aucune pénalité","une amende de 1 500 €"],c:0,r:["Une sanction administrative peut être une amende.","Elle peut atteindre 75 000 € pour une personne physique et 2 000 000 € pour une personne morale."]},
{q:"Le prix d'un transport public routier de marchandises :",o:["est fixe et ne peut être modifié pendant l'exécution du contrat","peut être modifié pour l'une ou l'autre des parties en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges salariales"],c:2,r:["La loi prévoit une révision automatique du prix selon le coût du carburant.","Le prix change de plein droit, sans avoir à renégocier le contrat."]},
{q:"Vous acceptez un transport de 24 t de conserves Marseille-Toulon sans être inscrit au registre des transporteurs publics. L'infraction peut se traduire par :",o:["une contravention de 4e classe","une contravention de 5e classe","une immobilisation du véhicule","une peine d'emprisonnement d'un an et une amende de 15 000 € au maximum"],c:3,r:["Transporter pour autrui sans être inscrit au registre est un délit.","La sanction peut aller jusqu'à un an de prison et 15 000 euros d'amende."]},
{q:"Une coopérative confie votre chargement à un transporteur présent car vous vous présentez à l'heure prévue. La coopérative :",o:["est dans son droit, elle ne vous doit rien","est dans son tort mais doit vous verser une indemnité ne pouvant excéder le prix du transport","est dans son tort mais doit vous verser une indemnité forfaitaire égale au tiers du prix","doit vous procurer un autre transport et payer l'immobilisation du véhicule"],c:1,r:["Le client qui confie votre chargement à un confrère arrivé plus tôt est en tort.","Il doit attendre 2 h avant de chercher un autre transporteur."]},
{q:"L'attestation de conducteur ressortissant d'un pays tiers à l'EEE est exigée :",o:["pour une copie conforme de licence communautaire et un transport intérieur","pour une copie conforme de licence communautaire et un transport international","pour un FIT et un transport international","pour une copie conforme de licence de transport intérieur et un transport intérieur"],c:1,r:["L'attestation de conducteur concerne les chauffeurs venant d'un pays hors Espace économique européen.","Elle n'est exigée qu'en transport international, sous licence communautaire."]},
{q:"Vous vous présentez à 6 h à quai ; la fin du déchargement et la remise des documents a lieu à 17 h. Vous pouvez prétendre à des frais d'immobilisation :",o:["non, car le véhicule a été déchargé avant 18 h","non, il s'agit d'un cas de force majeure pour le destinataire","à compter de 8 heures du matin","à compter de 14 heures"],c:2,r:["La durée totale de mise à disposition incluse dans le transport est de 2 heures au chargement et 2 heures au déchargement."]},
{q:"La lettre de voiture doit être signée :",o:["par l'expéditeur au moment de la conclusion du contrat","par le destinataire uniquement au lieu de déchargement","par le remettant au lieu de chargement et par le destinataire au lieu de déchargement","par le remettant uniquement au lieu de chargement"],c:2,r:["Le document de suivi accompagne la marchandise du départ à l'arrivée.","Il est signé par le remettant au chargement, puis par le destinataire au déchargement."]},
{q:"Selon le code de commerce, sont garants du paiement du prix du transport au transporteur :",o:["le donneur d'ordre et le sous-traitant","l'expéditeur et le destinataire","le transporteur principal et le sous-traitant","le voiturier et le destinataire"],c:1,r:["La loi rend l'expéditeur et le destinataire garants du paiement du transport.","Le transporteur impayé peut donc réclamer son dû à l'un ou à l'autre."]},
{q:"En transport national, le contrat type applicable à un envoi de 1 500 litres d'eau minérale en bouteille est :",o:["le transport en citerne","une Convention de marchandises par route (CMR)","dit « général »","aucun, il n'y a pas de contrat type applicable"],c:2,r:["Le contrat type « transport en citerne » ne s'applique que si le liquide est transporté en citerne, et non préemballé en bouteilles."]},

const POINTS=2;
const list=document.getElementById('list');
const doneEl=document.getElementById('done'), ptsEl=document.getElementById('pts'), maxEl=document.getElementById('max'), totEl=document.getElementById('tot');
const answered={}; let good=0;
const LET=['a','b','c','d'];
totEl.textContent=Q.length; maxEl.textContent=Q.length*POINTS;
document.getElementById('fmax').textContent=Q.length*POINTS; document.getElementById('fn').textContent=Q.length;

function updateBar(){
  const n=Object.keys(answered).length;
  doneEl.textContent=n; ptsEl.textContent=good*POINTS;
  const res=document.getElementById('result');
  if(n===Q.length){
    document.getElementById('fpts').textContent=good*POINTS;
    document.getElementById('fgood').textContent=good;
    const pct=Math.round(good/Q.length*100);
    document.getElementById('fpct').textContent=pct;
    let msg;
    if(pct>=80) msg="Excellent — tu es prêt.";
    else if(pct>=60) msg="Bien — quelques points à consolider.";
    else if(pct>=40) msg="À retravailler avant l'examen.";
    else msg="Reprends les explications, question par question.";
    document.getElementById('fmsg').textContent=msg;
    res.classList.add('show');
    res.scrollIntoView({behavior:'smooth',block:'center'});
  } else res.classList.remove('show');
}

function render(){
  list.innerHTML='';
  Q.forEach((q,i)=>{
    const card=document.createElement('div'); card.className='q';
    const num=document.createElement('p'); num.className='q-num'; num.textContent='Question '+(i+1); card.appendChild(num);
    const qt=document.createElement('p'); qt.className='q-text'; qt.textContent=q.q; card.appendChild(qt);
    const opts=document.createElement('div'); opts.className='opts';
    q.o.forEach((txt,j)=>{
      const btn=document.createElement('button'); btn.className='opt';
      const let_=document.createElement('span'); let_.className='let'; let_.textContent=LET[j];
      const sp=document.createElement('span'); sp.textContent=txt;
      btn.appendChild(let_); btn.appendChild(sp);
      const done=answered[i];
      if(done!==undefined){
        btn.disabled=true;
        if(j===q.c) btn.classList.add('ok');
        else if(j===done) btn.classList.add('no');
      } else {
        btn.onclick=()=>{ answered[i]=j; if(j===q.c) good++; render(); updateBar(); };
      }
      opts.appendChild(btn);
    });
    card.appendChild(opts);
    if(q.r && q.r.length){
      const rule=document.createElement('div'); rule.className='rule';
      const tag=document.createElement('span'); tag.className='tag'; tag.textContent='Explication'; rule.appendChild(tag);
      q.r.forEach(line=>{ const p=document.createElement('p'); p.textContent=line; rule.appendChild(p); });
      if(answered[i]!==undefined) rule.classList.add('show');
      card.appendChild(rule);
    }
    list.appendChild(card);
  });
}
document.getElementById('reset').onclick=()=>{
  for(const k in answered) delete answered[k]; good=0;
  render(); updateBar(); window.scrollTo({top:0,behavior:'smooth'});
};
render(); updateBar();
</script>
