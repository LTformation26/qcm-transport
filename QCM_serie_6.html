<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM Série 6</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Le protêt est :","o":["une opération comptable qui permet de provisionner en vue du non-paiement d'une lettre de change","un acte dressé par un commissaire de justice qui constate le retard apporté dans l'exécution d'un contrat","un acte dressé par un commissaire de justice à la demande du porteur d'un effet de commerce en cas de défaut de paiement de la part du tiré","une proposition amiable de règlement d'un litige intervenu dans l'exécution d'un contrat"],"c":2,"r":["Le protêt (faute de paiement ou faute d'acceptation) est un acte authentique dressé par un commissaire de justice (ex-huissier) attestant du refus de paiement d'une lettre de change ou d'un billet à ordre."]},{"q":"Toute personne physique ou morale exerçant une activité commerciale sur le territoire français est immatriculée au registre du commerce et des sociétés (RCS), dont les registres sont tenus par :","o":["les chambres de commerce et d'industrie (CCI)","les directions régionales de l'environnement, de l'aménagement et du logement (DREAL) ou la DRIEAT","l'institut national de la propriété industrielle (INPI)","les greffiers des tribunaux de commerce ou des tribunaux judiciaires statuant commercialement"],"c":3},{"q":"Le conseil de surveillance est un conseil chargé de surveiller la gestion :","o":["du conseil d'administration d'une société anonyme","du PDG (président-directeur général) d'une société anonyme","du PDG et du directeur général adjoint d'une société anonyme","du directoire d'une société anonyme"],"c":3},{"q":"Dans le cadre d'une société commerciale, une clause léonine :","o":["est reconnue valable par le tribunal","accorde des avantages excessifs à l'une des parties","est résiliable à tout moment","est couverte par la prescription"],"c":1,"r":["« La part du lion ». Le droit de la consommation qualifie les clauses léonines de clauses abusives."]},{"q":"Possède la personnalité morale :","o":["la société en participation","la société de fait","l'entreprise individuelle","la société par actions simplifiée"],"c":3},{"q":"Un client paie son fournisseur par chèque. La dette est éteinte :","o":["dès l'établissement du chèque","lors de l'encaissement du chèque","dès la remise au bénéficiaire du chèque","dès la transmission du chèque à la banque"],"c":1},{"q":"On ne peut pas faire appel d'une décision de justice rendue par :","o":["le conseil de prud'hommes","la cour de cassation","le tribunal administratif","le tribunal de commerce"],"c":1,"r":["La Cour de cassation rend des arrêts de rejet ou de cassation : elle ne rejuge pas l'affaire au second degré."]},{"q":"Les membres d'un Groupement d'intérêt économique (GIE) :","o":["ne sont responsables des dettes sociales qu'à concurrence de leurs apports en capital","ne sont pas responsables des dettes sociales lorsque le GIE est constitué sans capital","sont responsables des dettes sociales en proportion de leur activité avec le GIE, que le GIE soit constitué avec ou sans capital","ont une responsabilité solidaire et indéfinie pour les dettes du GIE"],"c":3},{"q":"En transport national, un destinataire constate, le jour de la livraison, des avaries sur la marchandise. Dans les 3 jours, il prend des réserves. La durée de la prescription de son action est de :","o":["6 mois","1 an","2 ans","3 ans"],"c":1,"r":["Prescription d'un an pour l'action en avarie ou perte en transport national (art. L133-6 du Code de commerce)."]},{"q":"Suite à une faute de conduite involontaire, un conducteur salarié d'une entreprise de transport endommage le quai d'un destinataire avec son véhicule. La responsabilité civile de ce dommage incombe :","o":["au conducteur salarié","au destinataire","à l'employeur du conducteur","à l'expéditeur"],"c":2,"r":["L'employeur répond civilement des dommages causés aux tiers par son salarié dans l'exercice de ses fonctions."]},{"q":"Un contrat écrit de transport routier :","o":["doit respecter les principes posés par le contrat type","peut comporter des clauses dérogatoires au contrat type","est nul de droit s'il comporte des clauses contraires au contrat type","est valable pour les seules clauses qui ne sont pas contraires au contrat type"],"c":1,"r":["Les contrats types ont une valeur supplétive : ils ne s'appliquent automatiquement qu'en l'absence de contrat écrit."]},{"q":"Dans une société commerciale, le montant des dividendes distribués aux associés (ou actionnaires) est fixé par :","o":["l'assemblée générale des associés (ou actionnaires)","les dirigeants de la société","le commissaire aux comptes","le président du tribunal de commerce"],"c":0,"r":["La décision d'affectation du résultat et de distribution des dividendes relève de la compétence exclusive de l'assemblée générale ordinaire (AGO)."]},{"q":"La Cotisation Foncière des Entreprises (CFE), composante principale de la fiscalité locale payée par une entreprise de transport, est calculée sur la base de :","o":["l'ensemble des salaires versés aux conducteurs","la valeur locative des biens immobiliers utilisés par l'entreprise","l'ensemble des cotisations de formation professionnelle","la valeur d'achat des camions et tracteurs routiers"],"c":1,"r":["La CFE ne prend en compte que les biens immobiliers rattachés à l'entreprise (valeur locative cadastrale des bureaux, dépôts, parkings)."]},{"q":"Le jeudi 23 décembre, un transporteur livre à M. Martin 6 cartons de 6 bouteilles de champagne. Lors de la livraison, M. Martin appose des réserves pour 3 bouteilles cassées. M. Martin devra notifier des réserves au transporteur au plus tard le :","o":["lundi 27 décembre à 24 h","mardi 28 décembre à 24 h","mercredi 29 décembre à 24 h","jeudi 30 décembre à 24 h"],"c":1,"r":["Vendredi 24 décembre : jour 1.","Samedi 25 décembre (Noël, férié) : exclu.","Dimanche 26 décembre : exclu.","Lundi 27 décembre : jour 2.","Mardi 28 décembre : jour 3 → le délai expire le mardi 28 décembre à 24 h."]},{"q":"La loi du 1er février 1995 précise que les prestations annexes au contrat de transport routier de marchandises pour compte d'autrui sont les prestations autres que :","o":["celles effectivement accomplies par le transporteur et ses préposés","la mise à disposition du véhicule et de son équipage pour les opérations de chargement et de déchargement","la conduite du véhicule, la préparation de celui-ci aux opérations de chargement et de déchargement et la mise en œuvre des matériels spécialisés attachés au véhicule","celles qui ont été adoptées par les cocontractants"],"c":2,"r":["Les prestations annexes sont d'autres opérations : manutention complémentaire, emballage, stockage, encaissement, etc."]},{"q":"L'article L.132-8 du code de commerce spécifie notamment que la lettre de voiture forme un contrat entre l'expéditeur et :","o":["le donneur d'ordre et le commissionnaire de transport","le destinataire et le donneur d'ordre","le voiturier, le destinataire et le commissionnaire","le voiturier et le transitaire"],"c":2,"r":["OU entre l'expéditeur, le destinataire, le commissionnaire et le voiturier."]},{"q":"Les contrats types prévus par la loi d'orientation des transports intérieurs s'appliquent :","o":["de plein droit, même en cas de convention écrite entre les parties au contrat sur les matières mentionnées dans cette loi","de plein droit, à défaut de convention écrite entre les parties au contrat sur les matières mentionnées dans cette loi","de manière facultative, à défaut de convention écrite entre les parties au contrat sur les matières mentionnées dans cette loi","de manière facultative, en cas de convention écrite entre les parties au contrat ne portant pas sur les matières mentionnées dans cette loi"],"c":1},{"q":"Vous effectuez un transport de marchandises générales au départ de Toulouse pour Lyon avec un véhicule de poids total autorisé en charge (PTAC) supérieur à 6 tonnes et une charge utile supérieure à 3,5 tonnes. Lors d'un contrôle, vous devez présenter comme titre administratif :","o":["une copie conforme de la licence intérieure","une copie conforme de la licence communautaire","une lettre de voiture nationale","un extrait de votre Kbis"],"c":1,"r":["La licence communautaire est obligatoire pour tout transport public avec un véhicule dont le PTAC dépasse 3,5 tonnes."]},{"q":"Par définition, un train routier est un ensemble constitué :","o":["d'un véhicule à moteur auquel est attelée obligatoirement une remorque","d'un véhicule à moteur auquel est attelée obligatoirement une semi-remorque","d'un tracteur routier et d'une semi-remorque","d'un véhicule à moteur auquel est attelée une remorque ou une semi-remorque dont l'avant repose sur un avant-train"],"c":3},{"q":"Un tracteur de 38 t de poids total roulant autorisé et de 7 t de poids à vide tracte une semi-remorque de 34 t de poids total autorisé en charge et de 6 t de poids à vide. Son poids maximum autorisé est de :","o":["38 t","41 t","39 t","40 t"],"c":0,"r":["Le poids maximum autorisé de l'ensemble est plafonné par le PTRA du tracteur, soit 38 t."]},{"q":"Un véhicule isolé dont le PTAC (poids total autorisé en charge) ou le PTRA (poids total roulant autorisé) est supérieur à 3,5 t et inférieur ou égal à 12 t est limité à :","o":["130 km/h sur autoroute, 90 km/h sur route prioritaire, 100 km/h sur route à deux chaussées séparées par un terre-plein central","130 km/h sur autoroute, 80 km/h sur route prioritaire, 100 km/h sur route à deux chaussées séparées par un terre-plein central","110 km/h sur autoroute, 90 km/h sur route prioritaire, 100 km/h sur route à deux chaussées séparées par un terre-plein central","110 km/h sur autoroute, 80 km/h sur route prioritaire, 100 km/h sur route à deux chaussées séparées par un terre-plein central"],"c":3},{"q":"Hors agglomération, la distance minimale à respecter entre 2 véhicules poids lourds roulant à la même vitesse est de :","o":["30 mètres","50 mètres","60 mètres","100 mètres"],"c":1},{"q":"Sauf dérogation, les restrictions de circulation applicables en fin de semaine ou à l'occasion de jours fériés concernent les véhicules dont le poids total autorisé en charge (PTAC) excède :","o":["3,5 t","6 t","7,5 t","10 t"],"c":2,"r":["En France, l'interdiction générale de circulation du week-end (du samedi 22 h au dimanche 22 h) vise les véhicules de plus de 7,5 t de PTAC."]},{"q":"Dans le cas d'un transport international sans rupture de charge, comprenant un parcours maritime, la convention marchandises par route (CMR) s'applique en général :","o":["sur le parcours routier","sur la totalité du parcours","sur le parcours maritime","dans le pays de destination"],"c":1},{"q":"Avec un véhicule de 19 tonnes de poids maximum autorisé (PMA), un transporteur français doit effectuer un transport public de marchandises de Bruxelles (Belgique) à Tanger (Maroc). Le transport routier doit être couvert par :","o":["une autorisation de transit espagnole et une autorisation bilatérale marocaine","uniquement une autorisation bilatérale marocaine","une autorisation CEMT (Conférence européenne des ministres des transports)","une copie conforme de la licence communautaire et une autorisation bilatérale marocaine"],"c":3,"r":["Le parcours au sein de l'Union (Belgique, France, Espagne) est couvert par la licence communautaire.","L'entrée et le passage au Maroc nécessitent en plus une autorisation bilatérale."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
