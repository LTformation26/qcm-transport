<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta property="og:title" content="QCM Série 7">

<meta name="description" content="QCM Série 7 — Attestation de capacité de transport de marchandises +3,5 t">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM Série 7</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Les réserves correspondent :","o":["aux bénéfices réinvestis et sont obligatoirement disponibles sous forme de liquidités","aux bénéfices réinvestis, et ne sont pas obligatoirement disponibles sous forme de liquidités","aux dividendes versés aux associés ou aux actionnaires","à des opérations comptables effectuées dans le but de rééquilibrer l'actif et le passif du bilan"],"c":1,"r":["Les réserves sont des bénéfices non distribués réinvestis dans le patrimoine global de l'entreprise (camions, matériel, stocks) : elles ne sont donc pas gardées en liquidités sur le compte bancaire."]},{"q":"Un employeur peut embaucher un salarié dans le cadre d'un contrat à durée déterminée :","o":["pour remplacer un salarié gréviste","pour remplacer un salarié en arrêt de maladie","qui prolongera la période d'essai d'un contrat à durée indéterminée","pour remplacer un salarié embauché pour une durée indéterminée licencié à la suite d'une faute"],"c":1,"r":["Remplacer un salarié malade est l'un des motifs légaux de recours au CDD. Il est en revanche interdit d'y recourir pour remplacer un gréviste."]},{"q":"Pour le personnel roulant effectuant des transports de marchandises à l'aide d'un véhicule dont le poids maximum autorisé excède 3,5 t, la durée du travail est attestée et contrôlée au moyen du document de contrôle suivant :","o":["horaire de service","livret individuel de contrôle","feuille d'enregistrement ou carte conducteur de l'appareil de contrôle","contrat de travail"],"c":2,"r":["Le tachygraphe (disque papier ou carte conducteur à puce) est l'outil obligatoire de contrôle des temps de conduite et de travail."]},{"q":"Les équipements de protection individuelle tels que les chaussures de sécurité, les lunettes, les gants, doivent être fournis par :","o":["le salarié lui-même","l'employeur","les services de la Caisse d'assurance retraite et de santé au travail (Carsat)","la médecine du travail"],"c":1,"r":["L'article L4122-2 du Code du travail impose à l'employeur de fournir gratuitement tous les équipements de protection individuelle (EPI) nécessaires à la sécurité de ses salariés."]},{"q":"Le conseil de prud'hommes est constitué à parts égales :","o":["de représentants d'employés et de représentants d'ouvriers","de représentants d'employeurs et de représentants de salariés","de juges et de représentants d'employeurs","de juges et de représentants de salariés"],"c":1,"r":["Le conseil de prud'hommes est une juridiction paritaire, composée à égalité de juges non professionnels issus du collège employeurs et du collège salariés."]},{"q":"Un comité social et économique (CSE) doit être constitué à partir de :","o":["11 salariés durant 12 mois consécutifs","11 salariés durant 24 mois consécutifs","50 salariés durant 12 mois consécutifs","50 salariés durant 24 mois consécutifs"],"c":0},{"q":"Dans le cadre du décret n° 83-40 modifié, la durée maximale hebdomadaire de temps de service du personnel de conduite courte distance (hors messagerie et transport de fonds), conduisant des véhicules de plus de 3,5 t, est de :","o":["52 h sur une semaine isolée","48 h sur une semaine isolée","44 h en moyenne calculées sur une période de douze semaines","48 h en moyenne calculées sur douze semaines"],"c":0,"r":["650 h maximum par trimestre."]},{"q":"En cas de licenciement économique d'un conducteur, l'employeur doit observer un délai de réflexion minimum entre l'entretien préalable et la notification de la rupture du contrat. Ce délai minimal sera de :","o":["1 jour","4 jours","7 jours","15 jours"],"c":2},{"q":"Sur une semaine isolée, le temps de service d'un conducteur « grand routier » ne peut dépasser :","o":["55 h","60 h","48 h","56 h"],"c":3},{"q":"La déclaration préalable à l'embauche d'un salarié doit s'effectuer :","o":["pendant la période d'essai","au plus tôt dans les 8 jours avant l'embauche","un mois avant l'embauche","un mois après l'embauche"],"c":1,"r":["La déclaration préalable s'effectue auprès de l'URSSAF au plus tôt 8 jours avant la prise de poste, et au plus tard avant la prise effective de travail."]},{"q":"Au regard de sa durée et de sa périodicité, la formation continue obligatoire (FCO) des conducteurs routiers est de 35 h :","o":["tous les 6 mois","tous les 5 ans","par an","par mois, avec possibilité de regrouper sur 2 semaines par an"],"c":1,"r":["La FCO doit être renouvelée tous les 5 ans par une session de 35 heures."]},{"q":"Un salarié a 10 ans d'ancienneté. Au cours de la période de référence, il a cumulé 24 jours ouvrables d'absence pour maladie ordinaire. L'employeur :","o":["doit lui accorder la totalité de ses congés payés","peut lui retirer 2,5 jours de congés","ne lui accorde que 3 semaines de congés d'été","ne lui donne pas de congés et l'utilise pour pallier les congés des autres"],"c":0},{"q":"Suite aux pratiques de prix manifestement trop bas d'un transporteur X sous-traitant une partie de son activité, un transporteur Y a été évincé du marché. Le Code des transports permet :","o":["d'obliger le transporteur X à faire un avenant à son contrat pour rehausser ses prix","de prononcer judiciairement la nullité du contrat type de sous-traitance","au transporteur évincé de se porter partie civile suite à l'action pénale engagée par le ministère public","au transporteur évincé d'engager une action pénale contre le transporteur X"],"c":2,"r":["La pratique d'un prix de transport ne couvrant pas les coûts de revient (prix abusivement bas) est une infraction pénale. La victime évincée peut se constituer partie civile pour demander réparation du préjudice subi."]},{"q":"Le montant des garanties bancaires permettant aux entreprises de satisfaire à la condition de capacité financière exigible ne peut excéder :","o":["10 %","20 %","30 %","50 %"],"c":3,"r":["La capacité financière peut être démontrée par des capitaux propres ou, à défaut, garantie par un organisme financier ou bancaire, dans la limite maximale de 50 % du montant exigé."]},{"q":"Le prix d'un transport public routier de marchandises :","o":["est fixe et ne peut pas être modifié pendant l'exécution du contrat","peut être modifié par l'une ou l'autre des parties en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges de carburant","est modifié de plein droit en cas de variation des charges salariales"],"c":2,"r":["Selon le Code des transports (dispositif « pied de facture »), le prix du transport est répercuté de plein droit selon la variation du coût du gazole."]},{"q":"Les textes relatifs aux relations de sous-traitance et à l'interdiction des « prix abusivement bas » concernent :","o":["uniquement les professionnels du transport","les professionnels du transport et les chargeurs","tous les acteurs de la chaîne logistique","uniquement les commissionnaires de transport"],"c":2,"r":["Les règles sur les prix abusivement bas s'imposent à l'ensemble des donneurs d'ordres et intermédiaires de la chaîne de transport (expéditeurs, commissionnaires, sous-traitants, destinataires)."]},{"q":"Un transporteur arrive à l'heure convenue pour prendre en charge un envoi de 20 t ; en application du contrat type dit « général » relatif aux transports publics de marchandises, son véhicule devra normalement être chargé dans un délai de :","o":["1 h","1 h 30","2 h","3 h"],"c":0},{"q":"Le document de suivi :","o":["récapitule toutes les opérations prévues et non prévues effectuées par le conducteur pendant l'exécution du contrat","est destiné à suivre en temps réel le trajet de la marchandise en cas de sous-traitance multiple","est destiné à suivre le temps de conduite et d'autres travaux du conducteur","est destiné à suivre un envoi en cas de fractionnement d'un lot"],"c":0,"r":["Le document de suivi (lettre de voiture) trace l'exécution du contrat en récapitulant l'ensemble des opérations prévues et imprévues (horaires, attentes, réserves)."]},{"q":"Dans le cadre du contrat type sous-traitance dans le transport public routier de marchandises, une de ces dispositions suivantes n'est pas applicable aux sous-traitants : la souscription d'une assurance","o":["contre les risques afférents à la circulation automobile","contre les vols et incendie des matériels et engins tractés appartenant à l'opérateur de transport","pour les marchandises transportées (retard, pertes, avaries)","de responsabilité civile du chef d'entreprise"],"c":1,"r":["Le sous-traitant doit garantir sa propre responsabilité ; il n'a aucune obligation légale d'assurer les engins tractés de l'opérateur (donneur d'ordre)."]},{"q":"L'autorisation d'exercer la profession de transporteur routier permet à :","o":["une personne d'obtenir une attestation de capacité professionnelle","une entreprise de satisfaire à la condition de capacité professionnelle","une entreprise d'être inscrite au registre des entreprises de transport","un gestionnaire de transport d'exercer la profession de transporteur routier"],"c":2,"r":["L'autorisation d'exercer est la décision administrative qui permet à l'entreprise d'être inscrite au registre des transporteurs."]},{"q":"Pour satisfaire à l'exigence d'établissement, l'entreprise doit disposer :","o":["d'un établissement réceptionné par une chambre de commerce et d'industrie","de locaux référencés dans une nomenclature d'activité tenue par une chambre de commerce et d'industrie","de locaux référencés dans une nomenclature d'activité tenue par une chambre des métiers","d'un Code APE (Activité Principale Exercée)"],"c":3},{"q":"Constitue un délit, le fait de conduire un véhicule excédant 3,5 t :","o":["sans attestation de l'employeur","sans carte conducteur","au-delà de la durée de conduite journalière autorisée","en période d'interdiction de circuler"],"c":1,"r":["Conduire sans carte conducteur engagée dans le tachygraphe (ou après falsification) est un délit pénal."]},{"q":"Le titre administratif de transport délivré à une entreprise exploitant uniquement des véhicules motorisés de moins de 4 roues est :","o":["une licence communautaire","une CMR","une licence de transport intérieur","une lettre de voiture"],"c":2,"r":["Les entreprises utilisant des véhicules motorisés de moins de 4 roues (coursiers, triporteurs) relèvent du registre léger et reçoivent une licence de transport intérieur (LTI)."]},{"q":"Le poids maximum autorisé d'un ensemble de véhicules comportant 4 essieux ne doit pas excéder :","o":["32 t","35 t","38 t","40 t"],"c":2,"r":["Un ensemble de véhicules comportant 4 essieux est limité à un PTRA de 38 tonnes (40 t nécessitant 5 essieux)."]},{"q":"L'âge minimum standard pour passer le permis de conduire de la catégorie C (poids lourd) est fixé à :","o":["17 ans","18 ans","20 ans","21 ans"],"c":3,"r":["Âge abaissé à 18 ans pour les candidats titulaires d'une formation professionnelle initiale qualifiante de conducteur routier : CAP conducteur routier, Bac Pro transport, Titre pro."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
