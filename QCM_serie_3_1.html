<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Série 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM — 25 questions</h1>
<p class="lede">Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Endosser un effet de commerce, c'est :","o":["bénéficier d'un crédit garanti sur le montant de l'effet","désigner la banque qui paiera le montant de l'effet","se porter garant du paiement du montant de l'effet","transmettre le bénéfice de l'effet à une tierce personne"],"c":3,"r":["Endosser, c'est signer au dos du titre pour en transférer la propriété et le bénéfice à un tiers (l'endossataire)."]},{"q":"La faillite personnelle est :","o":["une condamnation pénale d'une personne physique","la mise en liquidation de l'entreprise personnelle","le dépôt de bilan de l'entreprise personnelle","l'impossibilité de rembourser les créanciers après liquidation"],"c":0,"r":["C'est une sanction personnelle qui interdit à la personne physique de diriger, gérer ou contrôler une entreprise.","Les autres réponses décrivent des procédures voisines (liquidation, dépôt de bilan)."]},{"q":"Le fonds de commerce peut servir de garantie à un prêt ; il y aura alors :","o":["hypothèque","récépissé-warrant","aval","nantissement"],"c":3,"r":["Le fonds de commerce est un bien meuble incorporel : la garantie prise sur lui s'appelle un nantissement.","L'hypothèque, elle, concerne les immeubles."]},{"q":"Le contrat d'assurance est un contrat :","o":["aléatoire","unilatéral","solennel","type"],"c":0,"r":["Il repose sur un événement incertain (le sinistre) : les prestations dépendent d'un événement futur et incertain."]},{"q":"La lettre de change est un acte :","o":["de commerce ou un acte civil, selon la nature de la dette","de commerce si elle est signée par un commerçant, ou civil si elle est signée par un non-commerçant","de commerce en toutes circonstances","civil, en toutes circonstances"],"c":2,"r":["La lettre de change est un acte de commerce par la forme (art. L110-1 du Code de commerce),","quelle que soit la qualité du signataire ou la nature de la dette."]},{"q":"L'injonction de payer est :","o":["un effet de commerce","une ordonnance du président du tribunal de commerce, ou du tribunal d'instance","une lettre recommandée du créancier exigeant le paiement immédiat","une sommation signifiée par voie d'huissier"],"c":1,"r":["C'est une procédure judiciaire simplifiée : le juge rend une ordonnance enjoignant au débiteur de payer sa dette."]},{"q":"Le transporteur public routier de marchandises est tenu contractuellement à une obligation de :","o":["résultat","moyen","diligence","sécurité"],"c":0,"r":["Il s'engage à acheminer la marchandise à destination, en bon état et dans les délais convenus : c'est une obligation de résultat."]},{"q":"Sur un document matérialisant un contrat de transport intérieur, une déclaration de valeur permet :","o":["d'assurer le donneur d'ordre pour la marchandise, indépendamment de l'assurance responsabilité du transporteur","d'élever la limitation de responsabilité du transporteur au montant de la valeur déclarée en cas de perte ou d'avarie","d'élever la limitation de responsabilité du transporteur au montant de la valeur déclarée en cas de retard à la livraison","de constituer l'indemnité forfaitaire que l'assureur du transporteur versera en cas de perte ou d'avarie"],"c":1,"r":["La déclaration de valeur substitue le montant déclaré aux plafonds légaux d'indemnisation, en cas de perte ou d'avarie."]},{"q":"La demande d'ouverture de la procédure de redressement judiciaire est de la compétence :","o":["exclusivement du chef d'entreprise","du chef d'entreprise, des créanciers ou du ministère public","exclusivement du président du tribunal de commerce et des créanciers","indifféremment du chef d'entreprise, des créanciers, des salariés, du président du tribunal de commerce, du procureur de la République"],"c":1,"r":["Elle peut être demandée par le chef d'entreprise, les créanciers ou le ministère public."]},{"q":"Dans une société en nom collectif (SNC), les associés :","o":["n'engagent que leurs apports","n'engagent que l'actif de la société","engagent solidairement et indéfiniment l'ensemble de leurs biens","s'engagent à assumer les dettes proportionnellement à leurs apports"],"c":2,"r":["Dans une SNC, la responsabilité est indéfinie (sur le patrimoine personnel) et solidaire :","un créancier peut réclamer la totalité de la dette à un seul associé."]},{"q":"Dans le cadre d'une créance liée à un contrat de transport, l'injonction de payer doit toujours être faite devant le tribunal du domicile du :","o":["débiteur ou de l'un des débiteurs s'ils sont plusieurs","requérant","destinataire","transporteur obligatoirement"],"c":0,"r":["Pour une injonction de payer, c'est toujours le tribunal de la ville du client qui ne paye pas qui est compétent."]},{"q":"Le droit de rétention est un privilège pour le transporteur qui :","o":["ne peut s'exercer que sur les marchandises en sa possession, et pour les seules créances afférentes au prix de transport de ces marchandises","peut s'exercer sur les marchandises en sa possession même pour des créances antérieures, si elles concernent le même client et des factures de transport","lui permet de vendre les marchandises en paiement des créances précédemment dues","lui permet de récupérer les marchandises livrées si sa créance n'est pas honorée et si elle est en port dû"],"c":1},{"q":"Dans une SARL, l'approbation des comptes annuels est effectuée par :","o":["l'assemblée générale ordinaire","l'assemblée générale extraordinaire","le commissaire aux comptes","l'expert-comptable"],"c":0,"r":["L'approbation des comptes et l'affectation du résultat relèvent de l'AGO, qui doit se réunir dans les 6 mois suivant la clôture de l'exercice."]},{"q":"L'amortissement d'un bien correspond :","o":["au montant des annuités de l'emprunt ayant permis de l'acquérir","à sa perte de valeur sous l'effet du temps et de son utilisation","à la rémunération minimale attendue de cet investissement","à un décaissement de trésorerie sur plusieurs exercices"],"c":1,"r":["L'amortissement constate la dépréciation irréversible d'un actif immobilisé (usure, temps, obsolescence)."]},{"q":"Le fonds de roulement permanent se calcule de la manière suivante :","o":["capitaux propres − actif immobilisé","(capitaux propres + dettes à plus d'un an) − actif immobilisé","dettes à long et moyen terme − actif immobilisé","dettes à court terme − actif immobilisé"],"c":1,"r":["Le fonds de roulement mesure l'excédent des ressources stables (capitaux permanents = capitaux propres + dettes à plus d'un an) sur l'actif immobilisé."]},{"q":"Bilan de clôture d'une SARL : capital social 7 500 €, réserves légales 750 €, autres réserves 13 000 €, résultat de l'exercice (perte) −5 500 €. Pour cet exercice, l'assemblée générale des associés :","o":["doit statuer sur la dissolution de la société","doit reconstituer les capitaux propres à concurrence d'au moins la moitié du capital social","peut imputer la perte en diminuant le poste « autres réserves » du montant de la perte","peut décider une distribution de dividendes"],"c":2,"r":["Capitaux propres après perte : 7 500 + 750 + 13 000 − 5 500 = 15 750 €.","C'est bien au-dessus de la moitié du capital (3 750 €) : pas de dissolution à envisager.","L'AG peut imputer la perte sur les « autres réserves », qui passent de 13 000 € à 7 500 €."]},{"q":"Parmi ses attributions, le CSE :","o":["présente les réclamations collectives","donne son avis sur l'ordre des départs en congés","donne son avis sur les mesures facilitant le maintien au travail des accidentés du travail","donne son avis en matière de licenciement d'un représentant du personnel"],"c":3},{"q":"Un contrat à durée déterminée peut être renouvelé :","o":["une fois, sans que la durée du contrat puisse dépasser 12 mois au total","une fois, sans que la durée du contrat puisse dépasser 18 mois au total","deux fois, sans que la durée du contrat puisse dépasser 12 mois au total","deux fois, sans que la durée du contrat puisse dépasser 18 mois au total"],"c":3,"r":["Un CDD peut être renouvelé deux fois, dans la limite de 18 mois au total, renouvellements inclus."]},{"q":"Au regard de sa durée et de sa périodicité, la formation continue obligatoire de sécurité des conducteurs routiers est au moins de :","o":["1 jour tous les 6 mois","5 jours tous les 5 ans","1 semaine par an","1 jour par mois, regroupable sur 2 semaines par an"],"c":1},{"q":"Selon le règlement CEE n° 3820/85 relatif aux temps de conduite et de repos, la durée totale de conduite par période de deux semaines est de :","o":["90 h","92 h","60 h","11 h"],"c":0},{"q":"Parmi les affichages suivants, quel est celui qui n'est pas obligatoire dans une entreprise de transport :","o":["adresse du médecin du travail","nom et adresse de l'inspecteur du travail","numéro de téléphone des services de secours d'urgence","adresse et numéro de téléphone de l'URSSAF"],"c":3,"r":["Le Code du travail impose d'afficher uniquement les informations liées à la santé, la sécurité et les droits des salariés."]},{"q":"Un salarié n'a pris que 15 jours de congés payés entre le 1er mai et le 31 octobre. Il lui restera à prendre après cette date :","o":["15 jours","17 jours","18 jours","19 jours"],"c":1,"r":["Les jours de fractionnement sont des jours de congé supplémentaires, accordés quand le salarié ne prend pas tout son congé principal pendant la période légale (1er mai – 31 octobre).","1 jour de plus s'il pose 3 à 5 jours hors période ; 2 jours de plus s'il en pose au moins 6.","Ici : 15 jours restants + 2 jours de fractionnement = 17 jours."]},{"q":"Un conducteur de 5 ans d'ancienneté ne travaille pas le jeudi 25.12, mais est présent (autres travaux) le mercredi 24 et le vendredi 26. Le jour de Noël :","o":["ne sera payé que s'il a effectué au minimum 200 h dans les 2 mois précédents","sera obligatoirement payé double","sera obligatoirement payé","ne sera payé double que s'il a effectué au minimum 200 h les 2 mois précédents"],"c":2,"r":["Dans la CCNTR, un jour férié chômé est payé si le salarié a au moins 6 mois d'ancienneté et s'il est présent la veille et le lendemain."]},{"q":"Un contrat de travail à durée déterminée est requalifié en contrat à durée indéterminée lorsque :","o":["le contrat ne précise pas de période d'essai","le motif pour lequel il est conclu n'est pas indiqué","le contrat est rompu avant le terme","il est conclu pour remplacer un salarié absent"],"c":1,"r":["L'absence de mention du motif de recours dans un CDD entraîne sa requalification en CDI (art. L1242-12 du Code du travail)."]},{"q":"En double équipage, selon le règlement CEE n° 3820/85, le repos journalier par conducteur est au minimum de 9 h consécutives par période de :","o":["30 h, et peut être pris à l'hôtel ou en couchette, véhicule à l'arrêt","24 h en cas de repos en couchette, véhicule en marche","30 h, et peut être pris en couchette, véhicule en marche","24 h, et peut être pris à l'hôtel ou en couchette, véhicule à l'arrêt"],"c":0,"r":["En double équipage, la période d'analyse est portée à 30 heures (au lieu de 24 h en solo)."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Essai avec la main gauche";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
