<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Série 5</title>
<meta property="og:title" content="QCM Série 5">

<meta property="og:type" content="website">
<meta name="description" content="QCM Série 5 — Attestation de capacité de transport de marchandises +3,5 t">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM Série 5</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Suite à un contrôle, une infraction pour défaut de visite technique est relevée sur un véhicule appartenant à une entreprise de transport. La responsabilité pénale de cette infraction incombe :","o":["au salarié conducteur","au représentant légal de l'entreprise","au responsable de l'exploitation","au dirigeant de l'entreprise"],"c":1,"r":["Le representant legal est la personne (ou l'organe) qui peut engager l'entreprise face aux tiers devant la justeice"]},{"q":"Dans une société anonyme, le commissaire aux comptes est désigné par :","o":["le PDG (président-directeur général)","le président du conseil de surveillance, s'il y en a un","les actionnaires, par l'assemblée générale","les statuts, en cas d'appel public à l'épargne"],"c":2,"r":["Le commissaire aux comptes est désigné par l'assemblée générale ordinaire (AGO) des actionnaires."]},{"q":"La responsabilité solidaire et indéfinie signifie que :","o":["les associés seront poursuivis en proportion du capital qu'ils possèdent dans l'entreprise","seul l'associé qui a le plus de parts sociales dans la société sera poursuivi","le créancier peut choisir l'associé le plus solvable et lui réclamer l'intégralité de la dette","seuls les associés qui ont fait des apports en numéraire seront poursuivis"],"c":2,"r":["Indéfinie : les associés engagent tout leur patrimoine personnel pour les dettes de la société.","Solidaire : le créancier peut réclamer la totalité de la dette à un seul associé (souvent le plus solvable), à charge pour lui de se retourner ensuite contre les autres."]},{"q":"La durée du mandat du président d'une société par actions simplifiée (SAS) :","o":["est de 24 mois","est de 6 ans","est de 3 ou 6 ans","est librement définie par les statuts"],"c":3,"r":["La SAS offre une grande liberté statutaire : la loi impose un président mais ne fixe pas la durée de son mandat, laissée aux statuts."]},{"q":"Le comptable de votre entreprise de transports vous annonce que les créances clients sont de 600 000 € alors que votre chiffre d'affaires TTC est de 1 675 000 €. Vous en déduisez que :","o":["vos clients sont de bons payeurs","vos clients payent selon les délais légaux","vos clients participent à l'amélioration de votre fonds de roulement","une remise en cause des délais de paiement s'impose d'urgence"],"c":3,"r":["Délai moyen de paiement ≈ 600 000 / 1 675 000 × 365 ≈ 131 jours.","Très au-delà du plafond légal de 30 jours : un tel retard met gravement la trésorerie en danger."]},{"q":"Le mécanisme de la taxe sur la valeur ajoutée a une incidence sur :","o":["les résultats de l'entreprise","les prix de revient de l'entreprise","la trésorerie de l'entreprise","les produits d'exploitation de l'entreprise"],"c":2,"r":["Résultat et prix de revient s'expriment en hors taxes : la TVA ne les touche pas.","Elle pèse en revanche sur la trésorerie (décalage entre la TVA collectée et la TVA reversée à l'État)."]},{"q":"Lors des premières annuités, l'avantage de l'amortissement dégressif par rapport au linéaire est une diminution :","o":["des charges d'exploitation","du bénéfice imposable","des intérêts d'emprunt","des remboursements des capitaux empruntés"],"c":1,"r":["L'amortissement dégressif permet des dotations plus fortes les premières années.","Comme l'amortissement est une charge déductible, cela réduit le bénéfice imposable, donc l'impôt, au départ."]},{"q":"Un examen médical de reprise doit être organisé au bénéfice d'un salarié victime d'un accident du travail ayant occasionné un arrêt de travail d'au moins :","o":["8 jours","15 jours","21 jours","30 jours"],"c":3},{"q":"Une convention collective est un accord conclu entre :","o":["les employeurs, après consultation de l'inspection du travail","le ministère du travail et les syndicats","les représentants du personnel et les délégués syndicaux","les organisations syndicales d'employeurs et de salariés, représentées au niveau des branches professionnelles"],"c":3,"r":["Une convention collective est négociée et signée par une ou plusieurs organisations syndicales de salariés représentatives et un ou plusieurs groupements d'employeurs, au niveau de la branche."]},{"q":"Lors d'un contrôle routier, le conducteur d'un véhicule soumis au tachygraphe doit être en mesure de présenter aux forces de l'ordre les données d'enregistrement de la journée en cours ainsi que celles des :","o":["7 jours précédents","15 jours précédents","28 jours précédents","56 jours précédents"],"c":3,"r":["Depuis fin 2024, le conducteur doit présenter les données du jour en cours et des 56 jours précédents (contre 28 auparavant)."]},{"q":"La durée maximale de la période d'essai non renouvelable d'un conducteur routier embauché sous contrat de travail à durée indéterminée est de :","o":["une semaine","quinze jours","un mois","deux mois"],"c":3,"r":["La CCNTR prévoit un mois, mais la durée légale maximale de la période d'essai (ouvrier ou employé en CDI) est de deux mois, non-renouvellement compris."]},{"q":"Selon le règlement CEE n° 3820/85, lorsque le repos journalier est fractionné, sa durée totale ne doit pas être inférieure à :","o":["11 heures","11 heures 30 minutes","12 heures","12 heures 30 minutes"],"c":2,"r":["Le repos journalier fractionné se prend en deux tranches : 3 h puis 9 h minimum (dans cet ordre).","Sa durée totale passe alors à 12 h, au lieu de 11 h."]},{"q":"L'absence de contrat écrit pour un contrat à durée déterminée peut entraîner :","o":["une amende de 3 750 € (CDD ou intérim)","une amende de 7 500 € en cas de récidive","la requalification en CDI à temps plein","l'obligation de verser des indemnités au salarié"],"c":[0,1,2,3],"r":["Les quatre propositions sont exactes : amende de 3 750 € (7 500 € en récidive), requalification en CDI à temps plein et versement d'indemnités au salarié."]},{"q":"Les accords collectifs d'entreprise sont négociés entre :","o":["l'inspecteur du travail et l'employeur","l'employeur et les organisations syndicales de salariés représentatives dans l'entreprise","l'employeur et chacun des salariés pris individuellement","l'employeur et les délégués du personnel"],"c":1},{"q":"Le repos compensateur pour un conducteur doit être pris :","o":["entre le 1er juillet et le 31 août","accolé au congé annuel payé","dans un délai de 4 mois suivant l'ouverture du droit","avant le 31 décembre de chaque année"],"c":2,"r":["Le repos compensateur se prend en principe dans les 3 mois, porté à 4 mois si le temps de service est décompté sur 4 mois, voire 6 mois par accord collectif."]},{"q":"Dans le cadre du code du travail, pour le personnel sédentaire, les heures supplémentaires se décomptent :","o":["par journée","par semaine civile","par mois","par année"],"c":1,"r":["Pour le personnel sédentaire, les heures supplémentaires se comptent par semaine civile (du lundi 0 h au dimanche 24 h)."]},{"q":"Dans le cadre du décret n° 83-40 modifié au 31 mars 2005, pour le personnel roulant, la limite maximale journalière de temps de service est de :","o":["12 heures","11 heures","10 heures","9 heures"],"c":0},{"q":"Pour un conducteur grand routier, l'amplitude de travail correspond :","o":["à l'intervalle existant entre 2 repos hebdomadaires","au repos + temps libres entre 2 repos journaliers + temps de conduite + temps de travail","à l'intervalle de temps compris entre 2 repos journaliers successifs, ou entre un repos hebdomadaire et le repos journalier immédiatement précédent ou suivant","au temps de mise à disposition + temps de conduite et de travaux + repas et temps libres sur une période de 12 h"],"c":2,"r":["L'amplitude est l'intervalle entre deux repos journaliers successifs (ou entre un repos hebdomadaire et le repos journalier voisin).","Elle est de 13 h, portée à 15 h en cas de repos journalier réduit."]},{"q":"Un transport pour compte propre effectué à l'aide d'un véhicule de 3 t de poids maximum autorisé, pris en location avec conducteur, est couvert par :","o":["une copie conforme de la licence de transport intérieur du transporteur et une feuille de location","une copie conforme de la licence de transport intérieur du loueur et une feuille de location ou copie du contrat de location","une copie conforme de la licence de transport communautaire du transporteur et une feuille de location","une copie conforme de la licence communautaire de transport du loueur et une lettre de voiture"],"c":1},{"q":"Une entreprise effectue un transport public routier de marchandises sans être inscrite au registre des transporteurs. Le fait est constaté par procès-verbal lors d'un contrôle routier. La nature de l'infraction relevée est :","o":["une contravention de 4e classe","un délit","une contravention de 5e classe","soit une contravention, soit un délit, selon que l'entreprise est inscrite ou non au registre du commerce et des sociétés"],"c":1,"r":["Exercer sans être inscrit au registre des transporteurs est un délit : jusqu'à un an d'emprisonnement et 15 000 € d'amende, avec immobilisation ou confiscation possible du véhicule."]},{"q":"La commission régionale des sanctions administratives a proposé au préfet de région de retirer un titre administratif de transport à une entreprise. Quelle peut en être la raison ?","o":["l'entreprise présente de mauvais bilans","l'entreprise a commis des infractions à la réglementation du travail et de la sécurité","l'entreprise n'a pas rempli ses obligations en matière de cotisations sociales","un des conducteurs de l'entreprise a été verbalisé pour excès de vitesse en état d'ivresse"],"c":1,"r":["La CRSA, saisie par le préfet de région, intervient en cas de manquements graves ou répétés à la réglementation des transports, du travail ou de la sécurité : le préfet peut alors suspendre ou retirer les copies conformes de la licence."]},{"q":"La loi du 31 décembre 1992 sur la sous-traitance dans le domaine du transport routier de marchandises s'applique aux contrats conclus entre :","o":["un transporteur routier de marchandises et un loueur de véhicules sans conducteur","deux commissionnaires de transport","un industriel et un transporteur routier de marchandises","un transporteur routier de marchandises ou un commissionnaire de transport avec un autre transporteur routier de marchandises"],"c":3},{"q":"Selon le contrat type « général », en cas de perte ou d'avarie lors d'un transport intérieur pour un envoi inférieur à 3 tonnes, la responsabilité du transporteur est limitée à :","o":["23 € par kilogramme sans dépasser 750 € par colis","33 € par kilogramme de poids brut manquant ou avarié, avec un maximum de 1 000 € par colis","14 € par kilogramme sans dépasser 2 300 € par tonne","8,33 DTS (Droits de Tirage Spéciaux) par kilogramme brut"],"c":1},{"q":"Le contrat type dit « général » applicable aux transports publics routiers de marchandises stipule :","o":["que le poids brut de l'envoi ne comprend pas le poids des supports de charge","que le poids brut de l'envoi comprend le poids des supports de charge","que les supports de charge des marchandises de l'envoi doivent obligatoirement faire l'objet d'un contrat séparé","que le transport des supports de charge des marchandises de l'envoi doit faire l'objet d'une facturation séparée"],"c":1},{"q":"L'établissement d'une lettre de voiture de déménagement est obligatoire pour effectuer un déménagement :","o":["quel que soit le volume","d'au moins 6 m³","d'au moins 14 m³","d'au moins 19 m³"],"c":0}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
