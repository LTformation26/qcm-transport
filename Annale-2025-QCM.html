<title>Annale 2025 – QCM</title>
<style>
  :root { --texte:#0F2A1D; --sapin:#095228; --rouge:#C62828; --vert-ok:#1e7d45; --fond-ok:#e7f4ec; --fond-ko:#fbeaea; --filet:#cfd8d2; --gris:#5d6f64; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--texte); font-family: Verdana, "DejaVu Sans", sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 30px; }
  header { display:flex; align-items:center; gap:14px; border-bottom: 3px solid var(--sapin); padding-bottom: 12px; margin-bottom: 18px; }
  header img { width: 52px; height: auto; }
  header .marque { font-size: 13px; color: var(--gris); letter-spacing: .5px; }
  header h1 { margin: 0; font-size: 22px; color: var(--sapin); line-height:1.2; }
  .progres { display:flex; justify-content:space-between; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: #e3e9e5; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .barre div { height: 100%; width: 0; background: var(--sapin); transition: width .3s; }
  .question { font-size: 19px; font-weight: bold; margin: 0 0 18px; white-space: pre-line; }
  .question::after { content:""; display:block; width:48px; border-top: 3px solid var(--rouge); margin-top: 10px; }
  .choix { display:flex; flex-direction:column; gap: 10px; }
  .choix button { text-align:left; font: inherit; color: var(--texte); background:#fff; border: 1.5px solid var(--filet); border-radius: 8px; padding: 13px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .choix button:hover:not(:disabled) { border-color: var(--sapin); }
  .choix button .l { font-weight:bold; color: var(--sapin); min-width: 20px; }
  .choix button:disabled { cursor: default; }
  .choix button.ok { background: var(--fond-ok); border-color: var(--vert-ok); }
  .choix button.ko { background: var(--fond-ko); border-color: var(--rouge); }
  .retour { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--sapin); display:none; }
  .retour.ko { border-left-color: var(--rouge); }
  .retour .exp { white-space: pre-line; }
  .retour .titre { font-weight: bold; color: var(--rouge); }
  .retour .titre:empty { display: none; }
  .retour.okk .titre { color: var(--vert-ok); }
  .retour.ko .titre { color: var(--rouge); }
  .actions { margin-top: 22px; text-align: right; }
  .btn { font: inherit; font-weight: bold; background: var(--sapin); color:#fff; border: none; border-radius: 8px; padding: 12px 24px; cursor:pointer; }
  .btn:hover { background: #0b6a32; }
  .btn[hidden] { display:none; }
  .resultat { text-align:center; padding-top: 10px; }
  .resultat .score { font-size: 56px; font-weight: bold; color: var(--sapin); line-height:1.1; }
  .resultat .sur { color: var(--gris); margin-bottom: 14px; }
  .resultat .msg { font-size: 18px; margin-bottom: 22px; }
  @media (max-width: 520px) { body { font-size: 16px; } .question { font-size: 17px; } header h1 { font-size: 19px; } }
</style>
</head>

<script>
const QUESTIONS = [
  {"q": "Question 1. L'injonction de payer est :", "r": ["un effet de commerce", "une ordonnance du président du tribunal de commerce ou du tribunal judiciaire", "une lettre recommandée adressée par le créancier à son débiteur et exigeant le paiement immédiat de la créance", "une sommation signifiée par voie d'huissier"], "b": 1, "e": "C'est une décision rendue sur requête par le président du tribunal : une ordonnance.", "u": false},
  {"q": "Question 2. En l'absence de convention, le contrat type applicable aux transports publics routiers de marchandises exécutés par des sous-traitants est applicable pour les relations entre :", "r": ["un transporteur routier de marchandises et un loueur de véhicules industriels avec conducteur", "une entreprise de transport pour compte propre et une entreprise de transport public routier de marchandises", "un commissionnaire de transport et un transporteur public routier de marchandises", "un commissionnaire de transport et un loueur de véhicules industriels avec conducteur"], "b": 2, "e": "Le contrat type sous-traitance lie un donneur d'ordre (transporteur ou commissionnaire) à un transporteur public routier.", "u": false},
  {"q": "Question 3. Dans une SARL (société à responsabilité limitée), les associés :", "r": ["ne sont responsables des dettes de l'entreprise que dans la limite du montant de leurs apports", "sont responsables des dettes de l'entreprise sur l'ensemble de leurs biens propres", "ne sont responsables que de leurs dettes personnelles", "sont solidairement et indéfiniment responsables"], "b": 0, "e": "Dans une SARL, la responsabilité des associés est limitée à leurs apports.", "u": false},
  {"q": "Question 4. Les juges qui siègent au tribunal de commerce sont :", "r": ["des commerçants ou d'anciens commerçants élus pour 6 ans maximum par catégorie professionnelle", "des commerçants et des représentants syndicaux élus pour 6 ans maximum par leurs pairs", "des représentants des employeurs et des salariés élus pour 6 ans maximum par leurs pairs", "des commerçants et des salariés élus pour 6 ans maximum"], "b": 0, "e": "Les juges consulaires sont des commerçants ou anciens commerçants, élus par leurs pairs.", "u": false},
  {"q": "Question 5. La faillite personnelle est :", "r": ["une sanction envers une personne physique", "la mise en liquidation de l'entreprise personnelle", "le dépôt de bilan de l'entreprise personnelle", "l'impossibilité de rembourser les créanciers après liquidation"], "b": 0, "e": "C'est une sanction prononcée contre une personne physique (dirigeant ou entrepreneur individuel).", "u": false},
  {"q": "Question 6. En cas de désaccord avec une décision de justice rendue par le tribunal de commerce, concernant un montant de 7 500 €, vous pouvez porter l'affaire devant :", "r": ["la cour de cassation", "la cour d'appel", "le tribunal judiciaire", "la cour d'assises"], "b": 1, "e": "Au-dessus de 5 000 €, la décision du tribunal de commerce peut faire l'objet d'un appel devant la cour d'appel.", "u": false},
  {"q": "Question 7. Dans une société en nom collectif, les associés :", "r": ["n'engagent que leurs apports", "n'engagent que l'actif de la société", "engagent solidairement et indéfiniment l'ensemble de leurs biens", "s'engagent à assumer les dettes proportionnellement à leurs apports"], "b": 2, "e": "Les associés d'une SNC sont tenus solidairement et indéfiniment des dettes sociales.", "u": false},
  {"q": "Question 8. Parmi les quatre mentions figurant ci-dessous, une mention doit figurer obligatoirement dans les statuts d'une société :", "r": ["l'objet social de la société", "le régime fiscal adopté par la société", "le nombre de salariés", "le nom du ou des gérants de la société"], "b": 0, "e": "L'objet social fait partie des mentions obligatoires des statuts.", "u": false},
  {"q": "Question 9. Les membres des Chambres de commerce et d'industrie sont élus pour :", "r": ["4 ans renouvelables par moitié tous les 2 ans", "5 ans renouvelables en totalité", "9 ans renouvelables par tiers tous les 3 ans", "3 ans renouvelables tous les 3 ans"], "b": 1, "e": "Ils sont élus pour 5 ans, avec renouvellement en totalité.", "u": false},
  {"q": "Question 10. La lettre de change est un effet de commerce :", "r": ["dont le paiement est garanti à la date d'échéance figurant sur ce document", "qui est rédigé par le tiré et adressé au tireur pour acceptation", "qui est toujours à échéance indéterminée et escomptable", "qui est rédigé par le tireur et adressé au tiré pour acceptation"], "b": 3, "e": "Le tireur rédige la lettre de change et l'adresse au tiré, qui l'accepte.", "u": false},
  {"q": "Question 11. En tant que dirigeant d'une entreprise, vous souhaitez avoir le statut de salarié. Vous devez être gérant associé :", "r": ["majoritaire d'une SARL (société à responsabilité limitée)", "d'une EURL (entreprise unipersonnelle à responsabilité limitée)", "d'une SNC (société en nom collectif)", "minoritaire d'une SARL"], "b": 3, "e": "Le gérant minoritaire d'une SARL relève du régime des salariés (assimilé salarié). Le gérant majoritaire, l'associé d'EURL et le gérant de SNC sont non salariés.", "u": false},
  {"q": "Question 12. Les commissaires aux comptes ont pour mission :", "r": ["de dresser la comptabilité", "d'apprécier la gestion de la société", "d'informer les salariés sur la comptabilité et la gestion", "de certifier la régularité et la sincérité des comptes"], "b": 3, "e": "Ils certifient la régularité et la sincérité des comptes annuels.", "u": false},
  {"q": "Question 13. Les apports en industrie sont des apports :", "r": ["immobiliers provenant du secteur industriel", "de clientèle seulement", "de savoirs ou de savoir-faire", "de véhicules et de machines à usage industriel"], "b": 2, "e": "L'apport en industrie est un apport de travail, de connaissances ou de savoir-faire.", "u": false},
  {"q": "Question 14. La variation de stock est calculée en fin d'exercice comptable pour déterminer :", "r": ["le montant du stock final qui sera reporté au compte de résultat", "le montant des plus-values ou des moins-values sur les stocks afin de pouvoir les évaluer au bilan", "la partie des stocks qui a été égarée ou volée", "le montant réel des consommations de matières premières et d'autres approvisionnements pendant l'exercice comptable"], "b": 3, "e": "Stock initial − stock final = variation de stock, qui permet de passer des achats aux consommations réelles de l'exercice.", "u": false},
  {"q": "Question 15. La contribution économique territoriale (CET) est composée :", "r": ["de la valeur locative des locaux et de la masse salariale", "de la masse salariale brute", "de la cotisation foncière des entreprises (CFE) et de la cotisation sur la valeur ajoutée des entreprises (CVAE)", "des cotisations fiscale et foncière des entreprises (CFFE)"], "b": 2, "e": "La CET comprend la CFE et la CVAE.", "u": false},
  {"q": "Question 16. Le mécanisme de la taxe sur la valeur ajoutée a une incidence sur :", "r": ["les résultats de l'entreprise", "les coûts de revient de l'entreprise", "la trésorerie de l'entreprise", "les produits d'exploitation de l'entreprise"], "b": 2, "e": "La TVA est neutre sur le résultat et le coût de revient, mais elle joue sur la trésorerie (décalage entre TVA collectée et TVA déductible).", "u": false},
  {"q": "Question 17. Dans le cadre du licenciement pour faute, l'absence ou la non présentation du salarié à l'entretien préalable :", "r": ["n'est pas une faute de la part du salarié, mais n'interrompt pas la procédure en cours", "entraîne l'obligation pour l'employeur de reconvoquer le salarié", "est une faute de la part du salarié", "entraîne l'interdiction de poursuivre la procédure"], "b": 0, "e": "Le salarié n'est pas tenu de se présenter, et l'employeur peut poursuivre la procédure.", "u": false},
  {"q": "Question 18. Selon le règlement (CE) n° 561/2006, un conducteur doit observer une pause d'au moins 45 minutes après un temps de conduite de :", "r": ["4 heures", "4 heures 30 minutes", "4 heures 45 minutes", "5 heures"], "b": 1, "e": "Pause de 45 minutes après 4 h 30 de conduite.", "u": false},
  {"q": "Question 19. Sauf danger immédiat pour la sécurité, une inaptitude définitive au poste de travail est reconnue :", "r": ["par le médecin traitant après un examen médical", "par le médecin du travail après au moins un examen médical et une étude du poste", "par le salarié lui-même", "par l'employeur après avis du médecin du travail et du comité social et économique (CSE)"], "b": 1, "e": "Seul le médecin du travail constate l'inaptitude, après un examen médical et une étude du poste.", "u": false},
  {"q": "Question 20. Selon la réglementation sociale européenne (RSE), la durée maximale de conduite journalière peut être portée à :", "r": ["10 heures deux fois par semaine", "10 heures trois fois par semaine", "11 heures une fois par semaine", "11 heures deux fois par semaine"], "b": 0, "e": "La conduite journalière est de 9 h, portée à 10 h au maximum deux fois par semaine.", "u": false},
  {"q": "Question 21. Le comité social et économique (CSE) possède :", "r": ["un droit de veto en matière de gestion économique et financière de l'entreprise", "un pouvoir de décision à l'égard du plan annuel de formation qui lui est obligatoirement présenté par le chef d'entreprise", "un droit de veto en matière de gestion de l'emploi", "un pouvoir consultatif en matière de gestion économique de l'entreprise, d'emploi, de formation professionnelle"], "b": 3, "e": "Le CSE est consulté, mais il ne décide pas à la place de l'employeur.", "u": false},
  {"q": "Question 22. Le règlement intérieur contient obligatoirement des clauses :", "r": ["relatives aux droits des salariés en cas de sanctions disciplinaires", "faisant expressément référence au secret professionnel", "précisant que chaque salarié est responsable de sa sécurité personnelle", "relatives aux obligations de non-concurrence"], "b": 0, "e": "Il fixe notamment les règles d'hygiène et de sécurité, la discipline et les droits de la défense du salarié en cas de sanction.", "u": false},
  {"q": "Question 23. L'assiette de calcul de l'indemnité de congés payés exclut les éléments de rémunération suivants :", "r": ["les remboursements de frais", "les majorations pour heures supplémentaires", "les primes d'ancienneté", "la prime d'entretien"], "b": 0, "e": "Les remboursements de frais ne sont pas un salaire : ils sont exclus de l'assiette.", "u": false},
  {"q": "Question 24. Dans quel cas le représentant du personnel, une fois élu, conserve-t-il son mandat ?", "r": ["en cas de modification de la situation juridique de l'employeur lui faisant perdre son autonomie juridique", "en cas de changement de catégorie professionnelle", "en cas de démission", "en cas de cessation d'activité"], "b": 1, "e": "Le changement de catégorie professionnelle ne met pas fin au mandat. La démission et la cessation d'activité y mettent fin.", "u": false},
  {"q": "Question 25. Le certificat de travail mentionne obligatoirement :", "r": ["les dates d'entrée et de sortie", "le motif de la fin du contrat (rupture)", "une appréciation générale sur les qualités professionnelles", "l'existence d'une clause de non concurrence"], "b": 0, "e": "Il mentionne les dates d'entrée et de sortie et la nature des emplois occupés.", "u": false},
  {"q": "Question 26. Selon le règlement (CE) n° 561/2006, lorsque le repos journalier est fractionné, sa durée totale ne doit pas être inférieure à :", "r": ["11 heures", "11 heures 30 minutes", "12 heures", "12 heures 30 minutes"], "b": 2, "e": "Repos fractionné : une période d'au moins 3 h puis une d'au moins 9 h, soit 12 h au total.", "u": false},
  {"q": "Question 27. Un conducteur qui a effectué 4 heures de travail le dimanche dans une entreprise de transport routier doit être rémunéré suivant :", "r": ["une majoration de 25 % des heures effectuées le dimanche", "un paiement double des heures effectuées le dimanche", "une récupération des heures effectuées le dimanche", "une indemnité forfaitaire fixée par la convention collective en plus du paiement des heures effectuées le dimanche"], "b": 3, "e": "En plus du paiement des heures effectuées le dimanche, la convention collective prévoit une indemnité forfaitaire.", "u": false},
  {"q": "Question 28. À la suite d'un accident du travail, un salarié est déclaré inapte à son emploi. L'employeur ne pouvant pas le reclasser doit :", "r": ["licencier le salarié pour motif économique", "solliciter la démission du salarié", "licencier le salarié et verser une indemnité spéciale de licenciement", "prononcer un licenciement pour faute grave"], "b": 3, "e": "Réponse du corrigé officiel de la session du 8 octobre 2025.", "u": false},

  {"q": "Question 37. Un transporteur, qui n'est pas inscrit au registre des commissionnaires de transport, peut avoir recours à la sous-traitance sans dépasser une limite du chiffre d'affaires annuel de l'activité transport routier de l'entreprise. Cette limite est de :", "r": ["10 %", "15 %", "20 %", "25 %"], "b": 1, "e": "Un transporteur non inscrit au registre des commissionnaires peut sous-traiter dans la limite de 15 % du chiffre d'affaires de son activité de transport routier.", "u": false},

  {"q": "Question 50. Dans le cas d'un transport international sans rupture de charge, comprenant un parcours maritime, la CMR (Convention marchandises par route) s'applique en général :", "r": ["sur le parcours routier", "sur la totalité du parcours", "sur le parcours maritime", "uniquement dans le pays de destination"], "b": 1, "e": "Sans rupture de charge, la CMR s'applique sur la totalité du parcours, y compris le trajet maritime.", "u": false}
];
const POINTS = 2, LETTRES = ["A","B","C","D"];
let ordre = [], i = 0, score = 0, rates = [];
const zone = document.getElementById("zone");

function melange(t) { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; }

function demarrer() {
  ordre = QUESTIONS.map(q => ({ q: q.q, e: q.e, u: q.u, r: q.r.slice(), b: q.b }));
  i = 0; score = 0; rates = []; afficher();
}

function afficher() {
  const Q = ordre[i], n = ordre.length;
  zone.innerHTML = `
    <div class="progres"><span>Question ${i + 1} / ${n}</span><span>${score} / ${n * POINTS} points</span></div>
    <div class="barre"><div style="width:${(i / n) * 100}%"></div></div>
    <p class="question"></p>
    <div class="choix"></div>
    <div class="retour"><div class="titre"></div><div class="exp"></div></div>
    <div class="actions"><button class="btn" id="suivant" hidden>${i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button></div>`;
  zone.querySelector(".question").textContent = Q.q;
  const choix = zone.querySelector(".choix");
  Q.r.forEach((txt, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="l">${LETTRES[k]}.</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => repondre(k);
    choix.appendChild(b);
  });
}

function repondre(k) {
  const Q = ordre[i], btns = zone.querySelectorAll(".choix button"), ret = zone.querySelector(".retour");
  btns.forEach(b => b.disabled = true);
  btns[Q.b].classList.add("ok");
  if (k === Q.b) {
    score += POINTS;
    ret.className = "retour okk";
  } else {
    btns[k].classList.add("ko");
    rates.push(i + 1);
    ret.className = "retour ko";
  }
  const faux = (k !== Q.b);
  ret.querySelector(".titre").textContent = faux ? "Mauvaise réponse" : "";
  ret.querySelector(".exp").textContent = Q.e;
  if (faux || Q.u) ret.style.display = "block";
  zone.querySelector(".progres span:last-child").textContent = `${score} / ${ordre.length * POINTS} points`;
  const s = document.getElementById("suivant");
  s.hidden = false;
  s.onclick = () => { i++; i < ordre.length ? afficher() : resultat(); };
}

function resultat() {
  const total = ordre.length * POINTS, pct = score / total;
  const msg = pct >= 0.8 ? "Très bon résultat, vous êtes prêt pour l'examen."
            : pct >= 0.5 ? "Résultat correct. Relisez le cours sur les points où vous vous êtes trompé."
            : "Résultat insuffisant. Reprenez les cours avant de recommencer.";
  zone.innerHTML = `
    <div class="barre"><div style="width:100%"></div></div>
    <div class="resultat">
      <div class="score">${score}</div><div class="sur">sur ${total} points</div>
      <div class="msg">${msg}</div>
      <p>${rates.length ? "Questions à revoir : " + rates.join(", ") + "." : "Aucune erreur."}</p>
      <button class="btn" id="recommencer">Recommencer l'annale</button>
    </div>`;
  document.getElementById("recommencer").onclick = demarrer;
}

demarrer();
</script>
