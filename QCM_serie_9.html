<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta property="og:title" content="QCM Série 9">

<meta property="og:type" content="website">
<meta name="description" content="QCM Série 9 — Attestation de capacité de transport de marchandises +3,5 t">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM Série 9</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Un conducteur prend 7 repos journaliers par mois hors domicile et effectue la journée suivante : conduite (7 h) + autres travaux (1 h) + attente (2 h) + pause (1 h 30) + repas (30 min). Son temps de service total est de :","o":["8 h","10 h","11 h 30","12 h"],"c":1,"r":["Temps de service = conduite (7 h) + autres travaux (1 h) + attente/disponibilité (2 h) = 10 h. Les pauses et repas (2 h) en sont exclus."]},{"q":"Un conducteur d'un véhicule léger (≤ 3,5 t) effectuant un service régulier avec retour quotidien au centre d'exploitation doit pouvoir présenter sur route :","o":["la carte de conducteur","l'horaire de service","le livret individuel de contrôle","le disque de contrôle d'un tachygraphe analogique"],"c":1,"r":["Pour un véhicule de moins de 3,5 t en service régulier avec retour quotidien à la base, l'horaire de service affiché tient lieu de document de contrôle de la durée du travail."]},{"q":"Les heures de travail accomplies pendant la période nocturne ouvrent droit pour le salarié à :","o":["une prime forfaitaire non soumise aux cotisations sociales","une majoration automatique de 100 % du taux horaire","une compensation sous forme de repos obligatoire ou d'une majoration salariale spécifique","l'octroi automatique d'une journée de congé payé supplémentaire par mois"],"c":2,"r":["Le travail de nuit ouvre droit à des contreparties : repos compensateur payé et/ou majoration de salaire spécifique prévue par la CCNTR."]},{"q":"L'intervalle de temps maximal entre deux téléchargements des données numériques de la carte de conducteur ne peut excéder :","o":["7 jours","14 jours","95 jours","28 jours"],"c":3,"r":["Les données de la carte de conducteur doivent être téléchargées au moins tous les 28 jours (et tous les 90 jours pour la mémoire du chronotachygraphe)."]},{"q":"Lorsqu'un véhicule est pris en location sans conducteur par un transporteur public routier, la licence de transport à bord du véhicule doit être au nom :","o":["du loueur du véhicule","du transporteur locataire uniquement","de l'expéditeur de la marchandise","du constructeur du véhicule"],"c":1,"r":["En location sans conducteur, c'est le locataire transporteur qui doit détenir à bord la copie conforme de sa propre licence de transport."]},{"q":"Un transporteur français effectuant des opérations de cabotage dans un autre État membre de l'UE avec un véhicule de 19 t doit présenter lors d'un contrôle :","o":["une autorisation spéciale délivrée par le pays d'accueil","la copie conforme de la licence communautaire","une attestation d'exonération de TVA","une licence de transport intérieur français"],"c":1,"r":["Pour caboter dans un État membre, le transporteur doit détenir une licence communautaire et en conserver une copie conforme à bord."]},{"q":"Selon le contrat type « général », pour les envois de 3 t et plus, les opérations de chargement, de calage et d'arrimage incombent à :","o":["l'entreprise de transport routier","l'équipage du véhicule","au destinataire final","l'expéditeur / donneur d'ordre"],"c":3,"r":["Pour les envois ≥ 3 t, le chargement, le calage et l'arrimage incombent à l'expéditeur, sous sa responsabilité."]},{"q":"L'établissement d'une lettre de voiture de déménagement est obligatoire :","o":["quel que soit le volume transporté","uniquement au-delà de 10 m³","uniquement au-delà de 3,5 t","seulement pour les déménagements internationaux"],"c":0,"r":["En déménagement, la lettre de voiture spécifique est obligatoire pour chaque opération, quel que soit le volume ou le tonnage."]},{"q":"L'article L. 3221-3 du Code des transports relatif aux conditions de sous-traitance s'applique aux contrats conclus entre :","o":["un transporteur public et un conducteur indépendant","un sous-traitant et son sous-traitant de second rang uniquement","l'expéditeur et le destinataire","un transporteur routier de marchandises et un commissionnaire de transport"],"c":3,"r":["L'article L3221-3 régit les relations de sous-traitance : il s'applique entre un commissionnaire de transport et un transporteur routier (ou entre transporteurs)."]},{"q":"En transport national, la protestation motivée (réserves confirmées par écrit) en cas de dommage doit être adressée par le destinataire :","o":["au transporteur livreur","au tribunal de commerce","à la compagnie d'assurance de l'expéditeur","au sous-traitant d'origine s'il est identifié"],"c":0,"r":["Les réserves motivées en cas de perte ou d'avarie doivent être adressées au transporteur qui a effectué la livraison (le dernier voiturier)."]},{"q":"En transport routier national de marchandises, le destinataire dispose pour notifier sa protestation motivée au transporteur d'un délai de :","o":["3 jours non compris les jours fériés suivant la réception des objets","7 jours calendaires après la livraison","24 heures suivant la signature du récépissé","10 jours ouvrés"],"c":0,"r":["L'article L133-3 du Code de commerce prévoit un délai de 3 jours (hors jours fériés) pour notifier une protestation motivée, par acte extrajudiciaire ou lettre recommandée."]},{"q":"En transport international routier (CMR), l'indemnité due par le transporteur en cas de retard à la livraison est plafonnée à :","o":["la valeur réelle de la marchandise transportée","montant du prix du transport","8,33 DTS par kilogramme de poids brut","deux fois la valeur déclarée en douane"],"c":1,"r":["Sous le régime CMR (art. 23.5), en cas de retard, l'indemnité est plafonnée au prix du transport, si un préjudice est prouvé."]},{"q":"Conformément à l'article L. 132-8 du Code de commerce (garantie de paiement du prix du transport), sont garants vis-à-vis du voiturier :","o":["l'expéditeur et le commissionnaire uniquement","l'expéditeur et le destinataire","le destinataire et son assureur","le sous-traitant et l'expéditeur"],"c":1,"r":["La lettre de voiture lie l'expéditeur, le voiturier et le destinataire ; l'expéditeur et le destinataire sont garants du paiement du transport."]},{"q":"Un tracteur routier (PV 5,5 t, PTRA 21 t) est attelé à une semi-remorque (PV 6 t, PTAC 25 t). La charge utile maximale disponible est de :","o":["13,5 t","9,5 t","19,5 t","15 t"],"c":1,"r":["Charge utile = PTRA du tracteur (21 t) − poids à vide total (5,5 + 6 = 11,5 t) = 9,5 t."]},{"q":"Lors d'un contrôle routier, le document attestant du droit d'exercer l'activité de transporteur public de marchandises est :","o":["l'extrait Kbis de l'entreprise","l'attestation de capacité professionnelle du gérant","la copie conforme de la licence de transport","le certificat d'immatriculation du véhicule"],"c":2,"r":["À bord de tout véhicule en transport public, la copie conforme de la licence de transport (intérieure ou communautaire) doit être présentée au contrôle."]},{"q":"La durée maximale de validité d'une licence de transport (communautaire ou intérieure) est fixée à :","o":["5 ans","3 ans","1 an renouvelable","10 ans"],"c":3,"r":["Les licences de transport (communautaire pour +3,5 t, intérieure pour −3,5 t) sont délivrées par la DREETS pour une durée maximale de 10 ans renouvelable."]},{"q":"Sauf dérogation, l'interdiction générale de circulation du week-end (du samedi 22 h au dimanche 22 h) s'applique aux véhicules dont le PTAC est supérieur à :","o":["3,5 t","6 t","7,5 t","12 t"],"c":2,"r":["L'interdiction vise les véhicules de transport de marchandises de plus de 7,5 t de PTAC."]},{"q":"La Masse Maximale Autorisée (MMA) d'un ensemble articulé est déterminée par :","o":["l'addition simple des deux PTAC (tracteur + semi-remorque)","la charge maximale à l'essieu arrière du tracteur","la somme du poids à vide du tracteur et du PTAC de la semi-remorque, dans la limite du PTRA","le poids à vide total multiplié par le coefficient de sécurité 1,2"],"c":2,"r":["La MMA d'un véhicule articulé = poids à vide du tracteur + PTAC de la semi-remorque, dans la limite du PTRA du tracteur."]},{"q":"La longueur maximale autorisée pour un véhicule articulé (tracteur + semi-remorque) est de :","o":["12,00 m","18,75 m","16,50 m","15,00 m"],"c":2,"r":["Selon l'article R312-11 du Code de la route, la longueur maximale d'un véhicule articulé est de 16,50 m."]},{"q":"La circulation d'un convoi exceptionnel est obligatoirement interrompue dès que :","o":["la vitesse du vent dépasse 50 km/h","la visibilité devient inférieure à 150 m","la température extérieure descend sous 0 °C","le trafic autoroutier devient trop dense"],"c":1,"r":["La circulation d'un convoi exceptionnel est interrompue dès que la visibilité est inférieure à 150 m (brouillard, neige, pluie intenses)."]},{"q":"Un poids lourd de 9 t de PTAC circulant sur autoroute en France est limité à la vitesse maximale de :","o":["90 km/h","80 km/h","100 km/h","110 km/h"],"c":0,"r":["Un véhicule de marchandises de plus de 3,5 t est limité à 90 km/h sur autoroute (art. R413-8)."]},{"q":"Pour un transport de marchandises classique, le chargement ne peut pas dépasser à l'avant du véhicule et peut dépasser à l'arrière d'un maximum de :","o":["1 m à l'arrière","2 m à l'arrière","3 m à l'arrière","4 m à l'arrière"],"c":2,"r":["Aucun dépassement du chargement à l'avant ; à l'arrière, il est toléré jusqu'à 3 m (avec signalisation au-delà de 1 m)."]},{"q":"Des marchandises en provenance d'un pays tiers débarquées dans un port de l'UE et acheminées vers un autre État membre sans dédouanement préalable circulent sous le régime du :","o":["Transit communautaire interne (T2)","Transit communautaire externe (T1)","Carnet TIR uniquement","Régime de l'admission temporaire"],"c":1,"r":["Le transit communautaire externe (T1) permet la circulation de marchandises non communautaires entre deux points de l'UE, en suspension de droits et taxes."]},{"q":"Une autorisation CEMT permet de réaliser des transports internationaux entre pays membres de la CEMT, mais ne permet pas d'effectuer un transport entre :","o":["la France et le Maroc","la France et la Turquie","la France et la Norvège","l'Allemagne et la Suisse"],"c":0,"r":["La CEMT couvre les transports entre États membres ; le Maroc n'en étant pas membre, un transport France-Maroc requiert une autorisation bilatérale."]},{"q":"Après un transport international entrant, un transporteur communautaire peut réaliser des opérations de cabotage dans un autre État membre sous couvert de :","o":["une autorisation CEMT bilatérale","une déclaration en douane électronique","un passeport de cabotage d'une durée d'un mois","la copie conforme de sa licence communautaire"],"c":3,"r":["Après un transport international entrant, le transporteur peut réaliser jusqu'à 3 opérations de cabotage sous couvert de la copie conforme de sa licence communautaire."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
