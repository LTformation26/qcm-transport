<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta property="og:title" content="Commissionnaire · Série 3">

<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">QCM Commissionnaire de transport</p>
<h1>Commissionnaire · Série 3</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Dans le cadre de l'affrètement, le commissionnaire :","o":["charge directement chez l'expéditeur pour décharger chez le destinataire","donne ordre au transporteur de livrer chez un autre affréteur","fait exécuter les transports par un ou des transporteurs de son choix, de l'expéditeur au destinataire","ne peut travailler qu'avec le service affrètement de son entreprise"],"c":2,"r":["Le commissionnaire s'engage à faire exécuter, en son nom propre et sous sa responsabilité, le déplacement de la marchandise.","Il choisit librement les voies, les moyens et les transporteurs sous-traitants."]},{"q":"Le privilège du commissionnaire de transport concerne les créances :","o":["antérieures seulement","en cours et celles à venir","antérieures et en cours","relatives à la dette douanière uniquement"],"c":2,"r":["Le commissionnaire bénéficie d'un privilège (droit de rétention) sur les marchandises qu'il détient, pour ses créances antérieures et en cours."]},{"q":"Un transporteur français effectue un transport pour un client espagnol dont le numéro de TVA intracommunautaire est invalide sur VIES. Comment doit-il facturer ?","o":["HT en autoliquidation","TTC avec la TVA française (20 %)","TTC avec la TVA espagnole","HT avec la TVA à 0 %"],"c":1,"r":["Un numéro de TVA invalide sur VIES ne permet pas de facturer en HT : le transporteur doit appliquer la TVA française à 20 %."]},{"q":"Vous exportez temporairement des marchandises communautaires pour les faire ouvrer, transformer ou réparer dans un pays tiers, puis les réimporter en exonération totale ou partielle des droits à l'importation. Le régime douanier le mieux adapté est :","o":["le perfectionnement passif","l'importation","le perfectionnement actif","l'admission temporaire"],"c":0,"r":["Le perfectionnement passif permet d'exporter temporairement des marchandises de l'UE pour transformation, puis de les réimporter en exonération totale ou partielle.","Le perfectionnement actif, c'est l'inverse : importer temporairement pour transformer dans l'UE avant de réexporter."]},{"q":"L'article L. 132-8 du code de commerce prévoit une garantie au profit du transporteur routier impayé par son donneur d'ordre, contre le destinataire et/ou l'expéditeur. Il s'agit :","o":["du droit de rétention","du droit de privilège","du droit d'hypothèque","de l'action directe en paiement"],"c":3,"r":["Impayé par son donneur d'ordre, le transporteur dispose d'un recours direct en paiement contre le destinataire ou l'expéditeur, tous deux garants.","Le droit de rétention (garder la marchandise) et le privilège (priorité sur sa valeur) sont, eux, d'autres mécanismes."]},{"q":"Parmi les documents de transport suivants, celui qui constitue un titre représentatif de la marchandise est :","o":["la lettre de transport aérien","la lettre de voiture CIM","la lettre de voiture internationale CMR","le connaissement maritime"],"c":3,"r":["Un titre représentatif (document négociable) est juridiquement incorporé à la marchandise : celui qui détient l'original du connaissement maritime est le propriétaire légal des biens."]},{"q":"L'entrepôt douanier est un régime douanier qui permet :","o":["de stocker les marchandises en l'état dans l'attente de l'affectation à une autre destination douanière","de stocker des marchandises pour une durée de 12 mois","de dispenser les marchandises de toutes formalités déclaratives lors de leur sortie d'entrepôt","de transformer définitivement les marchandises sans autorisation préalable des douanes"],"c":0,"r":["L'entrepôt douanier permet de stocker des marchandises hors UE en suspension des droits de douane et de la TVA.","Les taxes ne sont payées qu'à la sortie de stock, pour la vente."]},{"q":"Le régime du transit de l'Union externe (T1) s'applique :","o":["aux marchandises non UE (pays tiers, non mises en libre pratique) circulant sur le territoire de l'Union en suspension des droits et taxes","exclusivement aux marchandises en provenance des pays du Maghreb","à l'exportation de matériels de guerre à destination des pays membres de l'AELE","à l'importation temporaire de matériels destinés à des foires et salons dans l'UE"],"c":0,"r":["Le transit fait voyager la marchandise sans payer les taxes ni refaire les papiers à chaque frontière ; les droits et la TVA ne sont réglés qu'à l'arrivée finale."]},{"q":"Le TIR (transport international routier) désigne une convention :","o":["douanière","qui régit le contrat de transport international routier","sur le transport des produits dangereux par route","relative au transfert des risques en transport international routier"],"c":0,"r":["La convention TIR est une convention douanière facilitant le transit routier international sous scellés."]},{"q":"Quelle est la longueur standard ISO du conteneur maritime servant de référence de base pour mesurer la capacité d'un navire porte-conteneurs (1 EVP / TEU) ?","o":["20 pieds","30 pieds","40 pieds","53 pieds"],"c":0,"r":["Le TEU / EVP (équivalent vingt pieds) est l'unité de référence : 1 EVP = 1 conteneur de 20 pieds (environ 6 m).","Un conteneur de 40 pieds équivaut à 2 EVP."]},{"q":"Le contrat type applicable aux transports publics routiers de marchandises exécutés par des sous-traitants :","o":["ne s'applique qu'entre le commissionnaire et son client","ne s'applique pas obligatoirement entre le commissionnaire et le transporteur","ne s'applique que lorsque le commissionnaire et le transporteur l'émargent","s'applique en l'absence d'un contrat écrit entre le commissionnaire et le transporteur"],"c":3,"r":["En l'absence de contrat écrit signé, le contrat type s'applique de plein droit."]},{"q":"Un commissionnaire de transport est celui qui agit :","o":["en son nom pour le compte d'un commettant","au nom d'un commettant","au nom d'un transporteur maritime","au nom d'un transporteur aérien"],"c":0,"r":["Le commettant est son client (l'expéditeur ou le donneur d'ordre pour qui la marchandise voyage)."]},{"q":"Le commissionnaire de transport a une obligation :","o":["de résultat","de moyens","d'écriture comptable relative au déplacement","de payer les frais de déplacement au conducteur"],"c":0,"r":["Il est garant de ses propres fautes et répond aussi des fautes des sous-traitants (transporteurs, manutentionnaires) auxquels il fait appel."]},{"q":"Le statut d'opérateur économique agréé (O.E.A.) est :","o":["réservé aux commissionnaires en douane","réservé aux importateurs et aux exportateurs","accordé à tous les opérateurs du commerce international (commissionnaires, exportateurs, importateurs, transitaires…)","accordé par l'intermédiaire d'une chambre de commerce"],"c":2,"r":["Le statut OEA est ouvert à tous les acteurs du commerce international. Il donne un traitement douanier prioritaire, réduit les contrôles et accélère le dédouanement."]},{"q":"En vente sous l'Incoterm FOB (Free On Board), le vendeur remplit son obligation de livraison lorsque :","o":["les marchandises sont livrées sur un lieu désigné par l'acheteur dans le pays d'arrivée","les marchandises sont placées à bord du navire désigné par l'acheteur au port d'embarquement convenu","le capitaine du navire signe le connaissement maritime (Bill of Lading)","les marchandises sont remises au premier transporteur terrestre avant l'entrée dans le port"],"c":1,"r":["Le vendeur prend en charge la marchandise jusqu'à son chargement à bord du navire au port d'embarquement.","Dès que la marchandise est à bord, tous les risques et frais sont transférés à l'acheteur."]},{"q":"L'utilisation de l'incoterm CIF sous-entend que :","o":["l'acheteur prend en charge le transport principal et l'assurance","le vendeur prend en charge le transport principal uniquement","l'acheteur supporte le risque du transport principal","le vendeur prend en charge le dédouanement au port de débarquement"],"c":2,"r":["En CIF (CAF), le vendeur paie le fret maritime et souscrit l'assurance de base au profit de l'acheteur.","Mais les risques (casse, perte en mer) passent à l'acheteur dès la marchandise chargée à bord."]},{"q":"Le document physique ou électronique comportant un code-barres et un numéro MRN, émis lors d'une exportation dématérialisée pour accompagner la marchandise jusqu'au bureau de sortie de l'UE, s'appelle :","o":["le DAE / EAD (Document d'Accompagnement Export)","l'EUR.1","le Carnet TIR","le T2L"],"c":0,"r":["Le DAE prouve que des marchandises ont été dédouanées pour être exportées hors UE et les accompagne jusqu'au bureau de sortie."]},{"q":"Un document issu d'une convention internationale facilite l'importation et l'exportation temporaire ainsi que le transit de marchandises, en franchise de droits et de taxes. Il s'agit du :","o":["le DAU","le carnet TIR","le carnet ATA","le carnet IATA"],"c":2,"r":["Le carnet ATA est le passeport douanier des marchandises destinées à l'admission ou l'exportation temporaire sans paiement de droits."]},{"q":"Lors d'une opération de transport ponctuel, le commissionnaire de transport doit :","o":["s'assurer que les entreprises « sous-traitantes » sont habilitées à exercer les activités demandées","s'assurer que les transporteurs routiers ne font pas l'objet de poursuites ou de condamnations pour non-respect de la législation sociale","s'assurer que les transporteurs routiers sont à jour de leurs cotisations fiscales et sociales","demander aux transporteurs routiers une copie de la police d'assurance de la marchandise transportée"],"c":0,"r":["En tant qu'organisateur, le commissionnaire a une obligation légale de vigilance : il doit s'assurer que ses sous-traitants sont habilités à exercer les activités demandées."]},{"q":"Dans le cadre des accords de libre-échange avec l'Union européenne, à partir de quel montant un exportateur non agréé doit-il obligatoirement faire viser un certificat EUR.1 par la douane, au lieu d'une simple déclaration sur facture ?","o":["6 000 €","9 000 €","10 000 €","11 000 €"],"c":0,"r":["Moins de 6 000 € : déclaration d'origine sur facture. Plus de 6 000 € : certificat EUR.1 obligatoire pour un exportateur non agréé.","Un exportateur agréé, lui, peut faire la démarche seul."]},{"n":17,"q":"Un contrat de transport routier de marchandises ne peut pas prévoir de délai de paiement du transporteur supérieur à :","o":["15 jours","20 jours","25 jours","30 jours"],"c":3,"r":["Le Code de commerce (art. L441-11) impose un délai de paiement maximal de 30 jours à compter de la date d'émission de la facture en transport routier."]},{"n":18,"q":"Pour un envoi supérieur à 10 t ou supérieur à 30 m³, le contrat type dit « général » prévoit, en cas de rendez-vous respecté, un délai de chargement de :","o":["1 h","1 h 30","2 h","3 h"],"c":0},{"n":19,"q":"Le délai de forclusion, tel que défini par l'article L133-3 du code de commerce, est de :","o":["2 jours, non compris les jours fériés, qui suivent celui de la réception","3 jours, non compris les jours fériés, qui suivent celui de la réception","7 jours, non compris les jours fériés, qui suivent celui de la réception","21 jours, non compris les jours fériés, qui suivent celui de la réception"],"c":1},{"n":20,"q":"Les réserves doivent être :","o":["précisées et validées par le transporteur uniquement","écrites sur la lettre de voiture avec la mention « sous réserves de déballage »","écrites, précises, motivées et contradictoires","toujours approuvées par le transporteur au moment de la livraison"],"c":2,"r":["Pour valoir preuve à l'encontre du transporteur, les réserves doivent être écrites, précises, motivées et contradictoires."]},{"n":21,"q":"Selon le contrat-type général « transport routier », en cas de défaillance du transporteur :","o":["si le transporteur n'avise pas le donneur d'ordre de son retard par rapport au rendez-vous fixé, celui-ci peut rechercher un autre transporteur immédiatement","si le transporteur avise le donneur d'ordre d'un retard de 3 heures par rapport au rendez-vous fixé, celui-ci peut rechercher immédiatement un autre transporteur si le retard risque d'entraîner un préjudice grave","en l'absence de rendez-vous, le donneur d'ordre peut rechercher sans attendre un autre transporteur","le transporteur est tenu de sous-traiter l'envoi à un autre transporteur"],"c":1,"r":["En cas de retard du transporteur supérieur à 3 heures, le donneur d'ordre peut mandater un autre transporteur si cela risque de lui causer un préjudice grave."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
