<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCM : le contrat de transport</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap");
*{box-sizing:border-box}body{margin:0;font-family:'Open Sans',Arial,sans-serif;background:#fff;color:#0B0D0C;font-size:18px}
.w{max-width:820px;margin:0 auto;padding:20px 16px}
h1{font-family:Sora,Arial,sans-serif;color:#007A4E;font-size:24px;margin:0 0 14px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{height:10px;background:#E3F1EA;border-radius:6px;overflow:hidden;margin-bottom:22px}.bar i{display:block;height:100%;background:#00A86C;transition:width .3s}
.q{font-family:Sora,Arial,sans-serif;font-weight:600;font-size:21px;line-height:1.4;margin:0 0 18px}
.o{display:flex;gap:12px;width:100%;text-align:left;border:2px solid #9DB8AA;background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;font:inherit;color:#0B0D0C;cursor:pointer;line-height:1.4}
.o:hover:not(:disabled){border-color:#007A4E;background:#F2F8F5}.o b{color:#007A4E;min-width:20px}
.o.ok{border-color:#007A4E;background:#D5EEE2}.o.ko{border-color:#C0392B;background:#FBE3E0}.o:disabled{cursor:default;color:#0B0D0C}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;background:#FCF1CC;line-height:1.55}
.fb.n{background:#E3F1EA}.fb ul{margin:6px 0 0;padding-left:22px}.fb .t{font-weight:700;margin-bottom:6px}
.btn{margin-top:18px;background:#007A4E;color:#fff;border:0;border-radius:10px;padding:13px 26px;font:700 18px 'Open Sans',Arial,sans-serif;cursor:pointer}
.btn:hover{background:#00A86C}.sc{font-family:Sora,Arial,sans-serif;font-size:40px;color:#007A4E;margin:10px 0}
.r{padding:10px 0;border-bottom:1px solid #E3F1EA;line-height:1.45}.r span{color:#C0392B;font-weight:700}
</style></head><body><div class="w"><h1>QCM : le contrat de transport</h1><div id="app"></div></div>
<script>
const D=[{"q": "Le contrat de transport est :", "o": ["un contrat réel", "un contrat consensuel", "un contrat administratif", "un contrat unilatéral"], "a": 1, "c": "Le contrat de transport est consensuel : il se forme par le seul accord des parties.", "u": false}, {"q": "Le contrat de transport porte juridiquement sur :", "o": ["un véhicule", "une marchandise", "un envoi", "un trajet"], "a": 2, "c": "Le contrat de transport porte sur l'envoi, c'est-à-dire la marchandise remise au transporteur pour être déplacée.", "u": false}, {"q": "Dans un transport international, la lettre de voiture doit mentionner :", "o": ["les temps de conduite", "les pays d'origine et de destination", "le prix du carburant", "la vitesse moyenne"], "a": 1, "c": "Dans un transport international, la lettre de voiture doit mentionner les pays d'origine et de destination.", "u": false}, {"q": "En l'absence de contrat écrit, la relation de transport est régie par :", "o": ["le Code civil", "les contrats types", "la CMR uniquement", "la convention collective"], "a": 1, "c": "À défaut de contrat écrit, ce sont les contrats types qui s'appliquent.", "u": false}, {"q": "La lettre de voiture est imposée par :", "o": ["le Code des transports", "le Code du travail", "le Code de commerce", "la convention collective"], "a": 2, "c": "Contrairement au bon de livraison simple, elle est régie par le Code de commerce et constitue une preuve irréfutable en cas de litige ou de contrôle routier.<br><br><b>Les 3 rôles majeurs de ce document :</b><ul><li><b>Preuve du contrat</b> : elle atteste de l'accord sur la nature et le prix du transport.</li><li><b>Instruction pour le chauffeur</b> : elle précise les lieux et dates d'enlèvement et de livraison.</li><li><b>Suivi de la marchandise</b> : elle permet de noter les réserves en cas de dommages constatés.</li></ul>", "u": true}, {"q": "La lettre de voiture peut être rédigée par :", "o": ["uniquement le transporteur", "uniquement l'expéditeur", "uniquement le destinataire", "plusieurs parties au contrat"], "a": 3, "c": "<b>La lettre de voiture est-elle obligatoire pour le transport routier ?</b><br>Oui. Son absence à bord du véhicule est passible d'une amende de 1 500 € et d'une immobilisation du camion.<br><br><b>Qui est responsable du remplissage de la lettre de voiture ?</b><br>La responsabilité est partagée :<ul><li>l'expéditeur remplit les informations de chargement et de livraison ;</li><li>le transporteur indique ses informations de licence ;</li><li>le destinataire signe le document à la réception.</li></ul>", "u": true}, {"q": "Le document de suivi sert principalement à :", "o": ["calculer le prix du transport", "suivre l'exécution du contrat", "vérifier les temps de conduite", "assurer la marchandise"], "a": 1, "c": "Le document de suivi sert à suivre l'exécution du contrat de transport.", "u": false}, {"q": "Le destinataire devient partie au contrat de transport :", "o": ["au moment de la livraison", "à la prise en charge", "dès la formation du contrat", "après signature du document de transport"], "a": 2, "c": "Le destinataire devient partie au contrat dès sa formation.", "u": false}, {"q": "La distance de transport est celle :", "o": ["de l'itinéraire le plus court", "de l'itinéraire le moins coûteux", "de l'itinéraire le plus adapté compte tenu notamment de la sécurité et des infrastructures", "imposée par le donneur d'ordre, sans exception"], "a": 2, "c": "La distance de transport est celle de l'itinéraire le plus adapté, compte tenu notamment de la sécurité et des infrastructures, et pas forcément le plus court.", "u": false}, {"q": "La durée maximale d'une plage horaire est de :", "o": ["2 heures", "3 heures", "4 heures", "6 heures"], "a": 2, "c": "La durée maximale d'une plage horaire est de 4 heures.", "u": false}, {"q": "La livraison contre-remboursement :", "o": ["vaut déclaration de valeur", "ne vaut pas déclaration de valeur", "ne peut jamais être prévue dans le contrat", "ne concerne que les envois de moins de 3 tonnes"], "a": 1, "c": "La livraison contre-remboursement ne vaut pas déclaration de valeur.", "u": false}, {"q": "Le « laissé pour compte » désigne :", "o": ["une marchandise perdue pendant le transport", "un envoi détruit par le transporteur", "un envoi refusé par le destinataire et laissé à la disposition du transporteur par le donneur d'ordre", "un colis non identifié au chargement"], "a": 2, "c": "Le laissé pour compte est un envoi refusé par le destinataire et laissé à la disposition du transporteur par le donneur d'ordre.", "u": false}, {"q": "Le donneur d'ordre peut modifier le contrat de transport :", "o": ["uniquement avant la prise en charge", "jusqu'au moment où le destinataire fait valoir ses droits", "jusqu'à la livraison matérielle seulement", "uniquement par acte d'huissier"], "a": 1, "c": "Le donneur d'ordre peut modifier le contrat jusqu'au moment où le destinataire fait valoir ses droits.", "u": false}, {"q": "Le transporteur n'est pas tenu d'accepter de nouvelles instructions :", "o": ["si elles augmentent son prix", "si elles sont orales", "si elles l'empêchent d'honorer des engagements de transport pris antérieurement", "si elles concernent un retour de marchandise"], "a": 2, "c": "Le transporteur peut refuser de nouvelles instructions qui l'empêchent d'honorer des engagements de transport pris antérieurement.", "u": false}, {"q": "Toute modification au contrat entraîne :", "o": ["une suspension du contrat", "un réajustement du prix initial", "la nullité du contrat", "une indemnité automatique au profit du donneur d'ordre"], "a": 1, "c": "Toute modification du contrat entraîne un réajustement du prix initial.", "u": false}, {"q": "Le transporteur doit utiliser :", "o": ["tout véhicule disponible", "un matériel adapté à la marchandise ainsi qu'aux accès et installations préalablement définis", "uniquement un véhicule bâché", "un véhicule choisi par le destinataire"], "a": 1, "c": "Le transporteur doit utiliser un matériel adapté à la marchandise ainsi qu'aux accès et installations préalablement définis.", "u": false}, {"q": "Lorsque l'état apparent de la marchandise ou de l'emballage ne peut pas être raisonnablement vérifié, le transporteur :", "o": ["doit accepter sans réserve", "doit établir une déclaration de valeur", "formule des réserves précises et motivées sur le document de transport", "doit systématiquement refuser la marchandise"], "a": 2, "c": "Le transporteur formule des réserves précises et motivées sur le document de transport.", "u": false}, {"q": "Les réserves prises par le transporteur au moment de la prise en charge n'engagent le donneur d'ordre que si :", "o": ["elles sont validées par le destinataire", "elles sont acceptées expressément sur le document de transport", "elles sont confirmées par lettre recommandée", "elles portent sur le poids uniquement"], "a": 1, "c": "<b>A.</b> Le destinataire n'intervient qu'à la livraison. Son rôle est de prendre des réserves à la réception, pas de valider celles prises au départ.<br><br><b>C.</b> La lettre recommandée est souvent utilisée pour confirmer des réserves après la livraison (litige), mais au moment de la prise en charge, tout se joue sur la lettre de voiture.<br><br><b>D.</b> Les réserves peuvent porter sur tout : l'état apparent de la marchandise, l'emballage, le nombre de colis, et pas seulement le poids.<br><br>À noter : si le donneur d'ordre refuse de signer une réserve alors que le problème est réel, le transporteur peut refuser de prendre en charge la marchandise pour se protéger.", "u": true}, {"q": "Les supports de charge utilisés pour le transport, hors UTI :", "o": ["ne font pas partie de l'envoi", "font partie intégrante de l'envoi", "sont toujours consignés au transporteur", "donnent automatiquement lieu à location"], "a": 1, "c": "UTI : unité de transport intermodal (conteneur, caisse mobile…).", "u": true}, {"q": "Dans le cadre du contrat de transport, les supports de charge (exemple : palettes Europe) :", "o": ["donnent lieu à consignation", "donnent lieu à location au transporteur", "ne donnent lieu ni à consignation ni à location au transporteur", "doivent toujours être repris gratuitement par le transporteur"], "a": 2, "c": "Le transporteur n'est pas propriétaire des supports et n'a pas à payer pour leur utilisation.<ul><li><b>Pas de consignation</b> : le transporteur ne verse pas de caution pour les palettes qu'il transporte.</li><li><b>Pas de location</b> : il ne paie pas de « loyer » pour l'usage des supports durant le trajet.</li></ul>", "u": true}],L="ABCD";let i=0,s=0,miss=[];const app=document.getElementById('app');
function show(){if(i>=D.length)return end();const d=D[i];
app.innerHTML=`<div class="top"><span>Question ${i+1} / ${D.length}</span><span>Score : ${s}</span></div><div class="bar"><i style="width:${i/D.length*100}%"></i></div><p class="q">${d.q}</p>`+d.o.map((t,k)=>`<button class="o" data-k="${k}"><b>${L[k]}.</b><span>${t}</span></button>`).join('')+'<div id="fb"></div>';
app.querySelectorAll('.o').forEach(b=>b.onclick=()=>pick(+b.dataset.k));}
function pick(k){const d=D[i],ok=k==d.a;app.querySelectorAll('.o').forEach((b,j)=>{b.disabled=true;if(j==d.a)b.classList.add('ok');else if(j==k)b.classList.add('ko')});
if(ok)s++;else miss.push(i);
let h='';if(!ok)h=`<div class="fb"><div class="t">Mauvaise réponse</div>La bonne réponse est ${L[d.a]}. ${d.o[d.a]}.<br>${d.c}</div>`;
else if(d.u)h=`<div class="fb n">${d.c}</div>`;
h+=`<button class="btn" id="nx">${i+1<D.length?'Question suivante':'Voir mon score'}</button>`;
document.getElementById('fb').innerHTML=h;document.getElementById('nx').onclick=()=>{i++;show();scrollTo(0,0)};}
function end(){app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><div class="sc">${s} / ${D.length}</div>`+(miss.length?'<p><b>Questions à revoir :</b></p>'+miss.map(m=>`<div class="r"><span>${m+1}.</span> ${D[m].q}<br>Réponse : ${L[D[m].a]}. ${D[m].o[D[m].a]}</div>`).join(''):'<p>Aucune erreur.</p>')+'<button class="btn" onclick="i=0;s=0;miss=[];show()">Recommencer</button>';}
show();
</script></body></html>
