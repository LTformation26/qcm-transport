<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Série 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:6px}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">Attestation capacité · Marchandises +3,5 t</p>
<h1>QCM — 25 questions · série 1</h1>
<p class="lede">Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"Sont amortissables fiscalement en dégressif, entre autres :","o":["Les frais d'établissement","Certains matériels de transport acquis neufs","Les matériels de transport acquis d'occasion","Les immeubles et constructions"],"c":1,"r":"L'amortissement dégressif s'applique aux matériels et outillages neufs (dont certains véhicules neufs). Les biens d'occasion, frais d'établissement et immeubles ne sont pas éligibles."},{"q":"En transport routier intérieur, le délai pour intenter une action récursoire :","o":["Est d'un mois à dater de la livraison","Est d'un mois à dater de l'action principale","S'ajoute au délai de prescription","Annule le délai de prescription"],"c":1,"r":["Action récursoire (ou action en garantie) :","Lorsqu'un intermédiaire est poursuivi en justice par la victime d'un dommage, il a le droit de se retourner contre la personne réellement responsable (le sous-traitant, l'expéditeur ou le garant)."]},{"q":"Selon le contrat type « général », le délai d'acheminement comprend :","o":["Le délai d'enlèvement et le délai de transport","Le délai de transport et le délai de livraison à domicile","Le délai de transport et le délai de livraison au quai de dégroupage","Le délai d'enlèvement, le délai de transport et le délai de livraison à domicile"],"c":1,"r":["Le délai d'acheminement comprend le délai de transport et le délai de livraison à domicile.","Délai de transport : 1 jour par fraction indivisible de 450 kilomètres.","Délai de livraison à destination : 24 heures."]},{"q":"Selon le contrat type « général », les opérations de chargement sont à la charge du donneur d'ordre :","o":["Quel que soit le tonnage","Quel que soit le volume","Pour les envois égaux ou supérieurs à 3 tonnes","Pour les envois inférieurs à 3 tonnes"],"c":2,"r":["Envois de 3 tonnes et plus : le chargement, l'arrimage et le calage incombent au donneur d'ordre (expéditeur), sous sa propre responsabilité.","Envois de moins de 3 tonnes : ces opérations incombent au transporteur."]},{"q":"Dans une SARL, le gérant :","o":["N'a pas obligatoirement la qualité de commerçant","Doit obligatoirement être associé","Ne peut être salarié qu'à condition d'être actionnaire majoritaire","Devient automatiquement commerçant"],"c":0,"r":["Le gérant d'une SARL agit au nom et pour le compte de la société, qui possède la personnalité morale et la qualité de commerçant.","Le gérant n'exécute pas d'actes de commerce en son nom propre : il n'a donc pas la qualité de commerçant."]},{"q":"Dans une opération de transport, le protocole de sécurité, lorsqu'il est obligatoire :","o":["Doit être établi par l'expéditeur concernant les marchandises","Doit être établi entre le transporteur et l'entreprise d'accueil pour le chargement/déchargement","Doit être établi à l'initiative du transporteur","N'est utilisé que dans les entreprises certifiées ISO 9001"],"c":1,"r":["Le protocole de sécurité est établi entre l'entreprise d'accueil (utilisatrice) et l'entreprise de transport.","Il encadre les opérations de chargement ou de déchargement."]},{"q":"En l'absence de représentant du personnel, lors de l'entretien préalable au licenciement, le salarié peut se faire assister par :","o":["Un avocat","Un inspecteur du travail","Un conseiller du salarié inscrit sur une liste officielle","Un conseiller prud'homal"],"c":2,"r":["En l'absence de représentants du personnel, le salarié peut se faire assister :","— soit par une personne de son choix appartenant au personnel de l'entreprise ;","— soit par un conseiller du salarié inscrit sur une liste dressée par le préfet de département."]},{"q":"L'entrepreneur individuel est imposé au titre :","o":["Des prélèvements effectués pour ses besoins personnels","De ses revenus (bénéfices industriels et commerciaux)","De l'impôt sur les sociétés","Des valeurs mobilières de placement"],"c":[1,2],"r":["L'entrepreneur individuel peut opter pour le régime réel de l'impôt sur le revenu (IR, catégorie BIC).","Il peut également décider d'être soumis à l'impôt sur les sociétés (IS).","Les deux régimes (B et C) sont donc valables."]},{"q":"Lors d'une opération d'affrètement en transport intérieur, le commissionnaire doit :","o":["Établir seulement une lettre de voiture","Établir seulement un bordereau de groupage","Établir une lettre de voiture et un bordereau de groupage","Enregistrer ses opérations d'affrètement sur un registre"],"c":3,"r":["Tout commissionnaire de transport qui confie une opération à un tiers (affrètement) doit tenir un registre des opérations d'affrètement.","Chaque opération y est inscrite par ordre chronologique, avec des mentions précises : date, nom du transporteur, prix, nature de la marchandise…"]},{"q":"Le règlement intérieur de l'entreprise contient des dispositions relatives notamment :","o":["À la fixation de la durée du travail","Au respect des consignes en cas d'incendie","Aux dates de fermeture pour congés payés","Au paiement des salaires"],"c":1,"r":["Le règlement intérieur est un document écrit par lequel l'employeur fixe :","— les mesures d'application en matière de santé et de sécurité ;","— les règles générales de discipline."]},{"q":"À l'occasion d'événements familiaux, l'autorisation d'absence du salarié :","o":["N'est, en aucun cas, rémunérée","N'entraîne pas de réduction de la rémunération","S'impute sur le repos compensateur pour heures supplémentaires","N'est pas assimilée à des jours de travail effectif"],"c":1,"r":["Ces jours d'absence pour événements familiaux sont assimilés à du travail effectif","pour la détermination de la durée du congé payé annuel."]},{"q":"Une provision pour grosses réparations sera inscrite au bilan dans les :","o":["Dotations aux amortissements et aux provisions exceptionnelles","Amortissements et provisions","Provisions pour risques et charges","Réserves réglementées"],"c":2,"r":["Dès qu'un risque de perte ou une dépense future est probable et estimable, l'entreprise doit constater une provision.","Le compte de résultat enregistre la dotation comme une charge.","En contrepartie, on crédite le compte « Provisions pour risques et charges » au passif du bilan, jusqu'à la réalisation des travaux."]},{"q":"La location d'un véhicule industriel avec ou sans conducteur donne lieu à l'établissement :","o":["D'une lettre de voiture","D'un bon de livraison","D'une feuille de location ou du contrat de location","D'une lettre de voiture et d'une feuille de location"],"c":2,"r":["Lors d'une location d'un véhicule industriel (avec ou sans conducteur),","le document de bord obligatoire est le contrat de location ou une feuille de location."]},{"q":"Le prix d'un transport public routier de marchandises :","o":["Est fixe et ne peut pas être modifié pendant l'exécution","Peut être modifié par l'une ou l'autre des parties en cas de variation du carburant","Est modifié de plein droit en cas de variation du carburant","Est modifié de plein droit en cas de variation des charges salariales"],"c":2,"r":["Le prix du transport est révisé de plein droit pour couvrir la variation du coût du carburant,","entre la date du contrat et la date de réalisation du transport."]},{"q":"Le fait de convenir d'un délai de paiement supérieur à 30 jours peut générer :","o":["Une amende administrative d'un montant maximum de 75 000 € pour une personne physique","Une contravention","Aucune pénalité","Une amende délictuelle de 40 000 €"],"c":0,"r":["Le dépassement du délai légal de 30 jours est sanctionné par une amende administrative (DGCCRF) :","— 75 000 € pour une personne physique ;","— 2 000 000 € pour une personne morale."]},{"q":"Toute prestation annexe non prévue au contrat qui cause un dommage engage :","o":["La responsabilité du transporteur","La responsabilité de l'entreprise bénéficiaire","La responsabilité du commissionnaire","La responsabilité du conducteur"],"c":1,"r":["Le conducteur ou le transporteur qui exécute une prestation annexe à la demande de l'entreprise bénéficiaire","est réputé agir pour le compte et sous la responsabilité de cette entreprise bénéficiaire (expéditeur ou destinataire)."]},{"q":"Le frein de stationnement d'un véhicule de plus de 3,5 tonnes doit être maintenu par un système :","o":["Pneumatique","Mécanique","Oléo-pneumatique","Hydraulique"],"c":1,"r":["Le frein de stationnement doit être maintenu par un dispositif mécanique.","Les systèmes pneumatique ou hydraulique reposent sur des fluides sous pression, avec un risque de fuite lente : ils ne garantissent pas le maintien à l'arrêt."]},{"q":"L'intervalle entre deux visites médicales pour proroger le permis C(E) d'un conducteur de 55 ans est de :","o":["1 an","2 ans","4 ans","5 ans"],"c":3,"r":["Renouvellement de la visite médicale du permis C(E) :","— tous les 5 ans avant 60 ans ;","— tous les 2 ans de 60 à 76 ans ;","— tous les ans au-delà de 76 ans."]},{"q":"Selon le règlement (CE) n° 561/2006, le repos hebdomadaire doit être pris après au maximum :","o":["4 périodes de 24h","5 périodes de 24h","6 périodes de 24h","7 périodes de 24h"],"c":2,"r":["Un temps de repos hebdomadaire doit commencer au plus tard à la fin de six périodes de 24 heures,","à compter de la fin du repos hebdomadaire précédent."]},{"q":"En transport national, un destinataire constate des avaries le jour de la livraison. La durée de prescription de son action est de :","o":["6 mois","1 an","2 ans","3 ans"],"c":1,"r":"En transport intérieur, la prescription est d'1 an à compter de la livraison (art. L133-6 Code de commerce)."},{"q":"Les entretiens et réparations du matériel de bureau entrent dans les charges :","o":["Variables au kilomètre","Variables annuelles","Fixes du véhicule","De structure"],"c":3,"r":"Le matériel de bureau n'est pas lié aux véhicules. Son entretien constitue une charge de structure (frais généraux de l'entreprise)."},{"q":"Le président d'une SAS :","o":["Est toujours une personne morale","Est obligatoirement un associé de la SAS","Est toujours désigné par un conseil d'administration","Peut être une personne physique ou morale"],"c":3,"r":["Le président d'une SAS peut être une personne physique ou une personne morale, associée ou non."]},{"q":"La 44ème heure de travail hebdomadaire pour un conducteur routier de marchandises est majorée de :","o":["25%","33%","50%","75%"],"c":2,"r":["Pour un conducteur longue distance :","— de la 36e à la 43e heure : heures d'équivalence, majorées à 25 % ;","— à partir de la 44e heure : heures supplémentaires, majorées à 50 %."]},{"q":"Lors d'un transport routier Paris-Rome, la marchandise est considérée comme perdue si elle n'a pas été livrée dans les :","o":["15 jours suivant l'expiration du délai convenu","30 jours suivant l'expiration du délai convenu","35 jours suivant l'expiration du délai convenu","60 jours suivant l'expiration du délai convenu"],"c":1,"r":"En CMR (art. 20), la marchandise est réputée perdue 30 jours après l'expiration du délai convenu."},{"q":"Suite à un transport France-Allemagne, un trafic intérieur allemand vous est proposé. Vous pouvez l'effectuer à l'aide d'une :","o":["Autorisation de cabotage délivrée par la France","Autorisation de cabotage délivrée par l'Allemagne","Autorisation CEMT","Copie certifiée conforme de votre licence communautaire"],"c":3,"r":["Règles du cabotage à respecter :","1) avoir réalisé et entièrement déchargé le transport international préalable (CMR) ;","2) effectuer au maximum 3 opérations de cabotage en 7 jours ;","3) conserver à bord les lettres de voiture justifiant du transport international entrant et de chaque cabotage."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent — tu es prêt.";else if(pct>=60)m="Bien — quelques points à consolider.";else if(pct>=40)m="À retravailler avant l'examen.";else m="Reprends les explications, question par question.";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(q.r){const rule=document.createElement('div');rule.className='rule';const tag=document.createElement('span');tag.className='tag';tag.textContent='Explication';rule.appendChild(tag);(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
