<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM – Transport aérien | Série 2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
  :root { --green-dark: #1a5c38; --green-mid: #2e7d52; --green-light: #e8f5ee; --green-accent: #2ecc71; --red: #c0392b; --red-light: #fdecea; --grey-bg: #f4f4f2; --grey-border: #ddd; --text: #1c1c1c; --white: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--grey-bg); color: var(--text); min-height: 100vh; }
  header { background: var(--green-dark); color: var(--white); padding: 22px 36px 18px; border-bottom: 4px solid var(--green-accent); }
  header .label { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--green-accent); margin-bottom:5px; }
  header h1 { font-family:'Barlow Condensed',sans-serif; font-size:23px; font-weight:700; }
  header .meta { margin-top:6px; font-size:12px; color:rgba(255,255,255,0.6); }
  .progress-wrap { background: var(--green-dark); padding: 12px 36px; display:flex; align-items:center; gap:14px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .progress-track { flex:1; background:rgba(255,255,255,0.15); border-radius:4px; height:5px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--green-accent); border-radius:4px; transition:width 0.4s ease; }
  .progress-label { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:rgba(255,255,255,0.8); white-space:nowrap; min-width:70px; text-align:right; }
  .container { max-width:740px; margin:36px auto; padding:0 20px 60px; }
  .card { background:var(--white); border-radius:12px; border:1px solid var(--grey-border); padding:32px 36px; box-shadow:0 2px 12px rgba(0,0,0,0.06); animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .q-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .q-badge { background:var(--green-dark); color:var(--white); font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; padding:3px 11px; border-radius:5px; }
  .q-pts { font-size:12px; color:#999; }
  .q-text { font-size:16px; font-weight:600; line-height:1.5; margin-bottom:22px; color:var(--text); }
  .choices { display:flex; flex-direction:column; gap:9px; }
  .choice-label { display:flex; align-items:flex-start; gap:12px; padding:11px 15px; border:1.5px solid var(--grey-border); border-radius:8px; cursor:pointer; font-size:14.5px; transition:border-color 0.15s, background 0.15s; line-height:1.4; }
  .choice-label:hover:not(.locked) { border-color:var(--green-mid); background:var(--green-light); }
  .choice-label input { display:none; }
  .choice-letter { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; color:var(--green-dark); background:var(--green-light); border-radius:4px; padding:2px 8px; flex-shrink:0; margin-top:1px; }
  .choice-label.selected { border-color:var(--green-dark); background:var(--green-light); }
  .choice-label.correct { border-color:var(--green-accent); background:#eafaf1; }
  .choice-label.wrong { border-color:var(--red); background:var(--red-light); }
  .choice-label.correct .choice-letter { background:#c3efda; color:#1a7a3f; }
  .choice-label.wrong .choice-letter { background:#fadbd8; color:var(--red); }
  .feedback-box { display:none; margin-top:18px; padding:14px 16px; border-radius:8px; font-size:13.5px; line-height:1.55; }
  .feedback-box.ok { background:#eafaf1; border-left:4px solid var(--green-accent); color:#1a5c38; }
  .feedback-box.ko { background:var(--red-light); border-left:4px solid var(--red); color:#8b1a1a; }
  .feedback-box .fb-verdict { font-weight:700; font-size:14px; margin-bottom:5px; }
  .feedback-box .fb-comment { color:#333; }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; }
  .btn { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:none; border-radius:7px; padding:11px 22px; cursor:pointer; transition:background 0.2s, opacity 0.2s; }
  .btn-prev { background:#e8e8e4; color:#555; } .btn-prev:hover { background:#d5d5ce; }
  .btn-validate { background:var(--green-dark); color:var(--white); flex:1; } .btn-validate:hover { background:var(--green-mid); } .btn-validate:disabled { opacity:0.45; cursor:not-allowed; }
  .btn-next { background:var(--green-dark); color:var(--white); } .btn-next:hover { background:var(--green-mid); }
  .score-card { display:none; background:var(--green-dark); color:var(--white); border-radius:12px; padding:40px 36px; text-align:center; box-shadow:0 4px 20px rgba(26,92,56,0.2); }
  .score-card .big { font-family:'Barlow Condensed',sans-serif; font-size:72px; font-weight:700; color:var(--green-accent); line-height:1; }
  .score-card .sub { font-size:14px; color:rgba(255,255,255,0.65); margin-top:6px; }
  .score-card .mention { font-size:18px; font-weight:600; margin-top:18px; }
  .score-card .detail { margin-top:10px; font-size:13px; color:rgba(255,255,255,0.6); }
  .btn-restart { margin-top:22px; background:transparent; border:2px solid rgba(255,255,255,0.35); color:var(--white); font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:1px; text-transform:uppercase; padding:10px 26px; border-radius:7px; cursor:pointer; }
  .btn-restart:hover { border-color:var(--green-accent); color:var(--green-accent); }
  @media(max-width:600px){ header { padding:18px 16px 14px; } header h1 { font-size:19px; } .progress-wrap { padding:10px 16px; } .container { padding:0 12px 48px; } .card { padding:22px 18px; } .q-text { font-size:15px; } .choice-label { font-size:13.5px; } }
</style>
</head>
<body>
<header>
  <div class="label">Capacité de Transport de Marchandises +3,5t</div>
  <h1>Transport aérien — Série 2</h1>
  <div class="meta">20 questions · 2 points chacune · Score max : 40 points</div>
</header>
<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20</div>
</div>
<div class="container">
  <div class="card" id="mainCard">
    <div class="q-meta"><span class="q-badge" id="qBadge">Q1</span><span class="q-pts">2 points</span></div>
    <div class="q-text" id="qText"></div>
    <div class="choices" id="choicesContainer"></div>
    <div class="feedback-box" id="feedbackBox"><div class="fb-verdict" id="fbVerdict"></div><div class="fb-comment" id="fbComment"></div></div>
    <div class="nav">
      <button class="btn btn-prev" id="btnPrev" onclick="goTo(current-1)">← Précédent</button>
      <button class="btn btn-validate" id="btnValidate" onclick="validateAnswer()">Valider</button>
      <button class="btn btn-next" id="btnNext" onclick="goTo(current+1)" style="display:none">Suivant →</button>
    </div>
  </div>
  <div class="score-card" id="scoreCard">
    <div class="big" id="scoreBig"></div>
    <div class="sub">points sur 40</div>
    <div class="mention" id="scoreMention"></div>
    <div class="detail" id="scoreDetail"></div>
    <button class="btn-restart" onclick="restart()">Recommencer</button>
  </div>
</div>
<script>
const rawQuestions = [
  { q: "La limite d'indemnisation fixée par la Convention de Varsovie est de :", choices: [{ text: "22 DTS par kg", correct: false },{ text: "16,5837 DTS par kg", correct: true },{ text: "17 DTS par kg", correct: false },{ text: "25 DTS par kg", correct: false }], comment: "La Convention de Varsovie fixe la limite à <strong>16,5837 DTS/kg</strong>. La Convention de Montréal prévoit 22 DTS/kg (après révision ICAO 2019). Ces plafonds peuvent être écartés en cas de faute inexcusable du transporteur." },
  { q: "Le rôle principal de la LTA est de :", choices: [{ text: "Assurer la marchandise durant le transport", correct: false },{ text: "Déterminer le prix du fret aérien", correct: false },{ text: "Servir de preuve du contrat de transport et accompagner la marchandise", correct: true },{ text: "Remplacer la déclaration en douane", correct: false }], comment: "La LTA remplit deux rôles principaux : elle est la <strong>preuve du contrat de transport</strong> et le <strong>document qui accompagne la marchandise</strong>. Son absence n'affecte pas la validité du contrat lui-même." },
  { q: "Selon la règle IATA, le rapport poids/volume est de :", choices: [{ text: "1 tonne = 6 m³", correct: true },{ text: "1 tonne = 5 m³", correct: false },{ text: "1 tonne = 7 m³", correct: false },{ text: "1 tonne = 10 m³", correct: false }], comment: "La règle IATA établit que <strong>1 tonne = 6 m³</strong> (ou 6 dm³ = 1 kg). Cette règle est issue des capacités réelles des soutes : un appareil de 100 tonnes dispose d'environ 600 m³ de volume utile." },
  { q: "Le post et le préacheminement terrestres des marchandises (entre aéroport et destination finale) sont soumis au régime juridique :", choices: [{ text: "De la Convention de Montréal", correct: false },{ text: "De la Convention de Varsovie", correct: false },{ text: "Du Code de l'Aviation Civile", correct: false },{ text: "Du transport terrestre (contrat-type, Convention de Genève)", correct: true }], comment: "Les trajets terrestres effectués sur instructions du donneur d'ordres relèvent du <strong>régime juridique du transport terrestre</strong> (contrat-type, Convention de Genève), et non du transport aérien, même s'ils sont effectués dans le cadre d'un contrat de transport aérien." },
  { q: "La H AWB est acceptée par les banques dans le cadre d'un crédit documentaire si :", choices: [{ text: "Elle est signée par le transporteur aérien", correct: false },{ text: "Elle est conforme à l'article 23 des RUU 600", correct: true },{ text: "Elle est accompagnée d'un M AWB", correct: false },{ text: "Elle mentionne le numéro de vol", correct: false }], comment: "La LTA domestique (HAWB) est acceptée par les banques émettrices d'un crédit documentaire si elle est conforme à <strong>l'article 23 des RUU 600</strong> (Règles et Usances Uniformes relatives aux crédits documentaires, version 2007)." },
  { q: "Un envoi de 10 colis de dimensions 54 × 50 × 40 cm et de 12 kg chacun a un poids taxable de :", choices: [{ text: "120 kg", correct: false },{ text: "150 kg", correct: false },{ text: "180 kg", correct: true },{ text: "200 kg", correct: false }], comment: "Volume = 54 × 50 × 40 × 10 = 1 080 000 cm³. Poids volumétrique = 1 080 000 ÷ 6 000 = <strong>180 kg</strong>. Poids réel = 120 kg. Le poids taxable est le plus élevé des deux : 180 kg." },
  { q: "Selon la Convention de Varsovie, le transporteur peut s'exonérer s'il prouve :", choices: [{ text: "Qu'il a pris toutes les mesures nécessaires pour éviter le dommage ou qu'il était dans l'impossibilité de les prendre", correct: true },{ text: "Que la marchandise était insuffisamment assurée", correct: false },{ text: "Que le destinataire n'était pas présent à la livraison", correct: false },{ text: "Que le fret n'avait pas été payé", correct: false }], comment: "Sous la Convention de Varsovie, le transporteur peut s'exonérer s'il établit qu'il a <strong>pris toutes les mesures nécessaires</strong> pour éviter le dommage, ou s'il prouve la <strong>faute de la personne lésée</strong>. La Convention de Montréal prévoit des cas d'exonération plus détaillés." },
  { q: "Si le transporteur remplace le mode de transport convenu sans l'accord de l'expéditeur, selon la Convention de Montréal :", choices: [{ text: "Le contrat est automatiquement nul", correct: false },{ text: "Le transporteur est exonéré de toute responsabilité", correct: false },{ text: "Les règles du transport terrestre s'appliquent", correct: false },{ text: "Ce transport est réputé faire partie de la période du transport aérien", correct: true }], comment: "La Convention de Montréal prévoit que si le transporteur remplace en totalité ou en partie le transport convenu, <strong>sans le consentement de l'expéditeur</strong>, par un autre mode de transport, ce transport est considéré comme faisant partie de la période du transport aérien." },
  { q: "Le tarif GCR (General Cargo Rate) est généralement établi par :", choices: [{ text: "La valeur déclarée de la marchandise", correct: false },{ text: "Tranches de poids avec un minimum de perception", correct: true },{ text: "La distance en kilomètres entre aéroports", correct: false },{ text: "La nature des marchandises transportées", correct: false }], comment: "Le GCR est indépendant de la nature des marchandises et est établi par <strong>tranches de poids</strong> avec un minimum de perception : < 45 kg, 45-100 kg, 100-300 kg, 300-500 kg, 500 kg-1 t, > 1 t." },
  { q: "Les ULD (Unit Load Device) désignent :", choices: [{ text: "Les documents d'accompagnement obligatoires de la marchandise", correct: false },{ text: "Les assurances spécifiques au fret aérien", correct: false },{ text: "Des conteneurs, igloos ou palettes utilisés comme unités de chargement standardisées", correct: true },{ text: "Les taxes gouvernementales appliquées au fret aérien", correct: false }], comment: "Les ULD (Unit Load Device) sont des <strong>unités de chargement standardisées</strong> utilisées en transport aérien : conteneurs, igloos et palettes. Ils permettent d'optimiser le chargement en soute et donnent lieu à des tarifs forfaitaires." },
  { q: "Parmi les cas d'exonération prévus par la Convention de Montréal, lequel n'en fait PAS partie :", choices: [{ text: "La faute de la victime", correct: false },{ text: "Un emballage défectueux", correct: false },{ text: "Un fait de guerre", correct: false },{ text: "La faillite de la compagnie aérienne", correct: true }], comment: "La Convention de Montréal prévoit 6 cas d'exonération : mesures nécessaires prises, faute de la victime, nature/vice propre de la marchandise, emballage défectueux, fait de guerre, acte de l'autorité publique. <strong>La faillite n'en fait pas partie</strong>." },
  { q: "Lorsque le tarif d'une tranche de poids supérieure est moins élevé que le tarif calculé pour le poids réel, la compagnie :", choices: [{ text: "Facture au tarif de la tranche supérieure (règle du payant pour)", correct: true },{ text: "Facture obligatoirement au poids réel", correct: false },{ text: "Applique la moyenne des deux tarifs", correct: false },{ text: "Laisse systématiquement le choix au client", correct: false }], comment: "C'est la <strong>règle du « payant pour »</strong> : la compagnie applique le tarif le plus avantageux pour le client. Exemple : 430 kg facturés au tarif 500 kg → 500 × 1,60 € = 800 € au lieu de 430 × 1,90 € = 817 €." },
  { q: "La possibilité de dématérialiser la LTA sous forme d'e-AWB est prévue par :", choices: [{ text: "La Convention de Varsovie", correct: false },{ text: "La Convention de Montréal", correct: true },{ text: "Le Code de l'Aviation Civile uniquement", correct: false },{ text: "Les RUU 600", correct: false }], comment: "La <strong>Convention de Montréal</strong> (en vigueur depuis 2003) précise explicitement la possibilité de dématérialiser le document papier sous forme d'e-AWB (electronic Air Waybill). Cette dématérialisation est aujourd'hui largement répandue." },
  { q: "Un envoi de 20 kg avec un tarif de 2,50 €/kg et un minimum de perception de 90 € sera facturé :", choices: [{ text: "50 €", correct: false },{ text: "70 €", correct: false },{ text: "90 €", correct: true },{ text: "100 €", correct: false }], comment: "20 × 2,50 € = 50 €. Or 50 € est inférieur au minimum de perception (90 €). La compagnie facture donc le <strong>minimum de perception : 90 €</strong>, qui représente le seuil de rentabilité minimal pour cette destination." },
  { q: "En transport aérien, le prix du fret est calculé :", choices: [{ text: "Du lieu d'expédition initial au lieu de livraison finale", correct: false },{ text: "Du lieu de chargement initial à l'aéroport de destination", correct: false },{ text: "De port maritime à port maritime", correct: false },{ text: "D'aéroport de départ à aéroport de destination", correct: true }], comment: "Le prix du transport aérien est calculé <strong>d'aéroport de départ à aéroport de destination</strong>. Les pré et post-acheminements terrestres sont facturés séparément selon les règles du transport terrestre." },
  { q: "Le transporteur aérien est responsable des pertes, avaries et retards survenus :", choices: [{ text: "Pendant la période où la marchandise était sous sa garde", correct: true },{ text: "Uniquement lors du chargement et du déchargement de l'aéronef", correct: false },{ text: "Dès la conclusion du contrat de transport", correct: false },{ text: "À partir de l'émission de la LTA uniquement", correct: false }], comment: "Le transporteur est responsable des dommages survenus <strong>pendant la période où la marchandise était sous sa garde</strong>, c'est-à-dire depuis la prise en charge jusqu'à la livraison au destinataire ou à son représentant." },
  { q: "En cas de port dû (collect), la valeur de la marchandise doit être :", choices: [{ text: "Inférieure au prix du transport", correct: false },{ text: "Supérieure au prix du transport", correct: true },{ text: "Égale au prix du transport", correct: false },{ text: "Sans rapport avec le prix du transport", correct: false }], comment: "En port dû (collect), la marchandise voyage aux frais du destinataire. La valeur de la marchandise doit être <strong>supérieure au prix du transport</strong> pour garantir que le destinataire acceptera la marchandise et réglera le fret au transporteur." },
  { q: "Le groupeur aérien établit pour l'ensemble du lot de groupage :", choices: [{ text: "Une M AWB par envoi individuel", correct: false },{ text: "Une H AWB unique pour tout le lot", correct: false },{ text: "Un bordereau récapitulatif (packing list / manifeste cargo)", correct: true },{ text: "Une déclaration d'intérêts à la livraison", correct: false }], comment: "Le groupeur aérien établit un <strong>bordereau récapitulatif des envois (packing list / manifeste cargo)</strong> pour l'ensemble du lot de groupage. Ce document accompagne la M AWB émise par le transporteur pour l'acheminement global." },
  { q: "La limite d'indemnisation pour retard en transport aérien est :", choices: [{ text: "La moitié de la limite applicable pour les dommages matériels", correct: false },{ text: "Le double de la limite pour les dommages matériels", correct: false },{ text: "Plafonnée à 500 € quelles que soient les circonstances", correct: false },{ text: "Identique à la limite applicable pour les pertes et avaries", correct: true }], comment: "Selon les Conventions, la limite d'indemnisation pour retard est <strong>identique à celle applicable pour les pertes et avaries</strong>. Elle peut être dépassée si l'expéditeur a souscrit une déclaration d'intérêts spéciale à la livraison." },
  { q: "La LTA est rédigée sous la responsabilité de :", choices: [{ text: "L'expéditeur (donneur d'ordre)", correct: true },{ text: "Le destinataire final", correct: false },{ text: "L'agent du transporteur", correct: false },{ text: "Le transporteur aérien", correct: false }], comment: "La LTA est rédigée sous la <strong>responsabilité de l'expéditeur (donneur d'ordre)</strong>. C'est lui qui fournit les informations nécessaires à son établissement et qui assume les conséquences d'une rédaction incorrecte ou incomplète." }
];
const letters = ['A','B','C','D'];
let shuffled = [], current = 0, answers = [], validated = [];
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function init() { shuffled=rawQuestions.map(q=>{const mixed=shuffle(q.choices);const correctIdx=mixed.findIndex(c=>c.correct);return{q:q.q,choices:mixed,correctIdx,comment:q.comment};}); answers=new Array(shuffled.length).fill(null); validated=new Array(shuffled.length).fill(false); current=0; render(); }
function render() { const item=shuffled[current]; document.getElementById('qBadge').textContent=`Q${current+1}`; document.getElementById('qText').textContent=item.q; const container=document.getElementById('choicesContainer'); container.innerHTML=''; item.choices.forEach((c,j)=>{ const label=document.createElement('label'); label.className='choice-label'+(validated[current]?' locked':''); if(validated[current]){if(j===item.correctIdx)label.classList.add('correct');else if(j===answers[current]&&answers[current]!==item.correctIdx)label.classList.add('wrong');}else if(answers[current]===j){label.classList.add('selected');} label.innerHTML=`<input type="radio" name="choice" value="${j}"><span class="choice-letter">${letters[j]}</span><span>${c.text}</span>`; if(!validated[current]){label.addEventListener('click',()=>selectChoice(j));} container.appendChild(label);}); const fb=document.getElementById('feedbackBox'); if(validated[current]){const correct=answers[current]===item.correctIdx; fb.style.display='block'; fb.className='feedback-box '+(correct?'ok':'ko'); document.getElementById('fbVerdict').innerHTML=correct?`✓ Bonne réponse — ${letters[item.correctIdx]}`:`✗ Mauvaise réponse — La bonne réponse était : <strong>${letters[item.correctIdx]}</strong>`; document.getElementById('fbComment').innerHTML=item.comment;}else{fb.style.display='none';} const btnValidate=document.getElementById('btnValidate'); const btnNext=document.getElementById('btnNext'); const btnPrev=document.getElementById('btnPrev'); if(validated[current]){btnValidate.style.display='none';btnNext.style.display='block';btnNext.textContent=current<shuffled.length-1?'Suivant →':'Voir le score';}else{btnValidate.style.display='block';btnValidate.disabled=answers[current]===null;btnNext.style.display='none';} btnPrev.style.display=current>0?'block':'none'; updateProgress(); }
function selectChoice(j){if(validated[current])return;answers[current]=j;render();}
function validateAnswer(){if(answers[current]===null)return;validated[current]=true;render();}
function goTo(idx){if(idx<0)return;if(idx>=shuffled.length){showScore();return;}current=idx;render();}
function updateProgress(){const done=validated.filter(Boolean).length;document.getElementById('progressFill').style.width=(done/shuffled.length*100)+'%';document.getElementById('progressLabel').textContent=`${done} / ${shuffled.length}`;}
function showScore(){let score=0;shuffled.forEach((item,i)=>{if(validated[i]&&answers[i]===item.correctIdx)score+=2;});document.getElementById('mainCard').style.display='none';const sc=document.getElementById('scoreCard');sc.style.display='block';document.getElementById('scoreBig').textContent=score;const pct=Math.round(score/40*100);document.getElementById('scoreDetail').textContent=`${pct} % de bonnes réponses`;let mention='';if(score>=36)mention='🏆 Excellent — Maîtrise parfaite !';else if(score>=28)mention='✅ Bon niveau — Continue ainsi !';else if(score>=20)mention='📘 Passable — Quelques révisions s\'imposent.';else mention='⚠️ Insuffisant — Relis le chapitre attentivement.';document.getElementById('scoreMention').textContent=mention;sc.scrollIntoView({behavior:'smooth',block:'center'});}
function restart(){document.getElementById('scoreCard').style.display='none';document.getElementById('mainCard').style.display='block';init();window.scrollTo({top:0,behavior:'smooth'});}
init();
</script>
</body>
</html>
