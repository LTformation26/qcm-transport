<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM Amortissement dégressif</title>
<style>
  :root { --texte:#0F2A1D; --sapin:#095228; --rouge:#C62828; --vert-ok:#1e7d45; --fond-ok:#e7f4ec; --fond-ko:#fbeaea; --filet:#cfd8d2; --gris:#5d6f64; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--texte); font-family: Verdana, "DejaVu Sans", sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 30px; }
  header { display:flex; align-items:center; gap:14px; border-bottom: 3px solid var(--sapin); padding-bottom: 12px; margin-bottom: 18px; }
  header img { width: 52px; height: auto; }
  header .marque { font-size: 13px; color: var(--gris); letter-spacing: .5px; }
  header h1 { margin: 0; font-size: 22px; color: var(--sapin); line-height:1.2; }
  .progres { display:flex; justify-content:space-between; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: #e3e9e5; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .barre div { height: 100%; width: 0; background: var(--sapin); transition: width .3s; }
  .question { font-size: 19px; font-weight: bold; margin: 0 0 18px; white-space: pre-line; }
  .question::after { content:""; display:block; width:48px; border-top: 3px solid var(--rouge); margin-top: 10px; }
  .choix { display:flex; flex-direction:column; gap: 10px; }
  .choix button { text-align:left; font: inherit; color: var(--texte); background:#fff; border: 1.5px solid var(--filet); border-radius: 8px; padding: 13px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .choix button:hover:not(:disabled) { border-color: var(--sapin); }
  .choix button .l { font-weight:bold; color: var(--sapin); min-width: 20px; }
  .choix button:disabled { cursor: default; }
  .choix button.ok { background: var(--fond-ok); border-color: var(--vert-ok); }
  .choix button.ko { background: var(--fond-ko); border-color: var(--rouge); }
  .retour { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--sapin); display:none; }
  .retour.ko { border-left-color: var(--rouge); }
  .retour .exp { white-space: pre-line; }
  .retour .titre { font-weight: bold; color: var(--rouge); }
  .retour .titre:empty { display: none; }
  .retour.okk .titre { color: var(--vert-ok); }
  .retour.ko .titre { color: var(--rouge); }
  .actions { margin-top: 22px; text-align: right; }
  .btn { font: inherit; font-weight: bold; background: var(--sapin); color:#fff; border: none; border-radius: 8px; padding: 12px 24px; cursor:pointer; }
  .btn:hover { background: #0b6a32; }
  .btn[hidden] { display:none; }
  .resultat { text-align:center; padding-top: 10px; }
  .resultat .score { font-size: 56px; font-weight: bold; color: var(--sapin); line-height:1.1; }
  .resultat .sur { color: var(--gris); margin-bottom: 14px; }
  .resultat .msg { font-size: 18px; margin-bottom: 22px; }
  @media (max-width: 520px) { body { font-size: 16px; } .question { font-size: 17px; } header h1 { font-size: 19px; } }
</style>
</head>
<body>

    <div><div class="marque">Kaply Academy · Gestion financière</div><h1>QCM Amortissement dégressif</h1></div>
  </header>
  <div id="zone"></div>
</div>
<script>
const QUESTIONS = [
  { q: "En amortissement dégressif, le taux s'applique chaque année sur :",
    r: ["la valeur d'origine du bien","la valeur nette comptable en début d'exercice","le prix de revente estimé","l'annuité de l'année précédente"], b: 1,
    e: "Le taux dégressif s'applique chaque année à la valeur nette comptable (valeur résiduelle) du bien en début d'exercice.", u: false },
  { q: "Pour un bien amorti sur 4 ans, le coefficient dégressif est de :",
    r: ["1,25","1,50","1,75","2,25"], b: 0,
    e: "Coefficient 1,25 pour une durée de 3 ou 4 ans.", u: false },
  { q: "Pour un bien amorti sur 6 ans, le coefficient dégressif est de :",
    r: ["1,25","1,50","1,75","2,25"], b: 2,
    e: "Coefficient 1,75 pour une durée de 5 ou 6 ans.", u: false },
  { q: "Pour un bien amorti sur 8 ans, le coefficient dégressif est de :",
    r: ["1,25","1,75","2,00","2,25"], b: 3,
    e: "Coefficient 2,25 pour une durée supérieure à 6 ans.", u: false },
  { q: "Un tracteur routier neuf est amorti en dégressif sur 5 ans. Le taux dégressif est de :",
    r: ["20 %","25 %","35 %","45 %"], b: 2,
    e: "Taux linéaire : 100 ÷ 5 = 20 %\nTaux dégressif : 20 % × 1,75 = 35 %", u: true },
  { q: "Un matériel neuf est amorti en dégressif sur 8 ans. Le taux dégressif est de :",
    r: ["22,50 %","25,00 %","28,13 %","30,00 %"], b: 2,
    e: "Taux linéaire : 100 ÷ 8 = 12,50 %\nTaux dégressif : 12,50 % × 2,25 = 28,13 %", u: true },
  { q: "Quel bien ne peut pas être amorti en dégressif ?",
    r: ["un tracteur routier neuf","une semi-remorque neuve","un chariot élévateur neuf","un tracteur routier d'occasion"], b: 3,
    e: "Les biens d'occasion sont exclus de l'amortissement dégressif : il est réservé aux biens neufs.", u: false },
  { q: "Pour être amorti en dégressif, un bien doit avoir une durée d'utilisation d'au moins :",
    r: ["1 an","2 ans","3 ans","5 ans"], b: 2,
    e: "Le dégressif est réservé aux biens neufs dont la durée normale d'utilisation est au moins égale à 3 ans.", u: false },
  { q: "En dégressif, la première annuité est calculée au prorata :",
    r: ["en jours, à partir de la date de mise en service","en mois, à partir du premier jour du mois d'acquisition","en jours, à partir de la date d'acquisition","en mois, à partir du mois suivant la mise en service"], b: 1,
    e: "En dégressif, le prorata se calcule en mois entiers : le mois d'acquisition compte pour un mois complet.", u: true },
  { q: "En linéaire, le prorata temporis de la première année part :",
    r: ["du premier jour du mois d'acquisition","de la date de la facture","de la date de mise en service, au jour près","du premier jour de l'exercice"], b: 2,
    e: "En linéaire, on part de la date de mise en service, au jour près (mois de 30 jours, année de 360 jours).", u: true },
  { q: "Un bien est acquis le 20 avril N (clôture au 31 décembre). En dégressif, combien de mois retient-on pour l'année N ?",
    r: ["8 mois","8,33 mois","9 mois","10 mois"], b: 2,
    e: "D'avril à décembre : 9 mois. Le mois d'acquisition compte en entier.", u: true },
  { q: "Un camion porteur neuf de 80 000 € HT est acquis le 20 avril N et mis en service le 5 mai N. Il est amorti en dégressif sur 4 ans. Quelle est l'annuité de l'année N ?",
    r: ["15 000,00 €","16 666,67 €","18 750,00 €","25 000,00 €"], b: 2,
    e: "Taux : 25 % × 1,25 = 31,25 %\nMois retenus : d'avril à décembre = 9 mois (mois d'acquisition)\n80 000,00 × 31,25 % × 9 ÷ 12 = 18 750,00 €", u: true },
  { q: "Un tracteur routier neuf de 100 000 € HT est acquis le 10 janvier N. Il est amorti en dégressif sur 5 ans. Quelle est l'annuité de l'année N ?",
    r: ["20 000,00 €","33 541,67 €","35 000,00 €","17 500,00 €"], b: 2,
    e: "Taux : 20 % × 1,75 = 35 %\nJanvier à décembre : 12 mois\n100 000,00 × 35 % = 35 000,00 €", u: true },
  { q: "On passe du dégressif au linéaire lorsque :",
    r: ["la VNC devient inférieure à la moitié de la valeur d'origine","l'annuité linéaire (VNC ÷ années restantes) devient supérieure ou égale à l'annuité dégressive","on arrive à la dernière année","le taux dégressif devient inférieur au taux linéaire d'origine"], b: 1,
    e: "Chaque année, on compare l'annuité dégressive à l'annuité linéaire calculée sur la VNC et les années restantes. Dès que la linéaire est supérieure ou égale, on bascule.", u: true },
  { q: "Par rapport au linéaire, l'amortissement dégressif permet :",
    r: ["de payer moins d'impôt sur toute la durée","de constater des charges plus élevées les premières années","d'amortir un montant total plus élevé","d'éviter l'amortissement la dernière année"], b: 1,
    e: "Les annuités sont plus fortes au début : le résultat, donc l'impôt, est réduit les premières années. Le montant total amorti reste le même.", u: true }
];
const POINTS = 2, LETTRES = ["A","B","C","D"];
let ordre = [], i = 0, score = 0;
const zone = document.getElementById("zone");

function melange(t) { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; }

function demarrer() {
  ordre = melange(QUESTIONS.map((q, k) => {
    const idx = melange([0, 1, 2, 3]);
    return { q: q.q, e: q.e, u: q.u, r: idx.map(n => q.r[n]), b: idx.indexOf(q.b) };
  }));
  i = 0; score = 0; afficher();
}

function afficher() {
  const Q = ordre[i], n = ordre.length;
  zone.innerHTML = `
    <div class="progres"><span>Question ${i + 1} / ${n}</span><span>${score} / ${n * POINTS} points</span></div>
    <div class="barre"><div style="width:${(i / n) * 100}%"></div></div>
    <p class="question"></p>
    <div class="choix"></div>
    <div class="retour"><div class="titre"></div><div class="exp"></div></div>
    <div class="actions"><button class="btn" id="suivant" hidden>${i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button></div>`;
  zone.querySelector(".question").textContent = Q.q;
  const choix = zone.querySelector(".choix");
  Q.r.forEach((txt, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="l">${LETTRES[k]}.</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => repondre(k);
    choix.appendChild(b);
  });
}

function repondre(k) {
  const Q = ordre[i], btns = zone.querySelectorAll(".choix button"), ret = zone.querySelector(".retour");
  btns.forEach(b => b.disabled = true);
  btns[Q.b].classList.add("ok");
  if (k === Q.b) {
    score += POINTS;
    ret.className = "retour okk";
  } else {
    btns[k].classList.add("ko");
    ret.className = "retour ko";
  }
  const faux = (k !== Q.b);
  ret.querySelector(".titre").textContent = faux ? "Mauvaise réponse" : "";
  ret.querySelector(".exp").textContent = Q.e;
  if (faux || Q.u) ret.style.display = "block";
  zone.querySelector(".progres span:last-child").textContent = `${score} / ${ordre.length * POINTS} points`;
  const s = document.getElementById("suivant");
  s.hidden = false;
  s.onclick = () => { i++; i < ordre.length ? afficher() : resultat(); };
}

function resultat() {
  const total = ordre.length * POINTS, pct = score / total;
  const msg = pct >= 0.8 ? "Très bon résultat, vous maîtrisez l'amortissement dégressif."
            : pct >= 0.5 ? "Résultat correct. Relisez le cours sur les points où vous vous êtes trompé."
            : "Résultat insuffisant. Reprenez le cours « Amortissements » avant de recommencer.";
  zone.innerHTML = `
    <div class="barre"><div style="width:100%"></div></div>
    <div class="resultat">
      <div class="score">${score}</div><div class="sur">sur ${total} points</div>
      <div class="msg">${msg}</div>
      <button class="btn" id="recommencer">Recommencer le QCM</button>
    </div>`;
  document.getElementById("recommencer").onclick = demarrer;
}

demarrer();
</script>
</body>
</html>
