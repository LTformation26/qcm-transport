<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap');
:root{--gd:#1a5c38;--gm:#2e7d52;--gl:#e8f5ee;--ga:#2ecc71;--red:#c0392b;--rl:#fdecea;--bg:#f4f4f2;--bd:#ddd;--tx:#1c1c1c;--wh:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
header{background:var(--gd);color:var(--wh);padding:20px 32px 16px;border-bottom:4px solid var(--ga);}
header .lb{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ga);margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;}
header .mt{margin-top:6px;font-size:12px;color:rgba(255,255,255,0.6);}
.elim{display:inline-block;margin-left:8px;background:rgba(192,57,43,0.35);border:1px solid rgba(192,57,43,0.6);color:#ffbbbb;font-size:11px;padding:2px 8px;border-radius:4px;}
.pw{background:var(--gd);padding:11px 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.1);}
.pt{flex:1;background:rgba(255,255,255,0.15);border-radius:4px;height:5px;overflow:hidden;}
.pf{height:100%;background:var(--ga);border-radius:4px;transition:width 0.4s ease;}
.pl{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:rgba(255,255,255,0.8);white-space:nowrap;min-width:65px;text-align:right;}
.wrap{max-width:740px;margin:32px auto;padding:0 18px 60px;}
.card{background:var(--wh);border-radius:12px;border:1px solid var(--bd);padding:30px 34px;box-shadow:0 2px 12px rgba(0,0,0,0.06);animation:fi 0.22s ease;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.qm{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.qb{background:var(--gd);color:var(--wh);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:3px 11px;border-radius:5px;}
.qp{font-size:12px;color:#999;}
.qt{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:20px;color:var(--tx);}
.cs{display:flex;flex-direction:column;gap:8px;}
.cl{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13.5px;transition:border-color 0.15s,background 0.15s;line-height:1.4;}
.cl:hover:not(.lk){border-color:var(--gm);background:var(--gl);}
.cl input{display:none;}
.cl .lt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--gd);background:var(--gl);border-radius:4px;padding:2px 7px;flex-shrink:0;margin-top:1px;}
.cl.sl{border-color:var(--gd);background:var(--gl);}
.cl.ok{border-color:var(--ga);background:#eafaf1;}
.cl.ko{border-color:var(--red);background:var(--rl);}
.cl.ok .lt{background:#c3efda;color:#1a7a3f;}
.cl.ko .lt{background:#fadbd8;color:var(--red);}
.fb{display:none;margin-top:16px;padding:13px 15px;border-radius:8px;font-size:13px;line-height:1.55;}
.fb.good{background:#eafaf1;border-left:4px solid var(--ga);color:#1a5c38;}
.fb.bad{background:var(--rl);border-left:4px solid var(--red);color:#8b1a1a;}
.fb .vd{font-weight:700;font-size:13.5px;margin-bottom:4px;}
.fb .cm{color:#333;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;}
.btn{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:7px;padding:11px 20px;cursor:pointer;transition:background 0.2s,opacity 0.2s;}
.bp{background:#e8e8e4;color:#555;}.bp:hover{background:#d5d5ce;}
.bv{background:var(--gd);color:var(--wh);flex:1;}.bv:hover{background:var(--gm);}.bv:disabled{opacity:0.4;cursor:not-allowed;}
.bn{background:var(--gd);color:var(--wh);}.bn:hover{background:var(--gm);}
.sc{display:none;background:var(--gd);color:var(--wh);border-radius:12px;padding:38px 34px;text-align:center;box-shadow:0 4px 20px rgba(26,92,56,0.2);}
.sc .big{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:700;color:var(--ga);line-height:1;}
.sc .sub{font-size:14px;color:rgba(255,255,255,0.65);margin-top:5px;}
.sc .mn{font-size:17px;font-weight:600;margin-top:16px;}
.sc .dt{margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6);}
.sc .ew{margin-top:12px;padding:10px 14px;background:rgba(192,57,43,0.3);border-radius:8px;font-size:13px;color:#ffcccc;}
.br{margin-top:20px;background:transparent;border:2px solid rgba(255,255,255,0.35);color:var(--wh);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;text-transform:uppercase;padding:9px 24px;border-radius:7px;cursor:pointer;}
.br:hover{border-color:var(--ga);color:var(--ga);}
@media(max-width:600px){header{padding:16px 14px 12px;}header h1{font-size:17px;}.pw{padding:9px 14px;}.wrap{padding:0 10px 48px;}.card{padding:20px 16px;}.qt{font-size:14px;}.cl{font-size:13px;}}
</style>

<body>
<header>
  <div class="lb">Examen d'attestation de capacité — Commissionnaire de transport</div>
  <h1>QCM Annale officielle — Session 4 octobre 2023</h1>
  <div class="mt">50 questions · 2 points chacune · Score max : 100 points <span class="elim">⚠ Note éliminatoire &lt; 50/100</span></div>
</header>
<div class="pw">
  <div class="pt"><div class="pf" id="pf"></div></div>
  <div class="pl" id="pl">0 / 50</div>
</div>
<div class="wrap">
  <div class="card" id="card">
    <div class="qm"><span class="qb" id="qb">Q1</span><span class="qp">2 points</span></div>
    <div class="qt" id="qt"></div>
    <div class="cs" id="cs"></div>
    <div class="fb" id="fb"><div class="vd" id="vd"></div><div class="cm" id="cm"></div></div>
    <div class="nav">
      <button class="btn bp" id="btnP" onclick="go(cur-1)">← Précédent</button>
      <button class="btn bv" id="btnV" onclick="doVal()">Valider</button>
      <button class="btn bn" id="btnN" onclick="go(cur+1)" style="display:none">Suivant →</button>
    </div>
  </div>
  <div class="sc" id="sc">
    <div class="big" id="sb"></div><div class="sub">points sur 100</div>
    <div class="mn" id="sm"></div><div class="dt" id="sd"></div>
    <div class="ew" id="ew" style="display:none">⚠ Score inférieur à la note éliminatoire de 50/100</div>
    <button class="br" onclick="restart()">Recommencer</button>
  </div>
</div>
<script>
var Q=[
{q:"En transport routier intérieur de marchandises, la prescription dans le cas de la perte totale de la marchandise est :",
c:["d'un an à compter du jour où la remise de la marchandise aurait dû être effectuée au destinataire","d'un an à compter du jour de la prise en charge de la marchandise par le transporteur","interrompue par la lettre recommandée adressée au transporteur confirmant les réserves","interrompue par une demande de réparation du préjudice adressée par le destinataire au transporteur"],
r:0,
x:"En cas de <strong>perte totale</strong>, le délai de prescription d'1 an court à compter du <strong>jour où la remise de la marchandise aurait dû être effectuée</strong> au destinataire (date prévue de livraison). Ce n'est pas la date de prise en charge."},

{q:"La responsabilité du transporteur routier de marchandises peut être recherchée par son donneur d'ordre :",
c:["toujours lorsqu'il y a mauvaise exécution du contrat de transport, que ce soit du fait du transporteur ou de celui d'un tiers","seulement pour les fautes lourdes du préposé du transporteur","seulement pour les dommages résultant des opérations de conduite et de chargement","seulement si les clauses exonératoires figurant dans les conditions générales de vente du transporteur le permettent"],
r:0,
x:"Le transporteur est soumis à une <strong>obligation de résultat</strong> : il est responsable de toute mauvaise exécution du contrat, qu'elle soit de son fait ou d'un tiers substitué. Il ne peut s'exonérer qu'en prouvant une cause étrangère (force majeure, vice propre, faute du chargeur...)."},

{q:"En quoi consiste la caution personnelle d'un dirigeant d'une entreprise ?",
c:["il s'agit d'un gage où la caution porte sur le patrimoine de l'entreprise","il s'agit d'un nantissement, une garantie en nature que le débiteur remet à un créancier","il s'agit d'une garantie d'un gage donné par le créancier au dirigeant","il s'agit d'une garantie de paiement donnée par le dirigeant à un créancier"],
r:3,
x:"La caution personnelle est un acte par lequel le <strong>dirigeant s'engage personnellement</strong> à payer la dette de son entreprise si elle ne peut pas y faire face. Il donne une <strong>garantie de paiement personnelle</strong> à un créancier (banque, fournisseur...), engageant son patrimoine propre."},

{q:"Depuis le 1er janvier 2023, le registre national des entreprises (RNE) se substitue :",
c:["au registre du commerce et des sociétés (RCS)","au répertoire des métiers (RM)","au registre des actifs agricoles (RAA)","à l'ensemble des registres d'entreprises sus-cités"],
r:3,
x:"Depuis le 1er janvier 2023, le <strong>RNE</strong> remplace et unifie <strong>l'ensemble des registres</strong> : le RCS (commerçants), le RM (artisans) et le RAA (agriculteurs). C'est un registre unique géré par l'INPI, accessible via le guichet unique des formalités des entreprises."},

{q:"En application de l'article L.3224-1 du code des transports, peuvent recourir à la sous-traitance sans inscription au registre des commissionnaires de transport :",
c:["tout transporteur, sans condition","uniquement les transporteurs faisant plus de 15% de leur chiffre d'affaires annuel en sous-traitance transport","les entreprises qui recourent aux opérateurs de transport combiné, pour l'activité correspondant aux parcours initiaux et terminaux","les louageurs d'utilitaires"],
r:2,
x:"L'article L.3224-1 permet aux entreprises utilisant le <strong>transport combiné</strong> de sous-traiter les <strong>parcours initiaux et terminaux</strong> (rabattement vers/depuis le terminal) sans être inscrites au registre des commissionnaires de transport."},

{q:"A la fin du contrat de crédit bail d'un véhicule, le transporteur ne peut pas :",
c:["le racheter pour une faible somme","le relouer à des conditions minorées","le restituer à l'établissement de crédit bail","le vendre"],
r:3,
x:"À la fin du crédit-bail, le preneur peut : <strong>racheter</strong> le bien à sa valeur résiduelle, <strong>restituer</strong> le bien au bailleur, ou <strong>continuer à louer</strong>. Il ne peut pas <strong>vendre</strong> le bien car il n'en est pas propriétaire — le bien appartient à l'établissement de crédit-bail."},

{q:"La variation de stock de votre entreprise est négative en fin d'exercice. Cela signifie que :",
c:["une erreur a été commise par votre magasinier","vous avez consommé pour un montant supérieur à vos achats de l'exercice","vous avez constitué du stock","vos achats sont inférieurs à vos consommations"],
r:2,
x:"En comptabilité française (PCG), la <strong>variation de stocks est négative</strong> quand le stock final est <strong>supérieur</strong> au stock initial : vous avez <strong>constitué du stock</strong> (stockage). Si elle est positive, vous avez destocké (consommé plus que vous n'avez acheté)."},

{q:"En complément de la taxe d'apprentissage, la contribution supplémentaire à l'apprentissage (CSA) est due par :",
c:["toutes les entreprises","les entreprises payant la taxe d'apprentissage","les entreprises soumises à la taxe d'apprentissage, dont l'effectif est de plus de 250 salariés dont au moins 5% sont alternants ou salariés dans leur première année d'embauche en CDI","l'entreprise qui emploie au moins 5% de salariés en alternance ou salariés dans leur première année d'embauche en CDI"],
r:2,
x:"La CSA est due par les <strong>entreprises de plus de 250 salariés</strong> soumises à la taxe d'apprentissage <strong>dont le quota d'alternants ou de jeunes en CDI 1ère année est inférieur à 5%</strong>. C'est une incitation à l'embauche en alternance."},

{q:"L'engagement des poursuites disciplinaires par l'employeur, à partir de sa connaissance d'un fait considéré comme fautif, doit être réalisé dans un délai maximum de :",
c:["5 jours francs","2 semaines","2 mois","6 mois"],
r:2,
x:"L'employeur dispose de <strong>2 mois</strong> à compter du moment où il a connaissance des faits fautifs pour engager les poursuites disciplinaires (Art. L.1332-4 C.trav.). Ce délai est suspendu en cas de poursuites pénales pour les mêmes faits."},

{q:"L'organisation de l'élection des membres du comité social et économique (CSE) incombe à l'employeur :",
c:["tous les 2 ans","tous les 3 ans","tous les 4 ans","tous les 5 ans"],
r:2,
x:"Le mandat des membres élus du CSE est de <strong>4 ans</strong>. L'employeur doit organiser les élections tous les 4 ans. Un accord collectif peut réduire ce mandat à 2 ans. Les membres sont rééligibles (limite de 3 mandats successifs dans les entreprises de plus de 300 salariés)."},

{q:"La convention collective de branche, applicable dans l'entreprise, est mentionnée :",
c:["dans un journal d'annonces légales","au Conseil de prud'hommes","sur le bulletin de paie","au tribunal de commerce"],
r:2,
x:"Depuis 2017, la <strong>convention collective applicable</strong> doit obligatoirement figurer sur le <strong>bulletin de paie</strong> (Art. R.3243-1 C.trav.). Son intitulé et son numéro IDCC doivent être mentionnés pour permettre au salarié d'identifier ses droits conventionnels."},

{q:"Le jeudi 23 décembre, un transporteur livre des bouteilles. Lors de la livraison, le destinataire appose des réserves pour 3 bouteilles cassées. Le transporteur devra avoir reçu la confirmation de ces réserves au plus tard, avant minuit, le :",
c:["lundi 27 décembre","mardi 28 décembre","mercredi 29 décembre","jeudi 30 décembre"],
r:1,
x:"Les réserves prises à la livraison doivent être confirmées dans les <strong>3 jours francs</strong> (hors dimanches et jours fériés). Livraison le jeudi 23/12. Jour 1 = vendredi 24 (Noël, férié → exclu). Jour 1 = samedi 25. Jour 2 = lundi 27. Jour 3 = mardi 28 décembre."},

{q:"Suite à une faute de conduite involontaire, un conducteur salarié endommage le quai du destinataire avec son véhicule. La responsabilité de ce dommage incombe :",
c:["à l'expéditeur","au destinataire","à l'employeur du conducteur","au conducteur salarié"],
r:2,
x:"En vertu du principe de <strong>responsabilité du commettant</strong> (Art. 1242 C.civ.), l'<strong>employeur</strong> (le transporteur) est responsable des dommages causés par son salarié dans l'exercice de ses fonctions. Le conducteur salarié agit pour le compte de son employeur."},

{q:"La livraison intervient lorsque la marchandise :",
c:["est remise au destinataire","est remise au destinataire qui l'accepte","est mise à la disposition du destinataire dans le véhicule","commence à être déchargée chez le destinataire"],
r:1,
x:"La livraison est définie comme la remise physique de la marchandise au destinataire <strong>qui l'accepte</strong>. L'acceptation par le destinataire est un élément constitutif de la livraison. Sans acceptation, il y a seulement mise à disposition ou tentative de livraison."},

{q:"Pour être exonéré de sa responsabilité, le transporteur, en charge de la marchandise :",
c:["n'émet aucune réserve écrite et contradictoire à la prise en charge de la marchandise","peut refuser que le destinataire prenne des réserves sur le document de transport","doit faire procéder obligatoirement à une expertise judiciaire","doit justifier du vice propre de la marchandise et de la faute de l'ayant-droit"],
r:3,
x:"Pour s'exonérer, le transporteur doit <strong>prouver une cause étrangère</strong> : vice propre de la marchandise, faute de l'ayant-droit, force majeure... Il ne peut pas refuser les réserves du destinataire, et l'expertise judiciaire n'est pas obligatoire. La preuve lui incombe (renversement de la charge de la preuve)."},

{q:"Une entreprise de transport routier de marchandises pour compte d'autrui a l'obligation légale de s'assurer pour :",
c:["les marchandises transportées pour les dommages supérieurs à 1 000 euros","sa responsabilité civile dans le cadre de la circulation automobile","les marchandises transportées pour tout type de dommages","ses véhicules en cas de vol"],
r:1,
x:"La seule assurance <strong>obligatoire</strong> pour un transporteur routier est l'<strong>assurance RC circulation</strong> (responsabilité civile automobile). L'assurance marchandises transportées et l'assurance vol de véhicule sont facultatives, bien que recommandées."},

{q:"En transport national, le contrat type applicable à un envoi de 1 500 litres d'eau minérale en bouteilles est :",
c:["le contrat de denrées alimentaires périssables","la convention de marchandises par route (CMR)","le contrat type dit \"général\"","il n'y a pas de contrat type qui s'applique"],
r:2,
x:"L'eau minérale en bouteilles n'est pas une <strong>denrée périssable</strong> (elle se conserve longtemps). La CMR ne s'applique qu'au transport international. C'est donc le <strong>contrat type général</strong> qui s'applique pour ce transport intérieur de marchandises banales."},

{q:"Selon la convention de marchandises par route (CMR), l'indemnité en cas de pertes et avaries est calculée d'après :",
c:["la valeur des marchandises au lieu et date de prise en charge","le prix de vente des marchandises au lieu de livraison","le prix de vente des marchandises au lieu de prise en charge","la valeur des marchandises au lieu et à la date de livraison"],
r:0,
x:"L'article 23 de la CMR prévoit que l'indemnité est calculée d'après la <strong>valeur des marchandises au lieu et à la date de prise en charge</strong> par le transporteur. Ce n'est pas la valeur au lieu de livraison ni le prix de vente."},

{q:"Un transporteur français enlève des marchandises en Italie pour les livrer en Allemagne. Son client néerlandais lui fournit un n° de TVA néerlandais. Le transporteur facture le transport :",
c:["avec le taux de TVA néerlandais","avec le taux de TVA italien","avec le taux de TVA français","hors taxe"],
r:3,
x:"Pour un transport intracommunautaire B2B, la TVA est due dans le pays du <strong>preneur assujetti</strong> (auto-liquidation). Le client néerlandais fournit son numéro de TVA néerlandais → le transporteur français facture <strong>hors taxe</strong> (exonération avec mention 'autoliquidation')."},

{q:"En transport international, en cas de dol ou de faute inexcusable du transporteur, le délai de prescription prévu par la CMR est :",
c:["de 1 an","de 3 ans","de 10 ans","illimité"],
r:1,
x:"L'article 32 de la CMR prévoit un délai de prescription de <strong>3 ans</strong> en cas de <strong>dol ou faute assimilée au dol</strong> du transporteur. Le délai ordinaire est d'1 an. Ce délai plus long sanctionne le comportement intentionnel ou inexcusable du transporteur."},

{q:"Une expédition prise en charge le 21 novembre n'est pas livrée à destination (Budapest) le 1er février suivant. Selon la CMR, l'expéditeur réclame réparation :",
c:["le transporteur ne sera tenu de l'indemniser que pour retard, à condition de lui adresser une réclamation 21 jours après la découverte de la non-livraison","la CMR ne s'applique pas, la lettre de voiture correspondante n'ayant pas été produite par le réclamant","la marchandise est présumée perdue et le transporteur doit indemniser l'expéditeur","il n'y a pas de présomption de responsabilité à l'encontre du transporteur"],
r:2,
x:"Selon l'article 20 de la CMR, si la marchandise n'est pas livrée dans les <strong>30 jours suivant le délai convenu</strong> (ou 60 jours après la prise en charge s'il n'y a pas de délai), elle est <strong>présumée perdue</strong>. Le transporteur doit alors indemniser comme pour une perte totale."},

{q:"S'agissant d'échanges intracommunautaires, les prestations accessoires au transport (chargement, déchargement...) suivent en matière de TVA :",
c:["un régime différent de la prestation transport","le même régime que les marchandises exportées","un régime différent des marchandises transportées","le même régime que la prestation transport"],
r:3,
x:"Les <strong>prestations accessoires au transport</strong> (chargement, déchargement, manutention...) suivent le <strong>même régime TVA que la prestation principale de transport</strong> pour les échanges intracommunautaires. Elles sont imposables dans le pays du preneur assujetti (B2B)."},

{q:"Dans un FOB Marseille, l'acheteur doit :",
c:["faire les formalités de douane export","supporter les risques d'embarquement","désigner le transporteur maritime","couvrir l'assurance"],
r:2,
x:"En <strong>FOB (Free On Board)</strong>, le risque se transfère quand la marchandise est à bord du navire. Le vendeur fait les formalités export et livre à bord. L'<strong>acheteur désigne le transporteur maritime</strong> et paye le fret, les risques après embarquement, et l'assurance s'il le souhaite."},

{q:"Dans les conventions de Varsovie et de Montréal, le délai de prescription est de :",
c:["1 an et 1 jour","1 an à compter de la prise en charge des marchandises par le transporteur aérien","1 an à compter de l'arrivée des marchandises","2 ans à compter de l'arrivée des marchandises"],
r:3,
x:"La Convention de Montréal (art. 35) et la Convention de Varsovie fixent un délai de prescription de <strong>2 ans à compter de l'arrivée des marchandises</strong> à destination (ou de la date d'arrivée prévue). Ce délai s'applique à toute action en responsabilité contre le transporteur aérien."},

{q:"Lors d'une vente faisant l'objet d'une lettre de crédit \"stand by\" :",
c:["le donneur d'ordre est le vendeur","la banque du vendeur est la banque émettrice de la lettre de crédit","le donneur d'ordre est l'acheteur","le bénéficiaire est l'acheteur"],
r:2,
x:"Dans un crédit documentaire (y compris stand-by), le <strong>donneur d'ordre est l'acheteur</strong> (importateur) qui demande à sa banque d'ouvrir le crédit. Le bénéficiaire est le vendeur (exportateur). La banque émettrice est la banque de l'acheteur."},

{q:"Le commissionnaire de transport :",
c:["n'est jamais pénalement responsable des fautes des transporteurs qui effectuent les transports","dispose d'un droit de rétention sur les marchandises en garantie de toutes les créances dues par le donneur d'ordre","dispose d'un droit de rétention sur les marchandises en garantie seulement du prix du transport en cours","est déchargé de sa responsabilité commerciale s'il affrète un transporteur"],
r:1,
x:"Le commissionnaire dispose d'un <strong>droit de rétention (privilège) sur les marchandises en garantie de toutes les créances</strong> dues par le donneur d'ordre (créances antérieures et en cours), pas seulement du transport en cours. Ce privilège est prévu à l'article L.132-2 du Code de commerce."},

{q:"En transport terrestre intérieur, le commissionnaire de transport qui veut engager une action récursoire contre le transporteur dispose d'un délai :",
c:["d'1 mois à compter de l'action principale","de 2 mois à compter de l'action principale","de 3 mois à compter de l'action principale","de 6 mois à compter de l'action principale"],
r:0,
x:"En transport intérieur, le commissionnaire dispose d'un délai d'<strong>1 mois</strong> à compter de l'action principale pour exercer son action récursoire contre le transporteur fautif. Ce délai court à compter du jour de l'action en justice intentée contre le commissionnaire."},

{q:"En cas \"d'avarie commune\" survenue en Mer Rouge, la participation à l'indemnisation sera due par :",
c:["le commissionnaire organisateur du transport","les propriétaires des marchandises et le propriétaire du navire","le transporteur maritime uniquement","personne car c'est un cas de force majeure"],
r:1,
x:"L'avarie commune est un sacrifice volontaire du capitaine pour sauver l'expédition. Le coût est réparti proportionnellement entre <strong>tous les intérêts sauvés</strong> : les <strong>propriétaires des marchandises et le propriétaire du navire</strong>. Un dispacheur établit le compromis d'avarie."},

{q:"Le contrat type de commission de transport entend par \"envoi\" l'ensemble des marchandises dont le déplacement est demandé par :",
c:["un même donneur d'ordre pour plusieurs destinataires","plusieurs donneurs d'ordre pour un même destinataire","plusieurs donneurs d'ordre pour plusieurs destinataires","un même donneur d'ordre pour un même destinataire"],
r:3,
x:"Selon l'article 2.4 du contrat type de commission, un envoi est l'ensemble des marchandises mis à disposition par <strong>un même donneur d'ordre pour un même destinataire</strong>, d'un lieu de chargement unique à un lieu de déchargement unique."},

{q:"Afin de bénéficier du régime préférentiel entre l'Union européenne et le Maroc, l'importateur marocain devra présenter à la douane marocaine :",
c:["une facture visée par la douane marocaine","un EUR 1 visé par la douane française","un certificat d'origine visé par la chambre de commerce et d'industrie du Maroc","une facture visée par la mission économique auprès de l'ambassade de France"],
r:1,
x:"Pour bénéficier des préférences tarifaires de l'accord UE-Maroc, il faut présenter un <strong>EUR 1 (certificat de circulation) visé par la douane française</strong> (pays d'exportation). Ce document prouve l'origine préférentielle UE des marchandises."},

{q:"Dans le droit maritime, un transport effectué entre deux ports français est soumis :",
c:["à la convention de Bruxelles originelle (Règles de La Haye)","à la convention de Hambourg","à la convention de Bruxelles amendée (Règles de Visby)","au code des transports français"],
r:3,
x:"Un transport maritime entre deux ports français est un transport <strong>intérieur</strong>. Il est soumis au <strong>Code des transports français</strong> (loi du 18 juin 1966). Les conventions internationales (Bruxelles, Hambourg) ne s'appliquent qu'aux transports internationaux."},

{q:"En transport aérien international, les réserves pour avarie :",
c:["sont facultatives","sont obligatoires","doivent toujours être confirmées par lettre recommandée","sont inutiles car les marchandises sont \"sous douane\""],
r:1,
x:"Selon la Convention de Montréal (art. 31), les réserves pour avarie en transport aérien sont <strong>obligatoires</strong> : elles doivent être notifiées au transporteur dès la livraison (avaries apparentes) ou dans les 14 jours (avaries non apparentes), sous peine de forclusion."},

{q:"Le régime douanier qui confère à une marchandise originaire d'un pays tiers seulement le caractère communautaire est :",
c:["un perfectionnement actif","un perfectionnement passif","une mise à la consommation","une mise en libre pratique"],
r:3,
x:"La <strong>mise en libre pratique</strong> confère le statut douanier de marchandise communautaire à des produits originaires de pays tiers, après paiement des droits de douane. La mise à la consommation ajoute le paiement de la TVA à l'importation."},

{q:"Les transports ferroviaires internationaux sont soumis :",
c:["à la convention de Berne (RU-CIM)","à la convention de Genève (CMR)","au code du commerce français","à la convention de Varsovie"],
r:0,
x:"Les transports ferroviaires internationaux sont régis par la <strong>convention de Berne (COTIF-CIM)</strong> — Convention relative aux transports Internationaux Ferroviaires. La CMR est pour le routier, Varsovie/Montréal pour l'aérien."},

{q:"A l'occasion d'un transport maritime (convention de Bruxelles), une faute nautique est :",
c:["une faute de navigation qui exonère la compagnie maritime de sa responsabilité en cas de dommages causés aux marchandises","aussi appelée : faute commerciale","une manoeuvre frauduleuse d'un transporteur maritime","une faute de navigation qui ne permet pas au transporteur de limiter ses indemnisations en cas d'avaries aux marchandises"],
r:0,
x:"La <strong>faute nautique</strong> (erreur de navigation ou de conduite du navire) est une <strong>cause exonératoire</strong> de responsabilité sous la Convention de Bruxelles : elle libère le transporteur des dommages causés aux marchandises. À distinguer de la faute commerciale qui n'exonère pas."},

{q:"Le délai de prescription de la convention de Bruxelles est de :",
c:["1 an","2 ans","5 ans","10 ans"],
r:0,
x:"La Convention de Bruxelles (Règles de La Haye) prévoit un délai de prescription de <strong>1 an</strong>. Ce délai court à compter de la délivrance des marchandises ou de la date à laquelle elles auraient dû être délivrées. L'action récursoire peut être exercée dans les 3 mois suivants."},

{q:"Le transitaire-mandataire exerce une profession, qui relève :",
c:["du code des transports","du code de commerce","de la Convention pour le transport de marchandises (CMR)","du Code civil"],
r:3,
x:"Le transitaire-mandataire agit <strong>au nom et pour le compte</strong> de son mandant. Sa profession relève des <strong>règles du mandat du Code civil</strong> (art. 1984 et suivants). Il n'organise pas le transport en son nom propre, contrairement au commissionnaire."},

{q:"Le commissionnaire de transport perd cette qualité pour devenir simple mandataire :",
c:["s'il fait appel à un autre commissionnaire (affrètement en cascade)","s'il n'a pas le libre choix du transporteur","si le transporteur lui impose le type de véhicule","si, avant l'affrètement, il demande l'accord du transporteur"],
r:1,
x:"Le commissionnaire agit en son nom propre avec <strong>liberté de choix des moyens</strong>. S'il <strong>n'a pas le libre choix du transporteur</strong> (le donneur d'ordre lui impose le transporteur), il perd sa qualité de commissionnaire et devient simple <strong>mandataire</strong>, agissant au nom du donneur d'ordre."},

{q:"Selon le contrat type de commission de transport, le paiement du prix des prestations est exigible dans un délai :",
c:["de 30 jours à compter de la date de réception de la facture","de 30 jours à compter de la date de l'émission de la facture","de 45 jours à compter de la date de réception de la facture","supérieur à 30 jours en cas de contrat négocié entre les parties"],
r:1,
x:"L'article 12.1 du contrat type de commission prévoit un délai de paiement qui ne peut excéder <strong>30 jours à compter de la date d'émission de la facture</strong>. Ce délai est impératif et ne peut pas être prolongé même par accord contractuel."},

{q:"Le commissionnaire de transport peut exercer son privilège :",
c:["à l'occasion d'un litige avec le transporteur","seulement si le transporteur est en relation suivie avec lui","pour obliger l'expéditeur à lui payer une facture antérieure","en cas de rupture de contrat avec l'expéditeur"],
r:2,
x:"Le <strong>privilège du commissionnaire</strong> (droit de rétention) peut s'exercer sur les marchandises détenues pour garantir le paiement de <strong>créances antérieures</strong> non réglées par le donneur d'ordre. Il ne se limite pas au transport en cours."},

{q:"Le commissionnaire de transport remettant à un transporteur un groupage de marchandises dangereuses :",
c:["est tenu de se porter garant de l'exactitude concernant la nature de la marchandise","est tenu d'informer le transporteur des déclarations faites par les chargeurs","est présumé responsable des fausses déclarations des chargeurs","n'a pas à prendre en compte la nature dangereuse des marchandises"],
r:1,
x:"Le commissionnaire est tenu de <strong>transmettre au transporteur les informations et déclarations</strong> faites par les chargeurs sur la nature des marchandises dangereuses. Il doit répercuter ces informations fidèlement, mais n'est pas garant de leur exactitude si elles émanent des chargeurs."},

{q:"Vous importez CIF Marseille, en provenance de Valparaiso (Chili). Des colis arrivent abîmés. Le nécessaire auprès de la compagnie d'assurance devra être effectué par :",
c:["le vendeur","l'acheteur","le commissionnaire de transport","le transporteur maritime"],
r:1,
x:"En CIF, le vendeur souscrit l'assurance <strong>pour le compte de l'acheteur</strong>. L'acheteur est le <strong>bénéficiaire de la police d'assurance</strong> et c'est lui qui doit effectuer les démarches auprès de la compagnie d'assurance en cas de sinistre à l'arrivée."},

{q:"Il existe un document de transport qui est généralement établi en plusieurs originaux identiques, tous ayant le même usage ; lorsque le premier est \"accompli\", les autres perdent toute valeur. Il s'agit :",
c:["du connaissement","de la lettre de transport aérien","de la lettre de voiture internationale type CMR","de la lettre de voiture CIM"],
r:0,
x:"Le <strong>connaissement maritime</strong> (Bill of Lading) est établi en plusieurs originaux (généralement 3). Dès que le premier original est utilisé (la marchandise est livrée contre présentation), les autres <strong>perdent toute valeur</strong>. C'est un titre représentatif de la marchandise."},

{q:"En cas d'avaries, l'action du client contre le commissionnaire de transport est prescrite dans le délai d'un an :",
c:["à compter de l'enlèvement des marchandises","à compter du constat du dommage","à compter de la livraison de la marchandise","et 1 mois compte tenu de son délai d'action récursoire contre le transporteur"],
r:2,
x:"Le délai de prescription d'1 an pour l'action contre le commissionnaire court à compter de la <strong>livraison de la marchandise</strong> (art. 14 du contrat type). En cas de perte, il court à compter du jour prévu de livraison."},

{q:"Le commissionnaire de transport peut s'exonérer de sa responsabilité pour perte ou avarie :",
c:["s'il y a une clause d'exonération acceptée par le commettant","en cas de faute du transporteur","s'il a la possibilité de se retourner contre le substitué fautif","s'il a la possibilité de faire intervenir l'assureur des marchandises"],
r:0,
x:"Le commissionnaire peut s'exonérer de sa responsabilité si une <strong>clause d'exonération a été acceptée par le commettant</strong>. La faute du transporteur ne l'exonère pas car il est responsable de ses substitués. Il peut se retourner contre le substitué mais cela ne l'exonère pas vis-à-vis du commettant."},

{q:"La limite d'indemnisation du transporteur aérien, en cas de retard, est :",
c:["égale au plus au prix du transport","égale à la limitation pour perte ou avarie","égale à trois fois le prix du transport","obligatoirement contractuelle"],
r:1,
x:"Selon la Convention de Montréal, la limite d'indemnisation pour retard est <strong>identique à la limite pour perte ou avarie</strong>, soit 22 DTS/kg (révisé 2019). Cette limite peut être dépassée par une déclaration d'intérêts spéciaux à la livraison."},

{q:"Lors d'une vente \"EXW\" :",
c:["le chargement du véhicule à l'usine est à la charge du vendeur","l'emballage de la marchandise est à la charge du vendeur","les formalités douanières à l'exportation sont à la charge du vendeur","l'acheminement des marchandises au port, à l'aéroport ou à la plate-forme de groupage, est à la charge du vendeur"],
r:1,
x:"En EXW, le vendeur doit simplement <strong>emballer la marchandise</strong> et la mettre à disposition dans ses locaux. Le chargement, le transport, les formalités douanières et tous les risques sont à la charge de l'acheteur dès la mise à disposition."},

{q:"Dans une vente \"FCA Le Havre\", le commissionnaire de transport facture le vendeur :",
c:["jusqu'au domicile de l'acheteur","jusqu'à la frontière","jusqu'au transporteur du lieu désigné","des formalités de douane import"],
r:2,
x:"En FCA (Free Carrier), le vendeur livre la marchandise <strong>remise au transporteur désigné par l'acheteur au lieu convenu (Le Havre)</strong>. Le commissionnaire facture le vendeur pour les prestations jusqu'à la remise au transporteur désigné au lieu convenu."},

{q:"Selon l'Incoterms® FCA RUE ANDRE PICOTY 23300 LA SOUTERRAINE, le vendeur doit :",
c:["charger les marchandises à bord du véhicule","mettre à disposition non chargées les marchandises","dédouaner les marchandises à l'import","assurer les marchandises contre les risques du transport international"],
r:0,
x:"En FCA, quand le lieu désigné est <strong>les locaux du vendeur</strong>, celui-ci doit <strong>charger les marchandises sur le véhicule</strong> venu les enlever. Si le lieu est ailleurs (terminal, entrepôt), la marchandise est mise à disposition non chargée. Le dédouanement export est à la charge du vendeur en FCA."},

{q:"Le DAU est remplacé sous delt@IE par :",
c:["le même formulaire mais dématérialisé","une déclaration en douane dite standard (H1)","le formulaire CA3","la déclaration de production SV12"],
r:1,
x:"Le Document Administratif Unique (DAU) est remplacé dans le système DELTA-IE par une <strong>déclaration en douane standard dite H1</strong>. La dématérialisation des procédures douanières (Delta IE) a supprimé le formulaire papier DAU pour les déclarations d'importation."}
];

var L=["a","b","c","d"];
var cur=0,ans=new Array(Q.length).fill(-1),val_=new Array(Q.length).fill(false);
function render(){
  var item=Q[cur];
  document.getElementById("qb").textContent="Question "+(cur+1);
  document.getElementById("qt").textContent=item.q;
  var cs=document.getElementById("cs");cs.innerHTML="";
  for(var j=0;j<4;j++){
    var lb=document.createElement("label");
    lb.className="cl"+(val_[cur]?" lk":"");
    if(val_[cur]){if(j===item.r)lb.classList.add("ok");else if(j===ans[cur]&&ans[cur]!==item.r)lb.classList.add("ko");}
    else if(ans[cur]===j)lb.classList.add("sl");
    lb.innerHTML='<input type="radio" name="ch" value="'+j+'"><span class="lt">'+L[j]+'</span><span>'+item.c[j]+'</span>';
    if(!val_[cur]){(function(jj){lb.addEventListener("click",function(){pick(jj);});})(j);}
    cs.appendChild(lb);
  }
  var fb=document.getElementById("fb");
  if(val_[cur]){
    fb.style.display="block";fb.className="fb "+(ans[cur]===item.r?"good":"bad");
    document.getElementById("vd").innerHTML=(ans[cur]===item.r)?"✓ Bonne réponse — "+L[item.r]:"✗ Mauvaise réponse — La bonne réponse était : <strong>"+L[item.r]+"</strong>";
    document.getElementById("cm").innerHTML=item.x;
  }else{fb.style.display="none";}
  var bv=document.getElementById("btnV"),bn=document.getElementById("btnN"),bp=document.getElementById("btnP");
  if(val_[cur]){bv.style.display="none";bn.style.display="block";bn.textContent=cur<Q.length-1?"Suivant →":"Voir le score";}
  else{bv.style.display="block";bv.disabled=(ans[cur]===-1);bn.style.display="none";}
  bp.style.display=cur>0?"block":"none";prog();
}
function pick(j){if(val_[cur])return;ans[cur]=j;render();}
function doVal(){if(ans[cur]===-1)return;val_[cur]=true;render();}
function go(i){if(i<0)return;if(i>=Q.length){showScore();return;}cur=i;render();}
function prog(){var d=0;for(var i=0;i<val_.length;i++)if(val_[i])d++;document.getElementById("pf").style.width=(d/Q.length*100)+"%";document.getElementById("pl").textContent=d+" / "+Q.length;}
function showScore(){
  var s=0;for(var i=0;i<Q.length;i++)if(val_[i]&&ans[i]===Q[i].r)s+=2;
  document.getElementById("card").style.display="none";var sc=document.getElementById("sc");sc.style.display="block";
  document.getElementById("sb").textContent=s;document.getElementById("sd").textContent=Math.round(s/2)+" questions correctes sur 50";
  var m="";if(s>=90)m="🏆 Excellent !";else if(s>=70)m="✅ Bon niveau.";else if(s>=50)m="📘 Passable — Des révisions s'imposent.";else m="⚠️ Score insuffisant — Révisions intensives nécessaires.";
  document.getElementById("sm").textContent=m;document.getElementById("ew").style.display=s<50?"block":"none";sc.scrollIntoView({behavior:"smooth",block:"center"});
}
function restart(){ans=new Array(Q.length).fill(-1);val_=new Array(Q.length).fill(false);cur=0;document.getElementById("sc").style.display="none";document.getElementById("card").style.display="block";render();window.scrollTo({top:0,behavior:"smooth"});}
render();
</script>
