<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procédure douanière</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F5F5F5;color:#222;padding:1rem}
.container{max-width:680px;margin:0 auto}

.header{background:#1A5C38;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{color:#fff;font-size:17px;font-weight:600}
.header p{color:#A8D5BC;font-size:12px;margin-top:2px}
.score-box{text-align:right;color:#fff}
.score-box .pts{font-size:22px;font-weight:700;line-height:1}
.score-box .lbl{font-size:11px;color:#A8D5BC}

.progress-wrap{margin-bottom:1rem}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:6px}
.progress-bar{height:6px;background:#E0E0E0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#1A5C38;border-radius:3px;transition:width .3s}

.qcard{background:#fff;border:1px solid #E0E0E0;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:.75rem}
.qbadge{background:#1B4F8A;color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px}
.qtext{font-size:15px;font-weight:600;color:#222;line-height:1.5;margin-bottom:1rem}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid #E0E0E0;border-radius:8px;cursor:pointer;transition:all .15s;background:#fff}
.opt:hover:not(.locked){background:#F5F8FB;border-color:#1B4F8A}
.opt.sel{border-color:#1B4F8A;background:#E8F0FA}
.opt.ok{border-color:#1A5C38;background:#E8F5EE}
.opt.ko{border-color:#C0392B;background:#FCEBEB}
.letter{width:22px;height:22px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#666;flex-shrink:0;margin-top:1px}
.opt.sel .letter{background:#1B4F8A;color:#fff}
.opt.ok .letter{background:#1A5C38;color:#fff}
.opt.ko .letter{background:#C0392B;color:#fff}
.otext{font-size:14px;color:#222;line-height:1.45}

.expl{margin-top:.85rem;padding:.75rem 1rem;background:#F5F8FB;border-left:3px solid #1B4F8A;border-radius:0 6px 6px 0;font-size:13px;color:#444;line-height:1.5}
.expl strong{color:#1A5C38}

.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:#fff;border:1px solid #ccc;border-radius:8px;padding:10px 18px;font-size:14px;color:#222;cursor:pointer;transition:all .15s}
.btn:hover:not(:disabled){border-color:#1A5C38;color:#1A5C38}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#1A5C38;color:#fff;border-color:#1A5C38}
.btn.primary:hover{background:#14492C}
.qcount{font-size:13px;color:#666;font-weight:600}

.result-card{display:none;background:#fff;border:1px solid #E0E0E0;border-radius:12px;padding:1.5rem;text-align:center}
.result-score{font-size:36px;font-weight:700;color:#1A5C38}
.result-sub{font-size:14px;color:#666;margin:6px 0 4px}
.result-msg{font-size:14px;color:#444;margin:10px 0 16px}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>Procédure douanière</h1>
      <p>20 questions · ordre fixe (annale)</p>
    </div>
    <div class="score-box">
      <div class="pts" id="score">0</div>
      <div class="lbl">/ 20</div>
    </div>
  </div>

  <div class="progress-wrap" id="pwrap">
    <div class="progress-info">
      <span id="qtop">Question 1 sur 20</span>
      <span id="answered">0 répondues</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
  </div>

  <div id="qzone"></div>
  <div class="result-card" id="result"></div>

  <div class="nav" id="nav">
    <button class="btn" id="bprev" onclick="go(-1)" disabled>&larr; Précédent</button>
    <span class="qcount" id="qcount">1 / 20</span>
    <button class="btn primary" id="bnext" onclick="go(1)">Suivant &rarr;</button>
  </div>

</div>
<script>
const Q = [{"q": "Le feuillet n°4 du DAU peut valoir :", "o": ["T2L – T2LF", "Bon à enlever (BAE)", "Attestation de sortie", "Note de valeur"], "a": 0, "e": "Le document précise que « N°4 – exemplaire valant – T2L – T2LF »."}, {"q": "Le DAU import pour un pays tiers porte le code :", "o": ["EX", "IM", "CO", "EU"], "a": 1, "e": "IM = importation en provenance directe de pays tiers autres que les membres de l'AELE."}, {"q": "Le DAU export vers un DOM porte le code :", "o": ["EX", "EU", "CO", "IM"], "a": 2, "e": "CO = échanges de marchandises « communautaires » avec des territoires UE exclus du territoire fiscal (DOM)."}, {"q": "Le code « A » en 2ème sous-case correspond à :", "o": ["Déclaration incomplète", "Déclaration simplifiée anticipée", "Déclaration complémentaire", "Déclaration de droit commun"], "a": 3, "e": "A = déclaration de droit commun."}, {"q": "Le système ECS repose notamment sur :", "o": ["La transmission télématique d'un avis anticipé d'exportation au bureau de sortie de l'UE", "Le calcul automatique de la TVA à l'import", "La délivrance du carnet ATA", "L'attribution du numéro EORI"], "a": 0, "e": "Le système ECS repose sur l'avis anticipé d'exportation transmis au bureau de sortie de l'UE."}, {"q": "L'EAD (export accompanying document) comporte :", "o": ["Un numéro SIRET", "Un numéro de référence du mouvement (MRN)", "Un code TARIC uniquement", "Le numéro de transit T2"], "a": 1, "e": "L'EAD est édité avec un numéro de référence du mouvement MRN."}, {"q": "Le transit T2 correspond à :", "o": ["La circulation de marchandises tierces sous douane entre 2 bureaux UE", "La mise en libre pratique avec paiement différé", "La circulation de marchandise CEE entre 2 bureaux via AELE", "L'exportation temporaire avec carnet ATA"], "a": 2, "e": "T2 = circulation marchandise CEE entre 2 bureaux via AELE."}, {"q": "La case 22 du DAU correspond à :", "o": ["La valeur en douane", "La valeur statistique", "La valeur fiscale (base TVA)", "La valeur transactionnelle (valeur facture selon l'Incoterm)"], "a": 3, "e": "Case 22 = valeur transactionnelle = valeur facture selon l'Incoterm."}, {"q": "La case 46 du DAU correspond à :", "o": ["La valeur statistique (base stats nationales)", "La base des droits de douane", "La base TVA import", "Le prix de l'article pour la nomenclature"], "a": 0, "e": "Case 46 = valeur statistique (base statistiques nationales)."}, {"q": "DELTA P sert à :", "o": ["Le dédouanement en procédure de droit commun", "La déclaration sommaire du manifeste aérien", "Le dédouanement occasionnel", "Le dédouanement du fret express"], "a": 1, "e": "DELTA P = déclaration sommaire du manifeste aérien."}, {"q": "DELTA D permet notamment :", "o": ["Uniquement le paiement comptant des droits", "La suppression de toute déclaration", "Un accès 24h/24, 7j/7 et l'obtention rapide du bon à enlever", "Le contrôle systématique des marchandises"], "a": 2, "e": "DELTA D permet un accès 24h/24, 7j/7 et l'obtention rapide du BAE."}, {"q": "Une déclaration anticipée via DELTA D peut être déposée jusqu'à :", "o": ["5 jours avant l'arrivée du moyen de transport", "15 jours avant l'arrivée du moyen de transport", "30 jours avant l'arrivée du moyen de transport", "10 jours avant l'arrivée du moyen de transport"], "a": 3, "e": "Possibilité de déclarer par anticipation 10 jours avant l'arrivée du moyen de transport."}, {"q": "Le calcul des droits de douane prend en compte :", "o": ["La nature de la marchandise (nomenclature) et son origine", "Uniquement le poids brut de la marchandise", "Uniquement le mode de transport", "Uniquement la devise de facturation"], "a": 0, "e": "Le calcul prend en compte la nature (nomenclature) et l'origine de la marchandise."}, {"q": "Le crédit de droits sous forme d'obligations cautionnées porte le délai de paiement à :", "o": ["1 mois", "4 mois", "2 mois", "3 mois"], "a": 1, "e": "Le délai de paiement est porté à 4 mois."}, {"q": "Pour bénéficier du régime 42, la mention spéciale à faire figurer sur le DAU est :", "o": ["« Franchise totale de droits »", "« Régime suspensif de TVA article 256 »", "« Exonération de la TVA article 291-III-4° du CGI »", "« Transit T1 dispensé de garantie »"], "a": 2, "e": "La mention « exonération de la TVA article 291-III-4° du CGI » doit figurer sur le DAU."}, {"q": "Le régime 42 dispense :", "o": ["De toute déclaration en douane", "Du paiement des droits de douane", "De l'établissement d'une DEB", "De titre de transit sous douane et de formalité douanière à destination"], "a": 3, "e": "Ce régime dispense de titre de transit sous douane et de formalité douanière à destination."}, {"q": "À l'exportation dans la procédure fluvio-maritime, l'exportateur peut obtenir le justificatif de sortie de l'UE :", "o": ["Dès l'établissement de la déclaration en douane d'exportation", "Seulement après contrôle physique systématique", "Uniquement après 45 jours", "Jamais sans carnet ATA"], "a": 0, "e": "Le justificatif de sortie peut être obtenu dès l'établissement de la déclaration d'exportation."}, {"q": "Le carnet ATA est délivré par :", "o": ["Le service des douanes directement", "Une association garante agréée affiliée à la fédération mondiale des chambres de commerce", "La Chambre de Commerce Internationale (ICC) uniquement", "L'opérateur économique agréé"], "a": 1, "e": "Délivré par une association garante agréée, affiliée à la fédération mondiale des chambres de commerce (en France, les CCI)."}, {"q": "Parmi les avantages de l'OEA figure :", "o": ["La suppression définitive de tout contrôle douanier", "L'exonération automatique de TVA", "Un accès plus rapide à des facilités (dédouanement centralisé, dispense de garantie) et des taux réduits de contrôles", "La dispense d'immatriculation EORI"], "a": 2, "e": "L'OEA donne un accès plus rapide à des facilités et des taux réduits de contrôle."}, {"q": "Le numéro EORI doit notamment figurer sur :", "o": ["Le permis de conduire du chauffeur", "La facture commerciale uniquement", "Le certificat ATR", "Le carnet TIR pour l'identification de l'opérateur"], "a": 3, "e": "Il doit figurer sur le carnet TIR pour l'identification de l'opérateur."}];
const letters = ["a","b","c","d"];
let cur = 0;
let answers = new Array(Q.length).fill(null);
let locked = new Array(Q.length).fill(false);

function render() {
  const q = Q[cur];
  document.getElementById("qtop").textContent = "Question " + (cur+1) + " sur " + Q.length;
  document.getElementById("qcount").textContent = (cur+1) + " / " + Q.length;
  document.getElementById("pfill").style.width = Math.round((cur+1)/Q.length*100) + "%";
  document.getElementById("answered").textContent = locked.filter(Boolean).length + " répondues";

  let html = '<div class="qcard"><div class="qhead"><span class="qbadge">Q' + (cur+1) + '</span></div>';
  html += '<div class="qtext">' + q.q + '</div><div class="opts">';

  q.o.forEach((opt, i) => {
    let cls = "opt";
    if (locked[cur]) {
      cls += " locked";
      if (i === q.a) cls += " ok";
      else if (i === answers[cur]) cls += " ko";
    } else if (i === answers[cur]) {
      cls += " sel";
    }
    html += '<div class="' + cls + '" onclick="pick(' + i + ')">'
          + '<div class="letter">' + letters[i] + '</div>'
          + '<div class="otext">' + opt + '</div></div>';
  });

  html += '</div>';
  if (locked[cur]) {
    html += '<div class="expl"><strong>Réponse correcte : ' + letters[q.a] + ') ' + q.o[q.a] + '.</strong><br>' + q.e + '</div>';
  }
  html += '</div>';

  document.getElementById("qzone").innerHTML = html;
  document.getElementById("bprev").disabled = (cur === 0);

  const bnext = document.getElementById("bnext");
  if (cur === Q.length - 1) {
    bnext.textContent = "Voir les résultats";
    bnext.onclick = showResult;
  } else {
    bnext.textContent = "Suivant →";
    bnext.onclick = function() { go(1); };
  }
  updateScore();
}

function pick(i) {
  if (locked[cur]) return;
  answers[cur] = i;
  locked[cur] = true;
  render();
}

function go(d) {
  if (cur + d < 0 || cur + d > Q.length - 1) return;
  cur += d;
  render();
}

function updateScore() {
  let ok = 0;
  for (let i = 0; i < Q.length; i++) if (locked[i] && answers[i] === Q[i].a) ok++;
  document.getElementById("score").textContent = ok;
}

function showResult() {
  let ok = 0;
  for (let i = 0; i < Q.length; i++) if (answers[i] === Q[i].a) ok++;
  const ko = Q.length - ok;
  const pct = Math.round(ok / Q.length * 100);
  let msg;
  if (pct >= 80) msg = "Excellent niveau, tu maîtrises bien le module.";
  else if (pct >= 60) msg = "Bon niveau, quelques points à revoir avant l'examen.";
  else msg = "Des révisions sont nécessaires : relis les explications et recommence.";

  document.getElementById("qzone").innerHTML = "";
  document.getElementById("pwrap").style.display = "none";
  document.getElementById("nav").style.display = "none";

  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = '<div class="result-score">' + ok + ' / ' + Q.length + '</div>'
    + '<div class="result-sub">' + pct + '% de réussite</div>'
    + '<div class="result-msg">' + msg + '</div>'
    + '<button class="btn primary" onclick="restart()">Recommencer</button>';
}

function restart() {
  cur = 0;
  answers = new Array(Q.length).fill(null);
  locked = new Array(Q.length).fill(false);
  document.getElementById("pwrap").style.display = "block";
  document.getElementById("nav").style.display = "flex";
  document.getElementById("result").style.display = "none";
  render();
}

render();
</script>
</body>
</html>
