<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">QCM Commissionnaire de transport</p>
<h1>Commissionnaire · Série 2</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"q":"La C.M.R. (Convention Marchandises par Route) s'applique lors d'un transport :","o":["frigorifique entre l'Allemagne et la Belgique","funéraire entre deux pays signataires","international postal","de déménagement entre deux pays signataires"],"c":0,"r":["La CMR s'applique de plein droit à tout transport routier de marchandises à titre onéreux entre deux pays dont l'un au moins est signataire (ex. Allemagne-Belgique)."]},{"q":"En régime de transit communautaire, la personne apportant une garantie et présentant une caution est obligatoirement :","o":["l'expéditeur ou le destinataire","un transitaire","le transporteur","le principal obligé"],"c":3,"r":["En transit communautaire, le principal obligé est la personne qui souscrit la déclaration et fournit la garantie bancaire."]},{"q":"Le commissionnaire de transport :","o":["est pénalement responsable des fautes des transporteurs qui effectuent les transports","dispose d'un droit de rétention sur les marchandises en garantie de toutes les créances dues par le donneur d'ordre","dispose d'un droit de rétention sur les marchandises en garantie seulement du prix du transport en cours","peut confier ses transports à un loueur de véhicules industriels avec conducteur sous réserve de l'établissement d'un contrat de location"],"c":1,"r":["Le commissionnaire dispose d'un privilège et d'un droit de rétention sur les marchandises pour l'ensemble de ses créances de commission."]},{"q":"Afin de bénéficier du régime préférentiel entre l'Union européenne et le Maroc, l'importateur français devra présenter à la douane française :","o":["une facture commerciale visée par la douane marocaine","un certificat de circulation EUR 1","un certificat d'origine délivré par la Chambre française de commerce et d'industrie du Maroc","un certificat d'inspection sanitaire et phytosanitaire émis par la douane marocaine"],"c":1,"r":["L'origine préférentielle permet à une marchandise importée d'un pays tiers de bénéficier d'un taux de droits de douane réduit ou nul, sur présentation d'un EUR.1."]},{"q":"L'assurance F.A.P. couvre :","o":["tous les dommages matériels causés à la marchandise","tous les préjudices autres que matériels (retards)","tous les préjudices survenant à la suite d'événements énumérés dans la police","seulement les préjudices survenant à la suite d'un cas d'exonération de la responsabilité du transporteur"],"c":2,"r":["La garantie F.A.P. Sauf (« Franc d'Avaries Particulières sauf ») est une garantie « événements caractérisés » : elle ne couvre que les dommages causés par une liste d'événements limitativement énumérés dans le contrat."]},{"q":"En cas de dommage aux marchandises transportées ayant pour origine une faute lourde du transporteur choisi par le commissionnaire de transport, ce dernier vis-à-vis de l'expéditeur :","o":["peut dégager sa responsabilité","voit sa responsabilité majorée de 10 % des dommages causés à la marchandise","peut toujours bénéficier de la limitation d'indemnisation prévue au contrat de transport","est totalement responsable du dommage"],"c":3,"r":["Le commissionnaire est garant de ses substitués. En cas de faute lourde (ou intentionnelle) du transporteur substitué, le plafonnement d'indemnisation est inopérant : l'expéditeur a droit à la réparation intégrale de son préjudice réel."]},{"q":"Le droit de rétention du commissionnaire de transport s'applique :","o":["à des créances certaines et exigibles relatives à des opérations de douane","à toutes créances, certaines ou non","à des marchandises qu'il détient de bonne foi et pour des créances certaines même antérieures à l'opération en cours","aux marchandises dont le propriétaire est impliqué dans le transport en cours"],"c":2,"r":["Le droit de rétention s'applique aussi au paiement de créances antérieures, certaines, liquides et exigibles, dues par le même donneur d'ordre pour des prestations passées."]},{"q":"Une avarie commune concerne :","o":["des dommages causés à des envois de marchandises chargés en commun dans un engin de transport (camion, avion, navire…)","la répartition de la responsabilité sur tous les transporteurs ayant participé à une opération de transport pendant laquelle un dommage est survenu à la marchandise","une participation en nature ou en argent du propriétaire d'un navire et des propriétaires de la cargaison pour assurer la poursuite du voyage en cas de danger pour le navire et les marchandises","une assurance prise en commun par tous les transporteurs pour la réalisation d'une opération de transport multimodal"],"c":2,"r":["Principe du sacrifice d'intérêt commun (droit maritime) : lorsqu'une décision volontaire du capitaine sauve le navire et la cargaison face à un péril (ex. jeter des conteneurs à la mer), la perte est répartie proportionnellement entre le navire et les propriétaires de la cargaison."]},{"q":"Dans la facture du commissionnaire de transport, les frais d'assurance entrent sous la rubrique :","o":["frais de transport","frais de commissionnaire en douane","sommes acquittées à d'autres administrations","honoraires du commissionnaire en douane"],"c":0,"r":["Les frais d'assurance sont intégrés aux frais globaux de transport.","Les frais de commissionnaire en douane concernent l'accomplissement des formalités douanières ; les sommes à d'autres administrations sont les droits et taxes payés aux organismes publics."]},{"q":"En transport terrestre intérieur, le commissionnaire de transport qui veut engager une action récursoire contre le transporteur dispose :","o":["d'un délai d'un mois à compter de l'action principale","d'un délai de deux mois","d'un délai d'un an","d'un délai de dix ans"],"c":0,"r":["Les actions nées du contrat de transport ou de commission se prescrivent par un an.","Mais lorsque le commissionnaire est assigné par son client, il dispose d'un délai spécial d'un mois, à compter de cette assignation, pour se retourner (action récursoire) contre le transporteur qu'il avait mandaté."]},{"q":"Le transitaire-mandataire exerce une activité :","o":["réglementée par la loi sur la sous-traitance du 31 décembre 1992","réglementée par le décret du 5 mars 1990 modifié","réglementée par la Convention pour le transport de marchandises (CMR)","non réglementée"],"c":3,"r":["Le transitaire-mandataire exerce une profession non réglementée.","S'il effectue en plus des démarches en douane, il agit alors comme représentant en douane enregistré (RDE), activité encadrée par la douane."]},{"q":"En application de la loi sur la sous-traitance, le commissionnaire de transport peut, s'il fait travailler un sous-traitant à un prix manifestement trop bas, encourir une amende de :","o":["15 000 €","40 000 €","90 000 €","130 000 €"],"c":2,"r":["Pour une personne physique, l'amende peut atteindre 90 000 €."]},{"q":"Le commissionnaire en location, intermédiaire entre une entreprise de transport et une entreprise de location de véhicules industriels avec conducteur :","o":["doit être inscrit au registre des commissionnaires de transport","n'est pas inscrit au registre des commissionnaires de transport","doit être inscrit au registre des transporteurs et des loueurs","n'est pas inscrit au registre du commerce et des sociétés"],"c":1},{"q":"Dans le système de la « remise documentaire », les banques :","o":["ont une obligation de résultat dans l'encaissement des créances dont elles ont la charge","sont responsables de leurs fautes personnelles prouvées","sont responsables des fautes des tiers","sont responsables de la solvabilité de leur client"],"c":1,"r":["La remise documentaire n'offre aucune garantie de paiement : les banques n'ont qu'un rôle d'exécutant (obligation de moyens) et ne répondent que de leurs propres fautes."]},{"q":"La convention de Montréal stipule que le transporteur aérien est responsable de la marchandise :","o":["depuis la prise en charge jusqu'à la remise au destinataire figurant sur la L.T.A.","dès qu'elle est remise à l'agent de fret","dès qu'elle se trouve en zone aéroportuaire","dès qu'elle est chargée dans l'appareil"],"c":0,"r":["La responsabilité du transporteur aérien couvre toute la période pendant laquelle les marchandises se trouvent sous sa garde."]},{"q":"La demande d'ouverture d'un crédit documentaire est effectuée par :","o":["le vendeur à son banquier","le vendeur au banquier de l'acheteur","l'acheteur à son banquier","l'acheteur au banquier du vendeur"],"c":2,"r":["Le crédit documentaire (Credoc) est un engagement de la banque de l'acheteur à payer le vendeur sur présentation de documents conformes.","C'est donc l'acheteur (donneur d'ordre) qui en demande l'ouverture à sa banque."]},{"q":"Le crédit documentaire peut être annulé à la demande :","o":["du vendeur","des banquiers et de l'acheteur","de l'acheteur","du vendeur, de l'acheteur et des banquiers"],"c":3,"r":["Pour annuler ou modifier un crédit documentaire, il faut l'accord exprès et unanime de toutes les parties prenantes."]},{"q":"Le crédit documentaire transférable permet :","o":["des avances au bénéficiaire avant présentation des documents","au bénéficiaire initial de transférer les droits qu'il tient du crédit documentaire","des règlements automatiquement renouvelables, lorsque le paiement est échelonné dans le temps","au vendeur d'annuler le contrat à tout moment si les marchandises sont en cours de livraison"],"c":1,"r":["Le premier bénéficiaire cède à ses fournisseurs le bénéfice du paiement garanti par la banque, sous réserve de la remise des documents requis."]},{"q":"Le chargement des conteneurs en pontée :","o":["est prévu par la convention de Bruxelles","est prévu, sans condition, par la loi française","est prévu par la loi française, à condition que le transporteur ait obtenu le consentement du chargeur ou s'il s'agit d'un navire porte-conteneur","est systématiquement considéré comme un transport soumis à la convention de Hambourg"],"c":2,"r":["Le chargement en pontée est en principe interdit ou strictement encadré (marchandises plus exposées), sauf consentement exprès du chargeur ou navire spécialement équipé (porte-conteneurs)."]},{"q":"Le régime douanier qui confère à une marchandise originaire d'un pays tiers le caractère communautaire est :","o":["un perfectionnement actif","un perfectionnement passif","une mise à la consommation","une mise en libre pratique"],"c":3,"r":["La mise en libre pratique attribue le statut douanier de marchandise communautaire à un bien d'un pays tiers, après accomplissement des formalités d'importation et paiement des droits de douane.","La marchandise peut alors circuler librement dans l'UE."]},{"q":"Un commissionnaire de transport français fait effectuer un transport international de marchandises communautaires de Barcelone (Espagne) à Groningen (Pays-Bas) par un transporteur belge. Le transporteur doit établir au commissionnaire une facture :","o":["toutes taxes comprises (TTC) en faisant ressortir la TVA française (20 %)","toutes taxes comprises (TTC) en faisant ressortir la TVA belge (21 %)","toutes taxes comprises (TTC) en faisant ressortir la TVA espagnole (21 %)","hors taxes (H.T.), le commissionnaire devant auto-liquider la TVA auprès des services fiscaux français"],"c":3,"r":["En transport international B2B (entre assujettis à la TVA), le transporteur belge facture hors taxes.","Le commissionnaire français auto-liquide la TVA (20 %) sur sa propre déclaration, de façon fiscalement neutre."]},{"q":"Dans le cas d'un litige survenu lors de la partie maritime d'un transport combiné route-mer international (le dommage résultant incontestablement d'une faute du transporteur maritime), la responsabilité du transporteur routier :","o":["est engagée et la convention CMR reste applicable","est engagée mais selon les principes définis par la convention de Bruxelles","n'est plus engagée, le transporteur maritime devant répondre directement auprès de l'expéditeur","ne pourra être dégagée que s'il apporte la preuve d'une faute lourde du transporteur maritime"],"c":1,"r":["Le transporteur routier reste engagé vis-à-vis de son client, mais les conditions et plafonds d'indemnisation glissent vers les règles maritimes (convention de Bruxelles), le dommage étant survenu en mer.","Il se retourne ensuite contre le transporteur maritime."]},{"q":"Le contrat de transport aérien peut couvrir :","o":["les pré et post-acheminements effectués par la compagnie aérienne sous couvert d'une LTA","uniquement les pré-acheminements maritimes","uniquement les post-acheminements ferroviaires","les opérations de réparation de transport aérien effectuées par le commissionnaire de transport"],"c":0,"r":["Sous une LTA unique, la compagnie aérienne peut prendre en charge l'intégralité du trajet, y compris les pré et post-acheminements par route ou par fer."]},{"q":"Le commissionnaire de transport doit conserver les documents relatifs aux opérations d'affrètement pendant :","o":["2 ans (24 mois)","les 2 derniers exercices comptables précédant l'exercice en cours","3 ans (36 mois)","5 exercices"],"c":1},{"q":"Dans le cadre de l'accord d'association entre l'Union européenne et la Turquie, les importateurs doivent, pour bénéficier du régime préférentiel, présenter avec la déclaration d'importation :","o":["un certificat d'origine visé par la chambre de commerce","un certificat T2L","un certificat ATR ou certificat EUR1","un certificat modèle A"],"c":2,"r":["Le certificat A.TR (union douanière UE-Turquie) s'applique à la très grande majorité des produits industriels."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
