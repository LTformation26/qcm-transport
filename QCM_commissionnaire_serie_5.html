<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar"><div class="bar-inner">

<script>
const Q=[{"n":48,"q":"La déclaration européenne des services (D.E.S.) est un document fiscal :","o":["attaché à une importation","attaché à une exportation","attaché au transport d'une marchandise intracommunautaire","relatif au bouclier fiscal"],"c":2,"r":["La DES est l'imprimé fiscal pour déclarer les prestations de services intracommunautaires rendues en B2B."]},{"n":49,"q":"Dans un crédit documentaire, la banque :","o":["de l'acheteur s'engage à payer le vendeur s'il présente les documents requis","du vendeur crédite une somme d'argent dans un compte spécial appelé crédoc","de l'acheteur ne peut pas payer comptant mais à une échéance de 90 jours","du vendeur n'accepte que les paiements en DTS"],"c":0,"r":["Dans un crédit documentaire (CREDOC), la banque émettrice garantit le paiement sous réserve de présentation de documents strictement conformes."]},{"n":50,"q":"Pour échapper au plafond d'indemnité d'un transporteur substitué, le commettant a intérêt à :","o":["faire une déclaration de valeur ou d'intérêt","interdire la sous-traitance","ne rien faire car il n'est pas possible de relever ce plafond","choisir un incoterm « vente à l'arrivée »"],"c":0,"r":["Souscrire une déclaration d'intérêt spécial à la livraison permet d'élever la limite d'indemnisation au montant réel de la valeur déclarée."]},{"n":51,"q":"La « représentation directe » est caractéristique de l'activité d'un :","o":["commissionnaire affréteur","commissionnaire groupeur","commissionnaire agréé en douane","commissionnaire étranger"],"c":2,"r":["Le représentant en douane enregistré (ex-commissionnaire en douane) agit le plus souvent en représentation directe (au nom et pour le compte de son client)."]},{"n":52,"q":"Les droits de douane perçus à l'importation en France alimentent le budget :","o":["de l'État français","de l'Union européenne","des DOM/TOM","des conseils régionaux"],"c":1,"r":["Les droits de douane perçus aux frontières extérieures constituent des ressources propres du budget de l'Union européenne."]},{"n":53,"q":"Le contrat de transport maritime international :","o":["est toujours régi par la convention de Bruxelles","est toujours régi par la convention de Hambourg","est occasionnellement régi par la convention de Kyoto","peut prévoir une « Clause Paramount »"],"c":3,"r":["La clause Paramount, rédigée sur un titre de transport, soumet volontairement le contrat aux règles d'une convention spécifique (ex. Bruxelles-Visby)."]},{"n":54,"q":"Lors d'une vente CFR Sydney (Australie), c'est :","o":["au vendeur de payer le transport principal et de supporter les risques pendant le transport jusqu'à Sydney","à l'acheteur de payer le transport principal et de supporter les risques pendant le transport jusqu'à Sydney","à l'acheteur de faire procéder aux formalités de douane export","à l'acheteur de faire procéder aux formalités de douane import"],"c":3,"r":["En CFR, le vendeur paie le fret maritime jusqu'au port d'arrivée, mais le transfert de risque s'effectue au chargement à bord, et le dédouanement import reste à l'acheteur."]},{"n":55,"q":"Le commettant doit payer la facture du commissionnaire de transport au plus tard à :","o":["30 jours","45 jours","60 jours","90 jours"],"c":0,"r":["Les factures des commissionnaires de transport sont réglementées par l'art. L441-11 du Code de commerce (délai maximal de 30 jours)."]},{"n":56,"q":"Un industriel lyonnais confie à un commissionnaire l'organisation d'un transport de Lyon à Casablanca. La responsabilité du commissionnaire est engagée :","o":["du lieu d'expédition au quai de groupage","du quai de groupage au quai de dégroupage","du quai de dégroupage au lieu de destination","de bout en bout"],"c":3,"r":["La mission globale du commissionnaire consiste à organiser l'acheminement de la marchandise depuis son point de départ jusqu'à sa destination finale."]},{"n":57,"q":"Le commissionnaire de transport agit en son nom et pour :","o":["son compte","le compte d'autrui","le compte du transporteur","le compte de l'affréteur"],"c":1,"r":["Selon l'article L132-1 du Code de commerce, le commissionnaire agit en son propre nom mais pour le compte de son commettant."]},{"n":58,"q":"Le commissionnaire de transport est un intermédiaire entre :","o":["l'expéditeur et le transporteur","le transitaire et le transporteur","le transporteur et le destinataire","le courtier de fret et le transitaire"],"c":0,"r":["Le commissionnaire de transport n'est pas un transporteur physique mais un intermédiaire organisateur de transport."]},{"n":59,"q":"Parmi les régimes suivants, lequel ne peut pas être qualifié de régime suspensif :","o":["le transit","l'entrepôt","l'admission temporaire","la mise en libre pratique"],"c":3,"r":["La mise en libre pratique consiste à acquitter les droits de douane pour accorder le statut douanier communautaire à une marchandise tierce."]},{"n":60,"q":"Vous importez de Chine du matériel spécialisé pour la durée d'un chantier. Le régime douanier le mieux adapté est :","o":["le perfectionnement passif","l'importation","le perfectionnement actif","l'admission temporaire"],"c":3,"r":["L'admission temporaire permet d'importer des marchandises/matériels pour un usage déterminé, avec exonération des droits/TVA avant réexportation."]},{"n":61,"q":"L'affacturage (ou factoring) international consiste :","o":["en l'obtention d'une avance en devises auprès d'une banque permettant de disposer immédiatement d'une trésorerie","en l'acquisition auprès de sa banque du montant de sa créance en escomptant une traite tirée sur l'importateur","en la cession des créances commerciales à une société financière qui se charge de leur recouvrement moyennant frais et commissions","en l'obtention d'un prêt à court terme auprès de sa banque"],"c":2,"r":["L'affacturage (factoring) international consiste à transférer la gestion et le recouvrement des créances export à une société spécialisée (le « factor »)."]},{"n":62,"q":"Un agent de fret aérien agréé IATA peut émettre :","o":["des billets d'avion pour des passagers","des LTA pour le compte de toutes les compagnies aériennes","des LTA pour le compte seulement des compagnies aériennes adhérentes à IATA","des déclarations d'expéditions de marchandises dangereuses"],"c":2,"r":["L'agrément IATA habilite l'agent de fret à émettre des LTA au nom et pour le compte des seules compagnies aériennes membres de l'IATA."]},{"n":63,"q":"L'opérateur économique agréé (O.E.A.) est :","o":["un service de l'administration des douanes","obligatoirement un « chargeur »","uniquement un commissionnaire de transport","un chargeur ou un commissionnaire de transport"],"c":3,"r":["Le statut d'Opérateur Économique Agréé (OEA) est accessible à tout acteur de la chaîne logistique internationale établi dans l'UE."]},{"n":64,"q":"Le statut d'opérateur économique agréé (O.E.A.) certifie le respect :","o":["des règles douanières seulement","des règles de sûreté seulement","des règles douanières et/ou des règles de sûreté","des règles économiques"],"c":2,"r":["Le statut OEA atteste de la conformité douanière (OEA-C), de la sécurité/sûreté (OEA-S), ou cumule les deux volets (OEA-Complet)."]},{"n":65,"q":"Les procédures douanières « Delta » se font :","o":["sur des documents spécifiques","par voie informatique","par courrier","par e-mail"],"c":1,"r":["La suite applicative Delta regroupe les téléservices de la douane française dédiés au dédouanement informatisé des marchandises."]},{"n":66,"q":"Lors d'une vente DEQ :","o":["les formalités douanières à l'exportation sont à la charge de l'acheteur","les formalités douanières à l'import sont à la charge de l'acheteur","le transport principal est à la charge de l'acheteur","le déchargement à quai au port de destination est à la charge de l'acheteur"],"c":1,"r":["L'ancien Incoterm maritime DEQ (Delivered Ex Quay) prévoyait la livraison marchandise déchargée sur quai au port de destination (remplacé aujourd'hui par DPU)."]},{"n":67,"q":"Vous vendez CPT New York Kennedy (USA), vous devrez fournir les documents suivants :","o":["LTA, liste de colisage, certificat d'origine","AWB, assurance, certificat d'origine","connaissement, assurance, liste de colisage","FBL, assurance, certificat de conformité"],"c":0,"r":["En CPT par voie aérienne, l'exportateur remet le document de transport principal (LTA), la facture, le colisage et les justificatifs d'origine."]},{"n":68,"q":"La clause paramount est :","o":["une clause soumettant le contrat de transport au droit américain","une clause concernant le transport de films","une clause qui oblige le transporteur à prendre une assurance pour couvrir la marchandise durant le pré/post-acheminement","une clause par laquelle les parties acceptent de se soumettre à certaines dispositions d'une autre convention"],"c":3,"r":["La clause Paramount est la stipulation contractuelle désignant la convention internationale régissant les droits et devoirs du titre de transport."]},{"n":69,"q":"Si votre client réclame une date de livraison à Izmir (Turquie), que la marchandise doit être acheminée par avion depuis Paris-Roissy CDG et que vous voulez payer le fret et l'assurance, vous choisirez l'incoterm suivant :","o":["FOB","CPT","CIP","DDU"],"c":2,"r":["Pour un transport aérien intégrant le paiement du fret et la couverture d'assurance au profit de l'acheteur, l'Incoterm requis est CIP."]},{"q":"L'injonction de payer est :","o":["un effet de commerce","une ordonnance du président du tribunal de commerce ou du tribunal judiciaire","une lettre recommandée adressée par le créancier à son débiteur et exigeant le paiement immédiat de la créance","une sommation signifiée par voie d'huissier"],"c":1,"r":["L'injonction de payer est une décision rendue par un juge (ordonnance sur requête) : décision provisoire prise sans entendre l'adversaire, que celui-ci pourra ensuite contester.","La lettre recommandée ou la sommation d'huissier ne sont, elles, que de simples mises en demeure."]},{"q":"La procédure de sauvegarde est :","o":["une procédure réservée à une entreprise en cessation des paiements afin de lui permettre de continuer son activité","une procédure collective mettant fin à l'activité de l'entreprise pour rembourser les créanciers en vendant ses biens","une procédure collective réservée aux entreprises qui ne sont pas encore en cessation des paiements","une mesure provisoire prise par le juge de manière non contradictoire sur simple requête"],"c":2,"r":["La procédure de sauvegarde s'adresse à une entreprise ayant des difficultés qu'elle ne peut surmonter, mais qui n'est pas encore en cessation des paiements."]},{"q":"La Cotisation Foncière des Entreprises (CFE) est :","o":["un impôt local destiné aux communes, assis sur la valeur locative des biens immobiliers utilisés par l'entreprise","un impôt national destiné à financer le budget de l'État, calculé sur le chiffre d'affaires de l'entreprise","une taxe obligatoire prélevée uniquement sur les bénéfices nets réalisés par les sociétés de capitaux","une cotisation sociale prélevée sur la masse salariale pour financer la sécurité sociale des indépendants"],"c":0,"r":["La CFE est un impôt local destiné à financer les communes, assis sur la valeur locative des biens immobiliers utilisés par l'entreprise pour son activité."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
