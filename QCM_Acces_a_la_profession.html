<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM Accès à la profession</title>
<style>
  :root { --texte:#0F2A1D; --sapin:#095228; --rouge:#C62828; --vert-ok:#1e7d45; --fond-ok:#e7f4ec; --fond-ko:#fbeaea; --filet:#cfd8d2; --gris:#5d6f64; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--texte); font-family: Verdana, "DejaVu Sans", sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 30px; }
  header { display:flex; align-items:center; gap:14px; border-bottom: 3px solid var(--sapin); padding-bottom: 12px; margin-bottom: 18px; }
  header img { width: 52px; height: auto; }
  header .marque { font-size: 13px; color: var(--gris); letter-spacing: .5px; }
  header h1 { margin: 0; font-size: 22px; color: var(--sapin); line-height:1.2; }
  .progres { display:flex; justify-content:space-between; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: #e3e9e5; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .barre div { height: 100%; width: 0; background: var(--sapin); transition: width .3s; }
  .question { font-size: 19px; font-weight: bold; margin: 0 0 18px; white-space: pre-line; }
  .question::after { content:""; display:block; width:48px; border-top: 3px solid var(--rouge); margin-top: 10px; }
  .choix { display:flex; flex-direction:column; gap: 10px; }
  .choix button { text-align:left; font: inherit; color: var(--texte); background:#fff; border: 1.5px solid var(--filet); border-radius: 8px; padding: 13px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .choix button:hover:not(:disabled) { border-color: var(--sapin); }
  .choix button .l { font-weight:bold; color: var(--sapin); min-width: 20px; }
  .choix button:disabled { cursor: default; }
  .choix button.ok { background: var(--fond-ok); border-color: var(--vert-ok); }
  .choix button.ko { background: var(--fond-ko); border-color: var(--rouge); }
  .retour { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--sapin); display:none; }
  .retour.ko { border-left-color: var(--rouge); }
  .retour .exp { white-space: pre-line; }
  .retour .titre { font-weight: bold; color: var(--rouge); }
  .retour .titre:empty { display: none; }
  .retour.okk .titre { color: var(--vert-ok); }
  .retour.ko .titre { color: var(--rouge); }
  .actions { margin-top: 22px; text-align: right; }
  .btn { font: inherit; font-weight: bold; background: var(--sapin); color:#fff; border: none; border-radius: 8px; padding: 12px 24px; cursor:pointer; }
  .btn:hover { background: #0b6a32; }
  .btn[hidden] { display:none; }
  .resultat { text-align:center; padding-top: 10px; }
  .resultat .score { font-size: 56px; font-weight: bold; color: var(--sapin); line-height:1.1; }
  .resultat .sur { color: var(--gris); margin-bottom: 14px; }
  .resultat .msg { font-size: 18px; margin-bottom: 22px; }
  @media (max-width: 520px) { body { font-size: 16px; } .question { font-size: 17px; } header h1 { font-size: 19px; } }
</style>
</head>
<body>
<div class="wrap">

    <div><div class="marque">Kaply Academy · Réglementation du transport</div><h1>QCM Accès à la profession</h1></div>
  </header>
  <div id="zone"></div>
</div>
<script>
const QUESTIONS = [
  { q: "Une entreprise possède, en transport national :\n1 véhicule de 12 T de PMA\n3 véhicules de 3,5 T de PTAC\nQuels titres d'exploitation doivent être délivrés ?",
    r: ["une copie de licence communautaire et trois copies de licence de transport intérieur", "quatre copies de licence communautaire", "trois licences communautaires et une licence intérieure", "quatre licences de transport intérieur"], b: 0,
    e: "Le véhicule de plus de 3,5 t est couvert par une copie de licence communautaire, les véhicules de 3,5 t ou moins en national par une copie de licence de transport intérieur.", u: true },
  { q: "Une entreprise possède 2 véhicules de plus de 3,5 T et 3 véhicules de moins de 3,5 T.\nQuel est le montant de capacité financière exigé ?",
    r: ["16 700 €", "17 800 €", "18 600 €", "19 800 €"], b: 0,
    e: "9 000 + 5 000 + 900 + 900 + 900 = 16 700 €", u: true },
  { q: "L'obligation d'établissement implique notamment :",
    r: ["que tous les véhicules appartiennent à l'entreprise", "les documents liés à l'activité soient conservés dans les locaux de l'entreprise", "que les documents soient conservés chez l'expert-comptable", "que les véhicules soient stationnés au siège social"], b: 1,
    e: "L'entreprise doit disposer de locaux contenant les documents en rapport avec son activité, mis à la disposition des agents de contrôle.", u: false },
  { q: "La capacité professionnelle du gestionnaire de transport peut être obtenue :",
    r: ["uniquement par examen écrit", "uniquement par diplôme", "uniquement par expérience professionnelle", "par examen, diplôme ou expérience reconnue"], b: 3,
    e: "Trois possibilités : examen écrit, diplôme national de transport, ou expérience de gestion continue d'une entreprise de transport.", u: false },
  { q: "L'attestation de capacité professionnelle peut être attribuée par équivalence aux personnes ayant géré une entreprise de transport pendant :",
    r: ["5 ans avant le 4 décembre 2009", "8 ans avant 2010", "10 ans avant le 4 décembre 2009", "15 ans avant 2010"], b: 2,
    e: "Il faut avoir géré de manière continue une entreprise de transport durant les dix années précédant le 4 décembre 2009.", u: false },
  { q: "Parmi les missions du gestionnaire de transport figure :",
    r: ["la fixation des prix de vente", "la gestion et l'entretien des véhicules", "la gestion des stocks de marchandises", "la négociation bancaire"], b: 1,
    e: "Ses missions : gestion et entretien des véhicules, vérification des contrats et documents de transport, comptabilité de base, affectation des chargements et vérification des procédures de sécurité.", u: true },
  { q: "L'exigence d'honorabilité professionnelle doit être respectée notamment par :",
    r: ["uniquement le gestionnaire de transport", "uniquement les conducteurs", "uniquement les actionnaires majoritaires", "l'entreprise et ses dirigeants"], b: 3,
    e: "L'entreprise, son gestionnaire de transport et ses dirigeants (commerçant, gérant, associés, président…) doivent satisfaire à l'honorabilité.", u: true },
  { q: "La perte d'honorabilité peut intervenir notamment en cas :",
    r: ["d'une seule contravention routière", "de condamnations inscrites au bulletin n°2 du casier judiciaire", "d'un retard de livraison", "d'un contrôle technique défavorable"], b: 1,
    e: "Elle peut intervenir après plusieurs condamnations mentionnées au bulletin n° 2 du casier judiciaire.", u: false },
  { q: "La décision de perte d'honorabilité est prise par :",
    r: ["le tribunal de commerce", "la DREAL", "le préfet de région", "la commission européenne"], b: 2,
    e: "C'est le préfet de région, après avis de la CTSA (Commission Territoriale des Sanctions Administratives).", u: true },
  { q: "Avant la décision de perte d'honorabilité, la personne concernée dispose pour présenter ses observations d'un délai de :",
    r: ["8 jours", "10 jours", "15 jours", "30 jours"], b: 2,
    e: "Elle dispose de quinze jours pour présenter ses observations écrites ou orales.", u: false },
  { q: "Pour un véhicule de plus de 3,5 tonnes, la capacité financière exigée pour le premier véhicule est de :",
    r: ["5 000 €", "7 500 €", "9 000 €", "10 000 €"], b: 2,
    e: "9 000 € pour le premier véhicule de plus de 3,5 t.", u: false },
  { q: "Pour chaque véhicule supplémentaire de plus de 3,5 tonnes, la capacité financière exigée est de :",
    r: ["3 000 €", "4 000 €", "5 000 €", "6 000 €"], b: 2,
    e: "5 000 € pour chacun des véhicules suivants de plus de 3,5 t.", u: false },
  { q: "Pour les véhicules n'excédant pas 3,5 tonnes, la capacité financière exigée pour le premier véhicule est de :",
    r: ["900 €", "1 200 €", "1 500 €", "1 800 €"], b: 3,
    e: "1 800 € pour le premier véhicule, puis 900 € pour chacun des suivants.", u: true },
  { q: "La capacité financière doit être vérifiée :",
    r: ["uniquement à la création de l'entreprise", "uniquement lors d'un contrôle administratif", "à la création et à la clôture de chaque exercice", "tous les cinq ans"], b: 2,
    e: "La vérification s'effectue au moment de la création de l'entreprise puis à la clôture de chaque exercice comptable.", u: false },
  { q: "La durée de validité de la licence communautaire est en principe de :",
    r: ["3 ans", "5 ans", "7 ans", "10 ans"], b: 3,
    e: "10 ans, renouvelables. Elle peut être délivrée pour une période plus courte.", u: true },
  { q: "L'original de la licence doit être conservé :",
    r: ["dans le véhicule", "au siège de l'entreprise", "chez l'expert-comptable", "à la préfecture"], b: 1,
    e: "L'original est conservé dans l'établissement de l'entreprise ; seule une copie se trouve à bord du véhicule.", u: true },
  { q: "Avec un véhicule de 3t 500 de PMA quel document, utile en France n'est pas valable dans le reste de l'U.E. :",
    r: ["une CEMT", "une licence communautaire", "une licence de transport extérieur", "une licence de transport intérieur"], b: 3,
    e: "La licence de transport intérieur ne couvre que le transport en France.", u: false },
  { q: "Dans la location avec conducteur, qui maîtrise les opérations de transport ?",
    r: ["le conducteur", "le locataire", "le loueur", "le client"], b: 1,
    e: "Le locataire maîtrise les opérations de transport, le loueur les opérations de conduite.", u: true },
  { q: "Le contrat de location avec conducteur doit se trouver :",
    r: ["au siège uniquement", "dans le bureau du gestionnaire", "à bord du véhicule", "chez l'assureur"], b: 2,
    e: "Le contrat (ou la feuille de location) doit impérativement se trouver à bord du véhicule, sinon amende de 1 500 €.", u: true }
];
const POINTS = 2, LETTRES = ["A","B","C","D"];
let ordre = [], i = 0, score = 0;
const zone = document.getElementById("zone");

function melange(t) { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; }

function demarrer() {
  ordre = melange(QUESTIONS.map((q, k) => {
    const idx = melange([0, 1, 2, 3]);
    return { q: q.q, e: q.e, u: q.u, r: idx.map(n => q.r[n]), b: idx.indexOf(q.b) };
  }));
  i = 0; score = 0; afficher();
}

function afficher() {
  const Q = ordre[i], n = ordre.length;
  zone.innerHTML = `
    <div class="progres"><span>Question ${i + 1} / ${n}</span><span>${score} / ${n * POINTS} points</span></div>
    <div class="barre"><div style="width:${(i / n) * 100}%"></div></div>
    <p class="question"></p>
    <div class="choix"></div>
    <div class="retour"><div class="titre"></div><div class="exp"></div></div>
    <div class="actions"><button class="btn" id="suivant" hidden>${i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button></div>`;
  zone.querySelector(".question").textContent = Q.q;
  const choix = zone.querySelector(".choix");
  Q.r.forEach((txt, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="l">${LETTRES[k]}.</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => repondre(k);
    choix.appendChild(b);
  });
}

function repondre(k) {
  const Q = ordre[i], btns = zone.querySelectorAll(".choix button"), ret = zone.querySelector(".retour");
  btns.forEach(b => b.disabled = true);
  btns[Q.b].classList.add("ok");
  if (k === Q.b) {
    score += POINTS;
    ret.className = "retour okk";
  } else {
    btns[k].classList.add("ko");
    ret.className = "retour ko";
  }
  const faux = (k !== Q.b);
  ret.querySelector(".titre").textContent = faux ? "Mauvaise réponse" : "";
  ret.querySelector(".exp").textContent = Q.e;
  if (faux || Q.u) ret.style.display = "block";
  zone.querySelector(".progres span:last-child").textContent = `${score} / ${ordre.length * POINTS} points`;
  const s = document.getElementById("suivant");
  s.hidden = false;
  s.onclick = () => { i++; i < ordre.length ? afficher() : resultat(); };
}

function resultat() {
  const total = ordre.length * POINTS, pct = score / total;
  const msg = pct >= 0.8 ? "Très bon résultat, vous maîtrisez l'accès à la profession."
            : pct >= 0.5 ? "Résultat correct. Relisez le cours sur les points où vous vous êtes trompé."
            : "Résultat insuffisant. Reprenez le cours « Accès à la profession » avant de recommencer.";
  zone.innerHTML = `
    <div class="barre"><div style="width:100%"></div></div>
    <div class="resultat">
      <div class="score">${score}</div><div class="sur">sur ${total} points</div>
      <div class="msg">${msg}</div>
      <button class="btn" id="recommencer">Recommencer le QCM</button>
    </div>`;
  document.getElementById("recommencer").onclick = demarrer;
}

demarrer();
</script>
</body>
</html>
