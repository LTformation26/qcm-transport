<title>Annale 2026 – QCM</title>
<style>
  :root { --texte:#0F2A1D; --sapin:#095228; --rouge:#C62828; --vert-ok:#1e7d45; --fond-ok:#e7f4ec; --fond-ko:#fbeaea; --filet:#cfd8d2; --gris:#5d6f64; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--texte); font-family: Verdana, "DejaVu Sans", sans-serif; font-size:17px; line-height:1.5; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 30px; }
  header { display:flex; align-items:center; gap:14px; border-bottom: 3px solid var(--sapin); padding-bottom: 12px; margin-bottom: 18px; }
  header img { width: 52px; height: auto; }
  header .marque { font-size: 13px; color: var(--gris); letter-spacing: .5px; }
  header h1 { margin: 0; font-size: 22px; color: var(--sapin); line-height:1.2; }
  .progres { display:flex; justify-content:space-between; font-size: 13px; color: var(--gris); margin-bottom: 6px; }
  .barre { height: 6px; background: #e3e9e5; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .barre div { height: 100%; width: 0; background: var(--sapin); transition: width .3s; }
  .question { font-size: 19px; font-weight: bold; margin: 0 0 18px; white-space: pre-line; }
  .question::after { content:""; display:block; width:48px; border-top: 3px solid var(--rouge); margin-top: 10px; }
  .choix { display:flex; flex-direction:column; gap: 10px; }
  .choix button { text-align:left; font: inherit; color: var(--texte); background:#fff; border: 1.5px solid var(--filet); border-radius: 8px; padding: 13px 16px; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .choix button:hover:not(:disabled) { border-color: var(--sapin); }
  .choix button .l { font-weight:bold; color: var(--sapin); min-width: 20px; }
  .choix button:disabled { cursor: default; }
  .choix button.ok { background: var(--fond-ok); border-color: var(--vert-ok); }
  .choix button.ko { background: var(--fond-ko); border-color: var(--rouge); }
  .retour { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--sapin); display:none; }
  .retour.ko { border-left-color: var(--rouge); }
  .retour .exp { white-space: pre-line; }
  .retour .titre { font-weight: bold; color: var(--rouge); }
  .retour .titre:empty { display: none; }
  .retour.okk .titre { color: var(--vert-ok); }
  .retour.ko .titre { color: var(--rouge); }
  .actions { margin-top: 22px; text-align: right; }
  .btn { font: inherit; font-weight: bold; background: var(--sapin); color:#fff; border: none; border-radius: 8px; padding: 12px 24px; cursor:pointer; }
  .btn:hover { background: #0b6a32; }
  .btn[hidden] { display:none; }
  .resultat { text-align:center; padding-top: 10px; }
  .resultat .score { font-size: 56px; font-weight: bold; color: var(--sapin); line-height:1.1; }
  .resultat .sur { color: var(--gris); margin-bottom: 14px; }
  .resultat .msg { font-size: 18px; margin-bottom: 22px; }
  @media (max-width: 520px) { body { font-size: 16px; } .question { font-size: 17px; } header h1 { font-size: 19px; } }
</style>
</head>

<script>
const QUESTIONS = [
  {"q": "Question 1. Quand une personne a pris en gérance libre une entreprise, cela signifie qu'elle est au moins locataire :", "r": ["du fonds de commerce", "du local commercial", "du matériel", "de l'ensemble fonds de commerce + local commercial"], "b": 0, "e": "La gérance libre est une location du fonds de commerce : le gérant exploite à ses risques, en payant une redevance.", "u": false},
  {"q": "Question 2. La responsabilité du transporteur routier de marchandises peut être recherchée par son donneur d'ordre :", "r": ["toujours lorsqu'il y a mauvaise exécution du contrat de transport, que ce soit du fait du transporteur ou de celui d'un tiers", "seulement pour les fautes lourdes du préposé du transporteur", "seulement pour les dommages résultant des opérations de conduite et de chargement", "seulement si les clauses exonératoires figurant dans les conditions générales de vente du transporteur le permettent"], "b": 0, "e": "Le transporteur répond de la bonne exécution du contrat, y compris quand le dommage vient d'un tiers auquel il a eu recours.", "u": false},
  {"q": "Question 3. En règle générale, le délai de prescription en matière commerciale est de :", "r": ["2 ans", "5 ans", "10 ans", "30 ans"], "b": 1, "e": "En matière commerciale, la prescription de droit commun est de 5 ans.", "u": false},
  {"q": "Question 4. Lors de la création d'une société de capitaux, l'argent constituant le capital social libéré :", "r": ["reste bloqué pendant toute la durée de vie de la société sur un compte en banque spécial", "reste bloqué uniquement pendant l'accomplissement des formalités de création et est ensuite disponible pour rembourser les associés", "reste bloqué uniquement pendant l'accomplissement des formalités de création et est ensuite disponible pour les besoins de la société", "est fictif et n'est jamais disponible pour la société"], "b": 2, "e": "Après les formalités de création, le capital libéré est disponible pour les besoins de la société.", "u": false},
  {"q": "Question 5. Sur les documents commerciaux d'une entreprise, quelle mention est facultative :", "r": ["le numéro unique d'identification de l'entreprise (SIREN)", "la mention RCS (Registre du commerce et des sociétés)", "le lieu du siège social", "le code NAF (Nomenclature des activités françaises)"], "b": 3, "e": "Le code NAF n'est pas une mention obligatoire des documents commerciaux, contrairement au SIREN, à la mention RCS et au siège social.", "u": false},
  {"q": "Question 6. Dans une SARL (société à responsabilité limitée), le gérant est élu à la majorité des associés :", "r": ["représentant le tiers des parts sociales", "représentant un quart des parts sociales", "représentant plus des trois quarts des parts sociales", "représentant plus de la moitié des parts sociales"], "b": 3, "e": "Le gérant d'une SARL est nommé à la majorité de plus de la moitié des parts sociales.", "u": false},
  {"q": "Question 7. En transport routier intérieur, en cas de retard, pour compenser le préjudice causé, le destinataire ou l'expéditeur peut réclamer, en application du contrat type général :", "r": ["le prix de la marchandise", "le montant du préjudice quel qu'il soit", "au plus le prix du transport", "deux fois le prix du transport"], "b": 2, "e": "En transport intérieur, l'indemnité pour retard ne peut pas dépasser le prix du transport.", "u": false},
  {"q": "Question 8. Dans le cadre d'une créance liée à un contrat de transport, l'injonction de payer doit toujours être faite devant le tribunal du domicile du :", "r": ["débiteur ou de l'un des débiteurs s'ils sont plusieurs", "requérant", "destinataire", "transporteur obligatoirement"], "b": 0, "e": "L'injonction de payer est portée devant le tribunal du domicile du débiteur (ou de l'un des débiteurs).", "u": false},
  {"q": "Question 9. Lors d'un transport routier Paris-Rome, la marchandise est considérée comme perdue si elle n'a pas été livrée dans les :", "r": ["15 jours suivant l'expiration du délai convenu", "30 jours suivant l'expiration du délai convenu", "35 jours suivant l'expiration du délai convenu", "60 jours suivant l'expiration du délai convenu"], "b": 1, "e": "En transport international, la marchandise est considérée comme perdue 30 jours après l'expiration du délai convenu.", "u": false},
  {"q": "Question 10. Les associés d'une SARL (société à responsabilité limitée) peuvent demander communication des comptes annuels du dernier exercice complet :", "r": ["à tout moment", "seulement au gérant et si celui-ci accepte", "seulement lors de l'assemblée générale ordinaire", "seulement lors de l'assemblée générale d'approbation des comptes"], "b": 0, "e": "Les associés d'une SARL peuvent à tout moment consulter les documents sociaux, dont les comptes annuels.", "u": false},
  {"q": "Question 11. Le président d'une société par actions simplifiée (SAS) :", "r": ["est toujours une personne morale", "est obligatoirement un associé de la SAS", "est toujours désigné par un conseil d'administration", "peut être une personne physique ou morale"], "b": 3, "e": "Le président d'une SAS peut être une personne physique ou une personne morale.", "u": false},
  {"q": "Question 12. Le commerçant doit conserver ses documents comptables pendant :", "r": ["3 ans", "5 ans", "8 ans", "10 ans"], "b": 3, "e": "Les documents comptables se conservent 10 ans.", "u": false},
  {"q": "Question 13. Les associés d'une SAS (société par actions simplifiée) ont signé leurs statuts le 13 janvier. L'inscription au RCS (registre du commerce et des sociétés) a été effectuée le 25 janvier. La publicité de la constitution de la société est parue dans un journal d'annonces légales le 30 janvier. L'activité de la société a débuté le 4 mars. À quelle date la société a-t-elle acquis la personnalité morale ?", "r": ["le 13 janvier", "le 30 janvier", "le 25 janvier", "le 4 mars"], "b": 2, "e": "La société acquiert la personnalité morale à la date de son immatriculation au RCS, ici le 25 janvier.", "u": false},
  {"q": "Question 14. La trésorerie nette d'une entreprise correspond :", "r": ["au bénéfice qu'a réalisé l'entreprise au cours de l'exercice", "au montant des disponibilités de l'entreprise", "à la somme du bénéfice et des disponibilités de l'entreprise, diminuée des découverts bancaires", "aux disponibilités de l'entreprise, diminuées des concours bancaires"], "b": 3, "e": "La trésorerie nette correspond aux disponibilités diminuées des concours bancaires.", "u": false},
  {"q": "Question 15. Une provision pour grosses réparations sera inscrite au bilan dans les :", "r": ["dotations aux amortissements et aux provisions exceptionnelles", "amortissements et provisions", "provisions pour risques et charges", "réserves réglementées"], "b": 2, "e": "Une provision pour grosses réparations est inscrite au bilan dans les provisions pour risques et charges.", "u": false},
  {"q": "Question 16. Le seuil de rentabilité est atteint lorsque :", "r": ["l'entreprise dégage sa marge bénéficiaire prévisionnelle", "le chiffre d'affaires permet de couvrir les coûts fixes", "le chiffre d'affaires permet de couvrir tous les coûts", "le chiffre d'affaires permet de couvrir les coûts des charges sociales"], "b": 2, "e": "Le seuil de rentabilité est le chiffre d'affaires qui couvre l'ensemble des coûts, fixes et variables.", "u": false},
  {"q": "Question 17. Dans les entreprises de plus de 50 salariés, la subvention au comité social et économique (CSE) destinée aux activités sociales et culturelles est calculée en tenant compte, entre autres, du pourcentage :", "r": ["des charges sociales", "du chiffre d'affaires hors taxe", "du chiffre d'affaires TTC", "de la masse salariale"], "b": 3, "e": "La subvention aux activités sociales et culturelles du CSE se calcule en pourcentage de la masse salariale.", "u": false},
  {"q": "Question 18. Ne peut assister ou représenter un salarié lors d'une procédure prud'homale :", "r": ["un avocat", "un délégué permanent ou non d'une organisation syndicale", "un salarié de la même branche d'activité", "un inspecteur du travail"], "b": 3, "e": "L'inspecteur du travail ne peut ni assister ni représenter un salarié aux prud'hommes.", "u": false},
  {"q": "Question 19. La formation initiale minimale obligatoire (FIMO) est une formation :", "r": ["non renouvelable et acquise une fois pour toutes", "renouvelable tous les 3 ans", "renouvelable tous les 5 ans", "non renouvelable en cas de suspension ou de retrait du permis de conduire"], "b": 0, "e": "La FIMO est acquise une fois pour toutes ; c'est la FCO qui se renouvelle tous les 5 ans.", "u": false},
  {"q": "Question 20. Une convention collective de branche est conclue entre :", "r": ["les employeurs après consultation de l'inspection du travail", "le ministère du travail et les syndicats", "les représentants du personnel et les délégués syndicaux", "les organisations professionnelles d'employeurs et les organisations syndicales de salariés, représentatives au niveau de cette branche"], "b": 3, "e": "Une convention collective de branche est conclue entre les organisations d'employeurs et les organisations syndicales de salariés représentatives de la branche.", "u": false},
  {"q": "Question 21. Selon le règlement (CE) n° 561/2006, la durée maximale de conduite par période de deux semaines consécutives est de :", "r": ["86 heures", "90 heures", "92 heures", "96 heures"], "b": 1, "e": "Le règlement (CE) n° 561/2006 limite la conduite à 90 heures par période de deux semaines consécutives.", "u": false},
  {"q": "Question 22. L'engagement des poursuites disciplinaires par l'employeur, à partir de sa connaissance d'un fait considéré comme fautif, sauf exercice de poursuites pénales pour le même fait, doit être réalisé dans un délai maximum de :", "r": ["5 jours francs", "2 semaines", "2 mois", "6 mois"], "b": 2, "e": "L'employeur doit engager les poursuites disciplinaires dans un délai de 2 mois à compter de la connaissance du fait fautif.", "u": false},
  {"q": "Question 23. Un employeur qui fait au salarié une avance sur salaire ne peut se rembourser qu'au moyen de retenues successives ne dépassant pas :", "r": ["un vingtième du montant du salaire net exigible", "un dixième du montant du salaire net exigible", "un cinquième du montant du salaire net exigible", "la moitié du montant du salaire net exigible"], "b": 1, "e": "Les retenues pour rembourser une avance sur salaire ne peuvent pas dépasser le dixième du salaire exigible.", "u": false},
  {"q": "Question 24. Selon la convention collective nationale des transports routiers, la 44ème heure de travail hebdomadaire pour les personnels roulants « grands routiers » est majorée de :", "r": ["25 %", "33 %", "50 %", "75 %"], "b": 2, "e": "Pour les grands routiers, la majoration est de 50 % à partir de la 44e heure de travail hebdomadaire.", "u": false},
  {"q": "Question 25. Dans le cas d'horaires individualisés, les employeurs doivent tenir à la disposition de l'inspecteur du travail les documents permettant de comptabiliser les heures de travail effectuées par chaque salarié pendant :", "r": ["deux mois", "un an", "trois ans", "cinq ans"], "b": 1, "e": "Avec des horaires individualisés, le décompte des heures de chaque salarié est tenu à la disposition de l'inspecteur du travail pendant un an.", "u": false},
  {"q": "Question 26. La durée maximale de la période d'essai d'un employé embauché par un contrat à durée déterminée de 18 mois est de :", "r": ["1 mois", "2 mois", "3 mois", "6 mois"], "b": 0, "e": "Pour un CDD de plus de 6 mois, la période d'essai ne peut pas dépasser 1 mois.", "u": false},
  {"q": "Question 27. Un examen médical de reprise doit être organisé au bénéfice d'un salarié après un arrêt de travail pour maladie non professionnelle d'une durée d'au moins :", "r": ["3 jours", "21 jours", "25 jours", "60 jours"], "b": 3, "e": "L'examen médical de reprise est obligatoire après une absence d'au moins 60 jours pour maladie non professionnelle.", "u": false},
  {"q": "Question 28. Le repos hebdomadaire pris par un conducteur routier soumis au règlement (CE) n° 561/2006 peut être réduit, à un minimum de :", "r": ["42 heures", "36 heures", "28 heures", "24 heures"], "b": 3, "e": "Le repos hebdomadaire normal (45 heures) peut être réduit à 24 heures, avec compensation.", "u": false},

];
const POINTS = 2, LETTRES = ["A","B","C","D"];
let ordre = [], i = 0, score = 0, rates = [];
const zone = document.getElementById("zone");

function melange(t) { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; }

function demarrer() {
  ordre = QUESTIONS.map(q => ({ q: q.q, e: q.e, u: q.u, r: q.r.slice(), b: q.b }));
  i = 0; score = 0; rates = []; afficher();
}

function afficher() {
  const Q = ordre[i], n = ordre.length;
  zone.innerHTML = `
    <div class="progres"><span>Question ${i + 1} / ${n}</span><span>${score} / ${n * POINTS} points</span></div>
    <div class="barre"><div style="width:${(i / n) * 100}%"></div></div>
    <p class="question"></p>
    <div class="choix"></div>
    <div class="retour"><div class="titre"></div><div class="exp"></div></div>
    <div class="actions"><button class="btn" id="suivant" hidden>${i + 1 < n ? "Question suivante" : "Voir mon résultat"}</button></div>`;
  zone.querySelector(".question").textContent = Q.q;
  const choix = zone.querySelector(".choix");
  Q.r.forEach((txt, k) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="l">${LETTRES[k]}.</span><span></span>`;
    b.lastChild.textContent = txt;
    b.onclick = () => repondre(k);
    choix.appendChild(b);
  });
}

function repondre(k) {
  const Q = ordre[i], btns = zone.querySelectorAll(".choix button"), ret = zone.querySelector(".retour");
  btns.forEach(b => b.disabled = true);
  btns[Q.b].classList.add("ok");
  if (k === Q.b) {
    score += POINTS;
    ret.className = "retour okk";
  } else {
    btns[k].classList.add("ko");
    rates.push(i + 1);
    ret.className = "retour ko";
  }
  const faux = (k !== Q.b);
  ret.querySelector(".titre").textContent = faux ? "Mauvaise réponse" : "";
  ret.querySelector(".exp").textContent = Q.e;
  if (faux || Q.u) ret.style.display = "block";
  zone.querySelector(".progres span:last-child").textContent = `${score} / ${ordre.length * POINTS} points`;
  const s = document.getElementById("suivant");
  s.hidden = false;
  s.onclick = () => { i++; i < ordre.length ? afficher() : resultat(); };
}

function resultat() {
  const total = ordre.length * POINTS, pct = score / total;
  const msg = pct >= 0.8 ? "Très bon résultat, vous êtes prêt pour l'examen."
            : pct >= 0.5 ? "Résultat correct. Relisez le cours sur les points où vous vous êtes trompé."
            : "Résultat insuffisant. Reprenez les cours avant de recommencer.";
  zone.innerHTML = `
    <div class="barre"><div style="width:100%"></div></div>
    <div class="resultat">
      <div class="score">${score}</div><div class="sur">sur ${total} points</div>
      <div class="msg">${msg}</div>
      <p>${rates.length ? "Questions à revoir : " + rates.join(", ") + "." : "Aucune erreur."}</p>
      <button class="btn" id="recommencer">Recommencer l'annale</button>
    </div>`;
  document.getElementById("recommencer").onclick = demarrer;
}

demarrer();

function envoyerHauteur() {
  try { const h = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height) + 10; parent.postMessage({ annaleH: h }, "*"); } catch (e) {}
}
new MutationObserver(envoyerHauteur).observe(document.getElementById("zone"), { childList: true, subtree: true, attributes: true });
window.addEventListener("resize", envoyerHauteur);
envoyerHauteur();
</script>
