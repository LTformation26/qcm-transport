<style>
:root{--bg:#eff6ea;--surface:#f5f2ea;--surface-2:#fcfbf6;--ink:#1b2530;--muted:#5d6773;--faint:#8a929c;--line:#e5e2db;--line-strong:#d5d1c8;--accent:#23507a;--accent-soft:#eaf0f6;--ok:#276b4e;--ok-bg:#e8f2ec;--ok-line:#bcdcc9;--no:#a83b34;--no-bg:#f6e9e7;--no-line:#e6c5c1;--shadow:0 1px 2px rgba(20,30,45,.04),0 6px 20px rgba(20,30,45,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--surface:#1a1f26;--surface-2:#161b21;--ink:#e8eaed;--muted:#9aa4b0;--faint:#6f7883;--line:#29313a;--line-strong:#3a434e;--accent:#7fb0dd;--accent-soft:#1d2a37;--ok:#63c295;--ok-bg:#15281f;--ok-line:#274b39;--no:#e2938c;--no-bg:#2f1c1a;--no-line:#4d2c29;--shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 120px}
header{padding:40px 0 18px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0}
.lede{color:var(--muted);margin:12px 0 0;font-size:15px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 24px;padding:12px 20px}
.bar-inner{max-width:720px;margin:0 auto;display:flex;gap:14px;align-items:center;justify-content:space-between}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.prog b{color:var(--ink);font-weight:600}
.pts{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.q-num{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.q-text{font-family:"Spectral",Georgia,serif;font-size:19px;line-height:1.35;margin:0 0 16px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}
.opt .let{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .let{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no-bg);border-color:var(--no-line)}.opt.no .let{background:var(--no);border-color:var(--no);color:#fff}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px;color:var(--ink);display:none}
.rule.show{display:block}
.rule p{margin:0 0 5px;line-height:1.55}.rule p:last-child{margin:0}
.result{margin:24px 0 0;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:center;display:none}
.result.show{display:block}
.result .big{font-family:"Spectral",serif;font-weight:700;font-size:46px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:10px 0 0;font-size:15px}.result .msg{margin:14px 0 0;font-weight:600;font-size:16px}
.reset{margin-top:18px;font:inherit;font-size:13px;cursor:pointer;background:none;border:1px solid var(--line-strong);color:var(--muted);padding:8px 18px;border-radius:999px}
.reset:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
<div class="prog"><b id="done">0</b> / <span id="tot">0</span> répondues</div>
<div class="pts">Score : <span id="pts">0</span> / <span id="max">0</span> pts</div>
</div></div>
<div class="wrap">
<header>
<p class="kicker">QCM Commissionnaire de transport</p>
<h1>Commissionnaire · Série 4</h1>
<p class="lede">25 questions · Chaque bonne réponse vaut 2 points.</p>
</header>
<div id="list"></div>
<div class="result" id="result">
<div class="big"><span id="fpts">0</span> / <span id="fmax">50</span></div>
<div class="sub"><span id="fgood">0</span> bonnes réponses sur <span id="fn">25</span> · <span id="fpct">0</span> %</div>
<div class="msg" id="fmsg"></div>
<button class="reset" id="reset">↺ Recommencer</button>
</div>
</div>
<script>
const Q=[{"n":22,"q":"Légalement, un prix de transport doit couvrir :","o":["au moins les charges fixes et variables de l'entreprise de transport","uniquement le cash-flow de l'entreprise","uniquement les charges relatives au renouvellement des véhicules","uniquement la retraite du chef de l'entreprise de transport"],"c":0,"r":["Le prix du transport doit être rémunérateur et au moins égal au coût de revient d'une entreprise bien gérée (charges fixes + variables)."]},{"n":23,"q":"La durée de validité d'une carte de conducteur pour les chronotachygraphes numériques est de :","o":["2 ans","3 ans","5 ans","10 ans"],"c":2,"r":["La carte de conducteur pour tachygraphe numérique est valable administrativement pendant 5 ans."]},{"n":24,"q":"La période d'interdiction de circuler des véhicules de transport de marchandises de plus de 7,5 tonnes de PTAC est :","o":["les dimanches et jours fériés de 6 h 00 à 24 h 00","du dimanche ou jour férié de 6 h 00 au lundi ou lendemain de jour férié à 6 h 00","du samedi ou veille de jour férié à 12 h au dimanche ou jour férié à 18 h 00","du samedi ou veille de jour férié à 22 h 00 au dimanche ou jour férié à 22 h 00"],"c":3,"r":["L'interdiction générale de circuler des poids lourds de plus de 7,5 t s'applique du samedi 22 h au dimanche 22 h (et veilles de jours fériés)."]},{"n":25,"q":"En transport international, en cas de dommages, l'indemnisation de l'ayant-droit porte sur la valeur de la marchandise et :","o":["les frais de transport et les dommages","les frais de transport et les intérêts","les frais de transport, les droits de douane et autres frais annexes","les bénéfices manqués et les frais de transport"],"c":2,"r":["En CMR (art. 23.4), l'indemnité rembourse la valeur de la marchandise, le prix du transport, les droits de douane et les autres frais du transport."]},{"n":26,"q":"Dans le cadre de la Convention marchandises route (CMR), la lettre de voiture internationale doit être établie par :","o":["le transporteur, obligatoirement lors du chargement","l'expéditeur, dès la conclusion du contrat de vente avec le destinataire","le transporteur, dès qu'il reçoit l'ordre de transport de l'expéditeur","l'expéditeur, ou le transporteur sous la responsabilité de l'expéditeur"],"c":3,"r":["La lettre de voiture CMR peut être établie indifféremment par l'expéditeur ou le transporteur, sous la responsabilité de l'expéditeur."]},{"n":28,"q":"À l'occasion d'une exportation de marchandises françaises à destination de la Croatie, afin de bénéficier du régime préférentiel, l'exportateur devra transmettre à l'importateur croate :","o":["un EUR 2 visé par la douane française","un EUR 1 visé par la douane française","une facture visée par la DIRECCTE","un certificat d'origine visé par la Chambre de Commerce française"],"c":1,"r":["Le certificat EUR.1 doit être validé/visé par les autorités douanières pour accorder l'exonération ou la réduction des droits de douane."]},{"n":29,"q":"Un produit est importé, départ usine, de Tokyo à Nancy via Rotterdam. Prix départ : 1 524,49 € ; transport maritime Tokyo-Rotterdam : 304,90 € ; transport Rotterdam-Nancy : 152,45 € ; droits de douane : 10 %. Lors du dédouanement à Nancy, la valeur taxable (soumise à TVA) est :","o":["1 524,49 €","2 164,78 € : (1 524,49 + 304,90 + 152,45) + 10 % (1 524,49 + 304,90)","1 829,39 € : (1 524,49 + 304,90)","1 981,84 € : (1 524,49 + 304,90 + 152,45)"],"c":1,"r":["La valeur taxable à la TVA import comprend la valeur en douane + les droits de douane + les frais de transport interne jusqu'au lieu de destination."]},{"n":30,"q":"La prescription des actions du client à l'encontre d'un commissionnaire de transport est de :","o":["1 an","2 ans","3 ans","10 ans"],"c":0,"r":["Selon l'article L133-6 du Code de commerce, les actions contre les commissionnaires de transport se prescrivent par 1 an."]},{"n":31,"q":"Le commissionnaire de transport peut s'exonérer de sa responsabilité pour perte ou avarie :","o":["s'il y a une clause d'exonération acceptée par le commettant","en cas de faute du transporteur","s'il a la possibilité de se retourner contre le substitué fautif","s'il a la possibilité de faire intervenir l'assureur des marchandises"],"c":1,"r":["Le commissionnaire est responsable de ses substitués ; il ne s'exonère que si le dommage résulte d'un cas de force majeure ou d'une faute de son client."]},{"n":32,"q":"Dans le cadre d'un transport maritime, la fortune de mer est :","o":["le profit que retire le transporteur maritime de la cession des marchandises en cas d'abandon par leur propriétaire","un événement survenu à l'occasion d'une tempête, d'un ouragan","la valeur estimée des marchandises lorsqu'elles ont été volées en cas de piraterie","le montant des indemnités versées par le transporteur pour le préjudice commercial et moral"],"c":1,"r":["En droit maritime, la « fortune de mer » qualifie les événements fortuits et imprévisibles survenus en mer (tempêtes majeures) constituant une force majeure."]},{"n":33,"q":"Parmi les quatre affirmations suivantes, laquelle est vraie :","o":["le commissionnaire de transport ne peut pas faire appel aux services d'un autre commissionnaire de transport","la rémunération du commissionnaire de transport ne peut excéder 15 % du prix facturé à son client","en cas de perte et avarie, le commissionnaire de transport est en droit de se retourner contre le transporteur sauf exonération de celui-ci","le privilège du commissionnaire ne peut être exercé sur les marchandises en sa possession que pour les seules créances afférentes à ces marchandises"],"c":2,"r":["Même s'il indemnise son client, le commissionnaire conserve son recours récursoire contre le transporteur effectif coupable de la faute."]},{"n":34,"q":"En l'absence d'établissement d'une Lettre de Transport Aérien (LTA) pour un transport soumis à la convention de Montréal :","o":["le contrat de transport aérien est réputé n'avoir pas été conclu","la convention de Varsovie pourra trouver application","le transporteur ne pourra pas bénéficier de la limitation de l'indemnité pour dommage","le contrat de transport peut néanmoins avoir été valablement conclu"],"c":3,"r":["Selon la Convention de Montréal (art. 3.5), l'absence, l'irrégularité ou la perte de la LTA n'affecte pas l'existence ni la validité du contrat."]},{"n":35,"q":"Le commissionnaire groupeur remettant à un transporteur un groupage de marchandises dangereuses :","o":["est tenu de se porter garant de l'exactitude concernant la nature de la marchandise","est tenu d'informer le transporteur des déclarations faites par les chargeurs","est présumé responsable des fausses déclarations des chargeurs","n'a pas à prendre en compte la nature dangereuse des marchandises"],"c":0,"r":["Vis-à-vis du transporteur qu'il mandate, le groupeur a la qualité d'expéditeur et garantit l'exactitude des déclarations sur la marchandise (ADR)."]},{"n":36,"q":"En transport routier, en cas d'avarie à la marchandise ayant pour origine une grave faute de conduite du conducteur préposé du transporteur, le commissionnaire vis-à-vis de son client chargeur :","o":["peut dégager sa responsabilité en apportant la preuve de la faute du transporteur","voit sa responsabilité partagée avec celle du conducteur","est toujours responsable","n'est plus responsable"],"c":2,"r":["Le commissionnaire de transport s'engage sur un résultat et répond des fautes de tous ses intermédiaires substitués, de bout en bout."]},{"n":37,"q":"Le commissionnaire de transport peut exercer son droit de rétention :","o":["à l'occasion d'un litige avec le transporteur","seulement si le transporteur est en relation suivie avec lui","pour obliger l'expéditeur à lui payer une facture ancienne","en cas de rupture de contrat avec l'expéditeur"],"c":2,"r":["L'article L132-2 du Code de commerce lui octroie un privilège (droit de rétention) sur les marchandises reçues, pour l'ensemble de ses créances envers le client."]},{"n":38,"q":"Un commissionnaire de transport français fait effectuer un transport international de marchandises communautaires pour le compte d'un donneur d'ordre belge (identifié TVA-CEE), de Barcelone (Espagne) à Groningen (Pays-Bas). Le commissionnaire doit établir une facture :","o":["toutes taxes comprises (TTC) en faisant ressortir la TVA française","toutes taxes comprises (TTC) en faisant ressortir la TVA belge","toutes taxes comprises (TTC) en faisant ressortir la TVA espagnole","hors taxes (HT), le donneur d'ordre devant auto-liquider la TVA auprès des services fiscaux belges"],"c":3,"r":["Une prestation de service transfrontalière B2B entre assujettis européens (ex. France-Belgique) est facturée hors taxe, avec auto-liquidation par le client."]},{"n":39,"q":"La limite d'indemnisation du transporteur aérien, en cas de retard, est :","o":["égale au plus au prix du transport","égale à la limitation pour perte ou avarie","égale à trois fois le prix du transport","obligatoirement contractuelle"],"c":1,"r":["En aérien (Convention de Montréal), la responsabilité pour retard est alignée sur le plafond marchandises, à hauteur de 22 DTS/kg."]},{"n":40,"q":"Le transporteur maritime peut dégager sa responsabilité :","o":["s'il a fait accepter au chargeur une clause exonératoire de responsabilité, préalablement au chargement","en cas d'avarie intervenue durant les opérations de chargement","en cas de retard, dûment établi, dans la délivrance du connaissement","en cas de faute nautique du capitaine"],"c":3,"r":["En droit maritime classique, la faute nautique (manœuvre ou gestion du navire) du capitaine exonère le transporteur maritime."]},{"n":41,"q":"Le délai de prescription des actions nées du contrat de transport aérien est de :","o":["10 ans","2 ans","5 ans","1 an"],"c":1,"r":["L'article 35 de la Convention de Montréal fixe le délai d'extinction des actions en responsabilité aérienne à 2 ans."]},{"n":42,"q":"La lettre de crédit stand by :","o":["est un moyen de paiement","est soumise aux mêmes règles que le crédit documentaire","est une garantie de paiement en cas de défaillance de l'acheteur","ne peut couvrir qu'une seule expédition"],"c":2,"r":["La lettre de crédit stand-by (SBLC) est une garantie bancaire de remplacement, payable uniquement si l'acheteur fait défaut à l'échéance."]},{"n":43,"q":"En cas d'avarie de la marchandise, le commissionnaire est responsable :","o":["uniquement des fautes du transporteur affrété","uniquement de ses propres fautes","du mauvais conditionnement de la marchandise","de ses propres fautes et de celles de ses substitués"],"c":3,"r":["Le commissionnaire est responsable personnellement de ses erreurs d'organisation et des fautes commises par les transporteurs qu'il s'est substitués."]},{"n":44,"q":"Le connaissement est un document :","o":["de transport maritime","attestant l'origine des marchandises","douanier","attestant le crédit documentaire"],"c":0,"r":["Le connaissement maritime (Bill of Lading) fait foi du contrat, de la prise en charge, et constitue le titre négociable de propriété de la marchandise."]},{"n":45,"q":"Le vol camionné est :","o":["le transport de véhicules routiers par avion","un transport routier de marchandises sous couvert d'une L.T.A.","l'assurance du vol des camions et des marchandises","le transfert des marchandises par voie routière sur la plate-forme aéroportuaire"],"c":1,"r":["Le « vol camionné » est un pré/post-acheminement routier exécuté sous le couvert et le régime juridique d'une LTA aérienne."]},{"n":46,"q":"Parmi les droits et taxes à acquitter éventuellement lors d'une mise à la consommation d'une marchandise provenant d'un pays hors de l'UE, ne figure pas :","o":["la TIPP (taxe intérieure sur les produits pétroliers)","les droits de douane","la TVA","les droits d'accise"],"c":0,"r":["La TICPE (ex-TIPP) est une taxe nationale de consommation interne française, et non un droit de douane perçu à la mise à la consommation."]},{"n":47,"q":"La convention de Budapest du 22 juin 2010 est une convention qui concerne le transport :","o":["maritime","fluvial","routier","aérien"],"c":1,"r":["La Convention de Budapest (CMNI) régit le contrat de transport international de marchandises par navigation intérieure (fluvial)."]}];
const POINTS=2, LET=["a","b","c","d"];
const list=document.getElementById('list'),doneEl=document.getElementById('done'),ptsEl=document.getElementById('pts'),maxEl=document.getElementById('max'),totEl=document.getElementById('tot');
const answered={};let good=0;
totEl.textContent=Q.length;maxEl.textContent=Q.length*POINTS;document.getElementById('fmax').textContent=Q.length*POINTS;document.getElementById('fn').textContent=Q.length;
function updateBar(){const n=Object.keys(answered).length;doneEl.textContent=n;ptsEl.textContent=good*POINTS;const res=document.getElementById('result');
if(n===Q.length){document.getElementById('fpts').textContent=good*POINTS;document.getElementById('fgood').textContent=good;const pct=Math.round(good/Q.length*100);document.getElementById('fpct').textContent=pct;let m;if(pct>=80)m="Excellent";else if(pct>=60)m="À retravailler";else if(pct>=40)m="Trop juste";else m="Insuffisant";document.getElementById('fmsg').textContent=m;res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'center'});}else res.classList.remove('show');}
function hasR(r){return r&&(Array.isArray(r)?r.length:true);}
function render(){list.innerHTML='';Q.forEach((q,i)=>{const card=document.createElement('div');card.className='q';const num=document.createElement('p');num.className='q-num';num.textContent='Question '+(i+1);card.appendChild(num);const qt=document.createElement('p');qt.className='q-text';qt.textContent=q.q;card.appendChild(qt);const opts=document.createElement('div');opts.className='opts';const CORR=Array.isArray(q.c)?q.c:[q.c];q.o.forEach((txt,j)=>{const btn=document.createElement('button');btn.className='opt';const l=document.createElement('span');l.className='let';l.textContent=LET[j];const sp=document.createElement('span');sp.textContent=txt;btn.appendChild(l);btn.appendChild(sp);const done=answered[i];if(done!==undefined){btn.disabled=true;if(CORR.includes(j))btn.classList.add('ok');else if(j===done)btn.classList.add('no');}else{btn.onclick=()=>{answered[i]=j;if(CORR.includes(j))good++;render();updateBar();};}opts.appendChild(btn);});card.appendChild(opts);if(hasR(q.r)){const rule=document.createElement('div');rule.className='rule';(Array.isArray(q.r)?q.r:[q.r]).forEach(t=>{const p=document.createElement('p');p.textContent=t;rule.appendChild(p);});if(answered[i]!==undefined)rule.classList.add('show');card.appendChild(rule);}list.appendChild(card);});}
document.getElementById('reset').onclick=()=>{for(const k in answered)delete answered[k];good=0;render();updateBar();window.scrollTo({top:0,behavior:'smooth'});};
render();updateBar();
</script>
</body>
</html>
